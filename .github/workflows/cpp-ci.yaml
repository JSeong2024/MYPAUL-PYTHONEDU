name: Cpp CI

on:
  push:
    branches: [main]
    paths:
      - 'MoreStudy/C\+\+/**'
      - '.github/workflows/cpp-ci.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'MoreStudy/C\+\+/**'
      - '.github/workflows/cpp-ci.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: ${{ matrix.name }} / C++20
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            compiler: g++-14
          - name: Clang
            compiler: clang++
    env:
      CXX: ${{ matrix.compiler }}
      CPP_ROOT: MoreStudy/C++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify compiler and build tools
        run: |
          "$CXX" --version
          cmake --version
          python3 --version

      - name: Check standalone C++20 source files
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['CPP_ROOT'])
          sources = sorted(
              source
              for chapter in root.glob('Chapter-*')
              for folder in ('examples', 'solutions')
              for source in (chapter / folder).glob('*.cpp')
          )
          sources += sorted((root / 'Summary-Part-01' / 'solutions').glob('*.cpp'))
          if not sources:
              raise SystemExit('No standalone C++ sources found')

          for number, source in enumerate(sources, start=1):
              print(f'[{number}/{len(sources)}] {source}', flush=True)
              subprocess.run(
                  [os.environ['CXX'], '-std=c++20', '-Wall', '-Wextra',
                   '-Wpedantic', '-fsyntax-only', str(source)],
                  check=True,
              )
          print(f'Syntax checks passed: {len(sources)} source files')
          PY

      - name: Build standalone multi-file examples
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT

          "$CXX" -std=c++20 -Wall -Wextra -Wpedantic \
            "$CPP_ROOT/Chapter-05/examples/10_multi_file/main.cpp" \
            "$CPP_ROOT/Chapter-05/examples/10_multi_file/inventory.cpp" \
            -o "$build_dir/inventory"
          "$build_dir/inventory"

          "$CXX" -std=c++20 -Wall -Wextra -Wpedantic \
            "$CPP_ROOT/Chapter-08/examples/13_device_registry_main.cpp" \
            "$CPP_ROOT/Chapter-08/examples/13_device_registry.cpp" \
            -o "$build_dir/device_registry"
          "$build_dir/device_registry"
