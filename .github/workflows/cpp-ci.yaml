name: Cpp CI

on:
  push:
    branches: [main]
    paths:
      - 'MoreStudy/C\+\+/**'
      - '.github/workflows/cpp-ci.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'MoreStudy/C\+\+/**'
      - '.github/workflows/cpp-ci.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: ${{ matrix.name }} / C++20
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            compiler: g++-14
          - name: Clang
            compiler: clang++
    env:
      CXX: ${{ matrix.compiler }}
      CPP_ROOT: MoreStudy/C++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify compiler and build tools
        run: |
          "$CXX" --version
          cmake --version
          python3 --version

      - name: Check standalone C++20 source files
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['CPP_ROOT'])
          sources = sorted(
              source
              for chapter in root.glob('Chapter-*')
              for folder in ('examples', 'solutions')
              for source in (chapter / folder).glob('*.cpp')
          )
          sources += sorted((root / 'Summary-Part-01' / 'solutions').glob('*.cpp'))
          if not sources:
              raise SystemExit('No standalone C++ sources found')

          for number, source in enumerate(sources, start=1):
              print(f'[{number}/{len(sources)}] {source}', flush=True)
              subprocess.run(
                  [os.environ['CXX'], '-std=c++20', '-Wall', '-Wextra',
                   '-Wpedantic', '-fsyntax-only', str(source)],
                  check=True,
              )
          print(f'Syntax checks passed: {len(sources)} source files')
          PY

      - name: Build standalone multi-file examples
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT

          "$CXX" -std=c++20 -Wall -Wextra -Wpedantic \
            "$CPP_ROOT/Chapter-05/examples/10_multi_file/main.cpp" \
            "$CPP_ROOT/Chapter-05/examples/10_multi_file/inventory.cpp" \
            -o "$build_dir/inventory"
          "$build_dir/inventory"

          "$CXX" -std=c++20 -Wall -Wextra -Wpedantic \
            "$CPP_ROOT/Chapter-08/examples/13_device_registry_main.cpp" \
            "$CPP_ROOT/Chapter-08/examples/13_device_registry.cpp" \
            -o "$build_dir/device_registry"
          "$build_dir/device_registry"

      - name: Build CMake projects and run CTest
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            "$CPP_ROOT/Chapter-09/examples/16_robot_monitor"
            "$CPP_ROOT/Chapter-10/examples/17_event_summary"
            "$CPP_ROOT/Chapter-11/examples/17_sensor_report"
            "$CPP_ROOT/Chapter-12/examples/17_device_session"
            "$CPP_ROOT/Chapter-13/examples/17_telemetry_pipeline"
            "$CPP_ROOT/Chapter-14/examples/17_sensor_dispatcher"
            "$CPP_ROOT/Chapter-15/examples/17_sensor_batch_analyzer"
            "$CPP_ROOT/Chapter-16/examples/17_device_report"
            "$CPP_ROOT/Chapter-16/solutions/advanced_pipeline"
            "$CPP_ROOT/Chapter-16/solutions/pro_sensor_sdk"
            "$CPP_ROOT/Chapter-17/examples/17_device_validator"
            "$CPP_ROOT/Chapter-17/solutions/advanced_event_audit"
            "$CPP_ROOT/Chapter-17/solutions/pro_quality_gate"
            "$CPP_ROOT/Chapter-18/examples/17_loopback_echo"
            "$CPP_ROOT/Chapter-18/solutions/advanced_telemetry_server"
            "$CPP_ROOT/Chapter-18/solutions/pro_loopback_sdk"
          )
          build_root="$(mktemp -d)"
          trap 'rm -rf "$build_root"' EXIT

          for project in "${projects[@]}"; do
            echo "::group::$project"
            if [[ ! -f "$project/CMakeLists.txt" ]]; then
              echo "Missing CMake project: $project" >&2
              exit 1
            fi
            build_dir="$build_root/$(basename "$project")"
            cmake -S "$project" -B "$build_dir" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_CXX_STANDARD=20 \
              -DCMAKE_CXX_STANDARD_REQUIRED=ON \
              -DCMAKE_CXX_EXTENSIONS=OFF \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "$build_dir" --parallel 2
            ctest --test-dir "$build_dir" --output-on-failure --no-tests=error
            echo '::endgroup::'
          done

      - name: Run Chapter 01-18 behavior tests
        shell: bash
        run: |
          set -euo pipefail
          for number in {1..18}; do
            printf -v chapter '%s/Chapter-%02d' "$CPP_ROOT" "$number"
            check="$chapter/tests/check.py"
            if [[ ! -f "$check" ]]; then
              echo "Missing chapter test script: $check" >&2
              exit 1
            fi
            echo "::group::$chapter"
            case "$number" in
              1|2|3|10|11|12|13|14|15|16|17|18)
                python3 "$check" --compiler "$CXX"
                ;;
              *)
                python3 "$check"
                ;;
            esac
            echo '::endgroup::'
          done

      - name: Run Summary Part 01 problem tests
        shell: bash
        run: |
          set -euo pipefail
          check="$CPP_ROOT/Summary-Part-01/tests/check.py"
          if [[ ! -f "$check" ]]; then
            echo "Missing summary test script: $check" >&2
            exit 1
          fi
          python3 "$check" --compiler "$CXX"
