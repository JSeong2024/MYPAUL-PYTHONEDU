name: Cpp CI Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: GCC 14 Environment Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Verify compiler and build tools
        run: |
          g++-14 --version
          cmake --version
