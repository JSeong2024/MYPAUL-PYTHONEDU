/* Desktop reading scale */
body{font-size:16px;line-height:1.72}
.app{grid-template-columns:275px minmax(0,1fr)}
.main{padding:32px clamp(22px,3vw,58px) 80px}
.toolbar,.filterbar,.bottom-nav,#quizView,.sheet{max-width:1120px}
.sheet{min-height:1120px}
.sheet-content{padding:56px clamp(35px,5.1vw,84px) 86px}
.sheet-footer{padding:0 clamp(35px,5.1vw,84px) 23px}
.sheet-meta{font-size:11px;margin-bottom:38px}
.problem-header{gap:26px;padding-bottom:27px}
.problem-no{flex-basis:88px;height:88px}
.problem-no strong{font-size:30px}
.header-titles h2{font-size:clamp(28px,3.1vw,41px)}
.summary{font-size:16px;line-height:1.85;margin:32px 0 30px}
.section-label{font-size:17px;margin:33px 0 13px}
.statement{font-size:15.5px;line-height:1.9}
.tasks{font-size:14px;line-height:1.85;padding:18px 22px 18px 48px}
.io h3{font-size:15px}
.io p{font-size:14px}
.io-kicker,.sample-label{font-size:11px}
.chips{gap:8px}.chip{font-size:12px;padding:6px 11px}
.sample-heading{font-size:17px;margin-top:33px}
.sample-card pre{font-size:13.5px;padding:20px 22px;min-height:116px}
.note{padding:19px 20px;grid-template-columns:65px 1fr}
.note span{font-size:13.5px}
.folds summary,.implementation-guide summary{font-size:14px}
.fold-body{font-size:13.5px}
.ref{font-size:13px;padding:12px 13px}
.guide-sheet .guide-grid{grid-template-columns:1fr;gap:16px;margin-top:22px}
.guide-sheet .guide-card{padding:20px 25px;background:#f8fbff}
.guide-sheet .guide-card h3{font-size:17px;margin:0 0 11px}
.guide-sheet .guide-card .guide-en{font-size:12px;color:#607a95;font-weight:650;margin-left:6px}
.guide-sheet .guide-card li{font-size:14px;line-height:1.8;margin-bottom:7px}
.guide-list{padding-left:24px;margin:0}
.guide-sheet .guide-tip{margin-top:22px;font-size:14px;padding:20px 22px}
.guide-levels{padding:21px 25px;border:1px solid #d8e2ed;border-radius:10px;margin-top:16px}
.guide-levels>strong{font-size:14px;color:#183453;display:block;margin-bottom:11px}
.guide-level-chips{display:flex;gap:8px;flex-wrap:wrap}
.guide-level-chips span{display:inline-flex;align-items:center;gap:7px;background:#f4f8fc;border:1px solid #dbe6f2;padding:8px 12px;border-radius:8px;color:#51647a;font-size:12px}
.guide-level-chips b{color:#274563}
.implementation-guide{margin-top:24px;border:1px solid var(--accentborder);background:#fbfcff;border-radius:10px;overflow:hidden}
.implementation-guide summary{padding:15px 20px;justify-content:flex-start;gap:11px;color:var(--accent)}
.implementation-guide summary small{font-size:11px;color:#8191a3;font-weight:500;margin-left:4px}
.implementation-guide summary:after{margin-left:auto}
.implementation-guide[open] summary{border-bottom:1px solid var(--accentborder)}
.hint-body{padding:9px 20px 17px}
.hint-steps{list-style:none;margin:0;padding:0}
.hint-steps li{display:grid;grid-template-columns:87px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid #e9eef6}
.hint-steps li:last-child{border-bottom:0}
.hint-steps .step-label{font:800 11px/1.8 Consolas,monospace;color:var(--accent);letter-spacing:.08em}
.hint-steps p{font-size:13.5px;line-height:1.7;margin:0;color:#445a71}
.implementation-guide[data-guide-level="challenge"]{background:#fffefb}
.implementation-guide[data-guide-level="challenge"] .hint-steps p{font-size:13px}
#quizView{max-width:1120px}
.quiz-banner{padding:36px 45px}
.quiz-banner h2{font-size:34px}
.quiz-banner p{font-size:14px}
.quiz-item{padding:28px 36px}
.quiz-item h3{font-size:18px;line-height:1.7}
.quiz-options{gap:10px}
.quiz-choice{padding:14px 16px}
.quiz-choice .choice-text{font-size:14.5px}
.quiz-index{font-size:12px}
.radiant-sheet .problem-no img{width:88px;height:88px}

const quiz=[{"id":"Q-01","kind":"mcq","chapter":1,"q":"C++20 표준 출력과 관련된 설명 중 **가장 올바른 것**을 고르시오.","choices":["`std::cout << std::format(\"{}\", \"Hello\");`를 출력하려면 `<iostream>`과 `<format>` 헤더가 필요하다.","`std::println(\"Hello\");`는 C++20 표준에 포함되어 있으므로 `<iostream>` 없이 바로 사용할 수 있다.","`using namespace std;`를 선언하면 `cout.print(\"Hello\");` 형태로 출력할 수 있다.","표준 출력 스트림 객체는 전역 객체이므로 별도의 헤더 없이 `std::cout`을 바로 사용할 수 있다."],"correct":0,"why":"**정답 설명:** C++20의 `std::format`은 `<format>`에 선언되어 있고, `std::cout`은 `<iostream>`에 선언되어 있습니다. 형식화된 문자열을 출력할 때 두 헤더를 명시적으로 포함하는 것이 올바릅니다.","wrong":[{"n":2,"title":"C++20과 C++23 표준 혼동","body":"`std::println`과 `<print>`는 C++23부터 제공됩니다. C++20의 표준 출력 기능으로 간주할 수 없습니다."},{"n":3,"title":"존재하지 않는 멤버 함수","body":"`std::cout`에는 `.print()` 멤버 함수가 없습니다. `using namespace std;`를 사용하더라도 새로운 멤버 함수가 생기지 않습니다."},{"n":4,"title":"헤더 선언과 객체의 수명 혼동","body":"`std::cout`이 전역 스트림 객체라는 사실과, 소스에서 해당 이름을 사용하기 위한 선언은 별개입니다. `<iostream>`을 직접 포함해야 합니다."}]},{"id":"Q-02","kind":"mcq","chapter":2,"q":"다음 코드에서 일어나는 일은 무엇입니까?","choices":["`value`는 `3`이 됩니다.","`value`는 `4`가 됩니다.","축소 변환(Narrowing Conversion) 때문에 컴파일 오류가 발생합니다.","실행할 때만 오류가 발생합니다."],"correct":2,"why":"**중괄호 초기화(Brace Initialization)** 는 실수에서 정수로의 축소 변환처럼 값이 손실될 수 있는 초기화를 허용하지 않습니다. 따라서 `int value{3.5};`는 컴파일되지 않습니다. 반면 `int value(3.5);`는 변환을 허용해 정수 `3`을 저장합니다.","wrong":[{"n":1,"title":"암묵적 변환과 중괄호 초기화 혼동","body":"다른 초기화 방식에서 `3.5`가 `3`으로 변환될 수 있지만, 중괄호 초기화는 이 축소 변환을 거부합니다."},{"n":2,"title":"반올림 혼동","body":"실수에서 정수로 변환할 때 자동 반올림하여 `4`가 되는 것은 아닙니다."},{"n":4,"title":"오류 발생 시점","body":"이 코드는 실행 시점이 아니라 컴파일 시점에 진단됩니다."}],"code":"int value{3.5};"},{"id":"Q-03","kind":"mcq","chapter":3,"q":"`x`가 `0`일 때, 다음 조건식의 동작은 무엇입니까?","choices":["`0`으로 나누기 연산이 실행되어 오류가 발생합니다.","오른쪽 항을 평가하지 않고 전체 결과가 `false`가 됩니다.","조건식은 `true`가 됩니다.","조건식의 문법이 잘못되어 컴파일되지 않습니다."],"correct":1,"why":"논리 AND 연산자 `&&`는 **단락 평가(Short-circuit Evaluation)** 를 수행합니다. 왼쪽 조건 `x != 0`이 `false`이므로 오른쪽 `10 / x > 2`는 평가하지 않습니다. 따라서 0으로 나누기 연산은 실행되지 않습니다.","wrong":[{"n":1,"title":"단락 평가 누락","body":"오른쪽 식은 실행되지 않으므로 0으로 나누지 않습니다."},{"n":3,"title":"논리 AND의 결과 판단 오류","body":"`&&`는 왼쪽 항이 거짓이면 전체 결과도 거짓입니다."},{"n":4,"title":"실행 시 평가와 문법의 혼동","body":"`x`가 정수로 선언되어 있다면 식 자체는 올바른 C++ 표현식입니다."}],"code":"x != 0 && 10 / x > 2"},{"id":"Q-04","kind":"mcq","chapter":4,"q":"다음 반복문의 출력 결과는 무엇입니까?","choices":["`123`","`012`","`01`","`0123`"],"correct":1,"why":"`i`는 `0`부터 시작하여 `0`, `1`, `2`일 때만 반복문 본문을 실행합니다. `i`가 `3`이 되는 순간 `i < 3`이 거짓이므로 종료됩니다. 따라서 공백 없이 `012`가 출력됩니다.","wrong":[{"n":1,"title":"시작값 누락","body":"`i`의 초깃값은 `1`이 아니라 `0`입니다."},{"n":3,"title":"반복 종료 시점 오해","body":"`i == 2`인 반복도 `i < 3`을 만족합니다."},{"n":4,"title":"끝값 포함 착각","body":"`i == 3`에서는 조건이 거짓이므로 `3`은 출력되지 않습니다."}],"code":"for (int i = 0; i < 3; ++i) {\n    std::cout << i;\n}"},{"id":"Q-05","kind":"mcq","chapter":5,"q":"함수 내부에서 호출자(Caller)의 정수 변수 값을 **직접 변경**하려면 어떤 매개변수가 가장 적절합니까?","choices":["`int value`","`const int& value`","`int& value`","`const int value`"],"correct":2,"why":"`int&`는 호출자의 원본 정수에 대한 **참조 전달(Pass by Reference)** 입니다. 이 참조로 값을 변경하면 호출자의 변수에도 반영됩니다.","wrong":[{"n":1,"title":"값 전달","body":"매개변수가 복사본이므로 함수 내부의 수정이 원본에 반영되지 않습니다."},{"n":2,"title":"읽기 전용 참조","body":"`const int&`는 원본을 참조하지만 참조를 통한 수정은 금지됩니다."},{"n":4,"title":"상수 복사본","body":"`const int`는 복사된 값을 함수 안에서도 수정할 수 없게 합니다."}]},{"id":"Q-06","kind":"mcq","chapter":6,"q":"`std::vector<int> v{1, 2, 3};`에 대한 설명 중 **가장 옳은 것**은 무엇입니까?","choices":["`v[3]`은 안전하게 `0`을 반환합니다.","`v.at(3)`은 범위를 검사한 뒤 예외(`std::out_of_range`)를 던집니다.","`v[3]`은 유효하지 않은 인덱스이므로 항상 컴파일 오류를 발생시킵니다.","`v.at(3)`은 범위를 벗어나면 자동으로 새 요소를 추가합니다."],"correct":1,"why":"`std::vector`의 유효 인덱스는 `0`, `1`, `2`입니다. `at()`은 인덱스를 검사하고 범위 밖이면 `std::out_of_range` 예외를 던집니다. 반면 `operator[]`는 범위를 검사하지 않으며, 이 경우 접근하면 **미정의 동작(Undefined Behavior, UB)** 입니다.","wrong":[{"n":1,"title":"범위 밖 접근","body":"`v[3]`으로 존재하지 않는 요소를 읽는 동작은 보장되지 않습니다."},{"n":3,"title":"컴파일 오류와 런타임 오류 구별","body":"`v[3]`은 문법상 유효하며 컴파일러가 반드시 잡아주지 않습니다."},{"n":4,"title":"컨테이너 인터페이스 혼동","body":"`at()`은 접근 함수이고, 요소 추가는 `push_back()` 또는 `emplace_back()` 등의 역할입니다."}]},{"id":"Q-07","kind":"mcq","chapter":7,"q":"함수 내부 지역 변수(Local Variable)의 참조(Reference)를 반환한 뒤 호출자가 그 참조로 값에 접근하면 어떤 문제가 발생할 수 있습니까?","choices":["항상 자동으로 깊은 복사(Deep Copy)가 이루어집니다.","지역 변수의 수명이 끝나 댕글링 참조(Dangling Reference)가 되며, 이를 사용하면 미정의 동작이 발생할 수 있습니다.","컴파일러가 반드시 문법 오류로 거부합니다.","`std::string` 타입에서만 안전하게 작동합니다."],"correct":1,"why":"일반 지역 객체는 함수 종료 시 수명이 끝납니다. 그 객체를 가리키는 참조를 반환하면 **댕글링 참조(Dangling Reference)** 가 되며, 수명이 끝난 객체에 접근하는 것은 미정의 동작입니다. 컴파일러 경고가 나오더라도 항상 오류로 차단되는 것은 아닙니다.","wrong":[{"n":1,"title":"참조와 복사 혼동","body":"참조 반환은 값을 복사하지 않습니다."},{"n":3,"title":"컴파일러 진단 보장 오해","body":"진단이 가능해도 컴파일 오류로 반드시 거부된다는 보장은 없습니다."},{"n":4,"title":"자료형에 따른 안전성 착각","body":"지역 객체 수명이 끝나는 문제는 문자열에만 한정되지 않습니다."}]},{"id":"Q-08","kind":"mcq","chapter":8,"q":"클래스가 수량(Quantity)을 항상 `0` 이상으로 유지해야 할 때 가장 알맞은 설계는 무엇입니까?","choices":["수량 멤버를 `public`으로 두어 외부에서 자유롭게 수정하게 합니다.","수량 멤버를 `private`으로 보호하고, 생성과 수정 과정에서 유효 범위를 검사합니다.","출력할 때만 음수를 `0`으로 바꿔 보여줍니다.","음수를 그대로 저장하고 문제가 발생하면 나중에 처리합니다."],"correct":1,"why":"**캡슐화(Encapsulation)** 는 내부 상태에 대한 무분별한 접근을 제한합니다. 생성자와 상태 변경 함수에서 조건을 검사해 **불변 조건(Invariant)** 인 `quantity >= 0`을 계속 만족하도록 만드는 것이 핵심입니다.","wrong":[{"n":1,"title":"무제한 외부 수정","body":"외부에서 음수를 직접 대입할 수 있어 불변 조건을 유지할 수 없습니다."},{"n":3,"title":"표시와 상태 혼동","body":"화면에서만 값을 고쳐 보여도 객체 내부에는 잘못된 상태가 남습니다."},{"n":4,"title":"검증 책임 지연","body":"객체는 유효하지 않은 값을 받아들이지 않도록 상태 변경 시점에 검증해야 합니다."}]},{"id":"Q-09","kind":"mcq","chapter":9,"q":"기본 클래스(Base Class)의 포인터나 참조로 파생 클래스(Derived Class)에서 재정의한 함수를 동적으로 호출하려면 기본 클래스의 해당 함수가 무엇이어야 합니까?","choices":["`static`","`virtual`","`explicit`","`friend`"],"correct":1,"why":"기본 클래스의 멤버 함수를 `virtual`로 선언하면 실제 객체 타입에 따라 재정의된 함수가 호출되는 **동적 디스패치(Dynamic Dispatch)** 가 가능합니다. 파생 클래스 쪽에는 `override`를 붙여 재정의를 검사하는 것이 좋습니다.","wrong":[{"n":1,"title":"정적 멤버 혼동","body":"`static` 멤버 함수는 가상 함수가 될 수 없습니다."},{"n":3,"title":"명시적 변환 키워드","body":"`explicit`은 생성자나 변환 함수의 암묵적 변환을 제어하는 데 사용합니다."},{"n":4,"title":"접근 권한 키워드","body":"`friend`는 지정한 함수나 클래스에 접근 권한을 부여합니다."}]},{"id":"Q-10","kind":"mcq","chapter":10,"q":"다음 중 **키(Key)를 기준으로 오름차순 정렬된 상태를 유지**하며 요소를 순회해야 할 때 가장 적절한 C++ STL 컨테이너는 무엇입니까?","choices":["`std::unordered_map`","`std::vector`만 가능","`std::map`","`std::stack`"],"correct":2,"why":"`std::map`은 기본 비교자인 `std::less`를 사용해 키의 오름차순으로 요소를 유지하고 순회합니다. 일반적으로 균형 이진 탐색 트리로 구현되지만 구체적인 트리 종류까지 표준에서 강제하지는 않습니다.","wrong":[{"n":1,"title":"해시 컨테이너의 순서 보장 착각","body":"`std::unordered_map`은 순회 순서를 정렬된 상태로 보장하지 않습니다."},{"n":2,"title":"정렬 유지 기능 혼동","body":"`std::vector`로도 정렬된 결과를 만들 수 있지만 삽입 때마다 정렬을 유지하려면 추가 처리가 필요합니다."},{"n":4,"title":"컨테이너 어댑터의 목적","body":"`std::stack`은 가장 나중에 넣은 요소부터 꺼내는 구조이며 키 기반 정렬 순회용이 아닙니다."}]},{"id":"Q-11","kind":"mcq","chapter":10,"q":"정렬 기준(키)이 동일한 항목들의 **원래 순서(상대적 순서)가 정렬 후에도 그대로 유지**되어야 할 때 사용할 수 있는 C++ 표준 알고리즘은 무엇입니까?","choices":["`std::sort`","`std::stable_sort`","`std::reverse`","`std::find`"],"correct":1,"why":"`std::stable_sort`는 비교 기준상 동등한 항목끼리의 **상대적 순서**를 보존하는 안정 정렬(Stable Sort)을 제공합니다. 일반 `std::sort`는 그 순서를 보존한다고 보장하지 않습니다.","wrong":[{"n":1,"title":"일반 정렬의 안정성 착각","body":"`std::sort`는 키가 같은 요소의 상대적 순서를 유지할 의무가 없습니다."},{"n":3,"title":"정렬과 뒤집기 혼동","body":"`std::reverse`는 구간의 순서를 뒤집을 뿐 키로 정렬하지 않습니다."},{"n":4,"title":"탐색 알고리즘","body":"`std::find`는 일치하는 항목을 찾는 알고리즘이지 정렬 알고리즘이 아닙니다."}]},{"id":"Q-12","kind":"mcq","chapter":11,"q":"CSV 데이터에서 `\"상품, 파랑\",300`처럼 따옴표 안에 쉼표가 있는 필드를 **쉼표(`,`)만 기준으로 분리**하면 어떤 문제가 발생합니까?","choices":["문제 없이 정확히 두 필드로 분리됩니다.","따옴표 안의 쉼표까지 구분자로 오해하여 데이터가 잘못 나뉩니다.","파싱할 때 항상 빈 문자열만 반환합니다.","C++20에서는 CSV 파일을 읽을 수 없습니다."],"correct":1,"why":"CSV의 인용 필드 안에 있는 쉼표는 필드 내용의 일부입니다. 문자 `,`만 기준으로 분리하면 레코드 구조가 깨질 수 있으므로 **인용 상태(Quoted Field)** 를 추적해야 합니다.","wrong":[{"n":1,"title":"인용 필드 무시","body":"쉼표만으로 분리하면 `\"상품`과 ` 파랑\"`이 다른 필드가 됩니다."},{"n":3,"title":"파서 동작 일반화","body":"잘못 분리되는 것이지 항상 빈 문자열을 반환하는 것은 아닙니다."},{"n":4,"title":"언어 표준과 파일 포맷 혼동","body":"C++20에서도 파일을 읽고 CSV 규칙을 구현할 수 있습니다."}]},{"id":"Q-13","kind":"written","chapter":2,"q":"C++에서 **정수 나눗셈과 실수 나눗셈**의 차이를 설명하고, 숫자 `5`와 `2`를 피연산자로 사용하여 각각 결과값 `2`와 `2.5`를 얻는 코드를 작성하시오. (C++20 기준)","why":"두 피연산자가 정수이면 정수 나눗셈이 수행되어 0 방향으로 소수 부분을 버립니다. 적어도 한 피연산자가 부동소수점 타입이면 실수 나눗셈이 이루어집니다. `5 / 2`는 `2`, `static_cast<double>(5) / 2` 또는 `5.0 / 2`는 `2.5`입니다.","modelCode":"#include <iostream>\n\nint main() {\n    // 정수 나눗셈: 2\n    int result_int = 5 / 2;\n\n    // 실수 나눗셈: 2.5\n    double result_double = static_cast<double>(5) / 2;\n\n    std::cout << \"정수 나눗셈: \" << result_int << \"\\n\";\n    std::cout << \"실수 나눗셈: \" << result_double << \"\\n\";\n    return 0;\n}","modelOutput":"정수 나눗셈: 2\n실수 나눗셈: 2.5"},{"id":"Q-14","kind":"written","chapter":4,"q":"반복문에서 `i < count`와 `i <= count`의 반복 횟수 차이를 설명하시오. (`count = 3`, `i = 0`에서 시작)","why":"`i < count`는 `0`, `1`, `2`에서 3회 반복합니다. `i <= count`는 `3`까지 포함해 4회 반복합니다. 범위를 하나 더 순회하는 **오프바이원(Off-by-one) 오류**를 피하도록 조건을 확인해야 합니다.","modelCode":"#include <iostream>\n\nint main() {\n    int count = 3;\n    for (int i = 0; i < count; ++i) std::cout << i;\n    std::cout << \"\\n\";\n    for (int i = 0; i <= count; ++i) std::cout << i;\n    std::cout << \"\\n\";\n}","modelOutput":"012\n0123"},{"id":"Q-15","kind":"written","chapter":5,"q":"함수가 기존 객체를 **조회만 하는 경우**와 **원본을 수정하는 경우**, 매개변수로 `const T&`와 `T&`를 각각 사용하는 이유를 설명하시오.","why":"`const T&`는 원본을 복사하지 않고 읽기 전용으로 참조합니다. `T&`는 원본을 수정해야 할 때 사용합니다. 특히 큰 객체에서 복사 비용을 줄일 수 있지만, `int`처럼 작은 타입은 값 전달도 충분히 적절합니다. 클래스 내부의 변경 가능한 멤버 참조를 외부에 그대로 반환하면 불변 조건이 깨질 수 있으므로 주의해야 합니다.","modelCode":"#include <iostream>\n#include <vector>\n\nint sum(const std::vector<int>& values) {\n    int total = 0;\n    for (int value : values) total += value;\n    return total;\n}\n\nvoid add(std::vector<int>& values, int value) {\n    values.push_back(value);\n}\n\nint main() {\n    std::vector<int> values{1, 2};\n    add(values, 3);\n    std::cout << sum(values) << \"\\n\";\n}","modelOutput":"6"},{"id":"Q-16","kind":"written","chapter":7,"q":"`std::vector`에 `push_back()`을 호출한 뒤 기존 원소를 가리키던 포인터나 참조가 **무효화될 수 있는 이유**를 설명하시오.","why":"새 요소를 저장할 용량이 부족하면 `std::vector`가 더 큰 저장 공간을 확보하고 기존 요소를 옮기는 **재할당(Reallocation)** 을 수행합니다. 그 경우 기존 요소를 가리키던 포인터·참조·반복자는 모두 무효화됩니다. 재할당이 일어나지 않으면 기존 요소에 대한 참조는 유지되지만, 이전의 `end()` 반복자는 무효화됩니다.","modelCode":"#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int> values{10, 20, 30};\n    int* first = &values[0];\n    auto old_capacity = values.capacity();\n\n    values.push_back(40);\n    if (values.capacity() != old_capacity) {\n        first = &values[0];  // 다시 주소 획득\n    }\n    std::cout << *first << \"\\n\";\n}","modelOutput":"10"},{"id":"Q-17","kind":"written","chapter":8,"q":"`struct`와 `class`의 기본 접근 지정자(Access Specifier) 차이를 설명하고, 어떤 기준으로 나누어 사용하는지 예를 들어 서술하시오.","why":"`struct`의 기본 멤버 접근은 `public`, `class`의 기본 멤버 접근은 `private`입니다. 기능상 큰 차이는 없지만 단순 데이터 묶음에는 `struct`, 상태 변경 규칙과 불변 조건을 보호해야 하는 타입에는 `class`가 자주 사용됩니다.","modelCode":"#include <iostream>\n\nstruct Position {\n    int x{0};\n    int y{0};\n};\n\nclass Counter {\npublic:\n    void add() { ++count_; }\n    int value() const { return count_; }\nprivate:\n    int count_{0};\n};\n\nint main() {\n    Position p{2, 3};\n    Counter c;\n    c.add();\n    std::cout << p.x << \",\" << p.y << \" / \" << c.value() << \"\\n\";\n}","modelOutput":"2,3 / 1"},{"id":"Q-18","kind":"written","chapter":9,"q":"다형적 기본 클래스(Polymorphic Base Class)의 포인터를 통해 파생 객체를 삭제할 때 **가상 소멸자(Virtual Destructor)** 가 필요한 이유를 설명하시오.","why":"일반적으로 파생 객체를 기본 클래스 포인터로 `delete`할 때 기본 클래스 소멸자가 가상이 아니면 **미정의 동작(Undefined Behavior)** 이 발생합니다. 따라서 단순히 파생 클래스 소멸자가 빠지거나 메모리 누수가 발생하는 것으로만 설명하면 불충분합니다. 가상 소멸자를 선언하면 파생 객체와 기본 부분의 소멸이 올바르게 이루어집니다.","modelCode":"#include <iostream>\n#include <memory>\n\nstruct Base {\n    virtual ~Base() { std::cout << \"Base\\n\"; }\n};\n\nstruct Derived : Base {\n    ~Derived() override { std::cout << \"Derived\\n\"; }\n};\n\nint main() {\n    std::unique_ptr<Base> p = std::make_unique<Derived>();\n}","modelOutput":"Derived\nBase"},{"id":"Q-19","kind":"written","chapter":10,"q":"코드별 발생 횟수를 집계하면서 결과는 **코드 오름차순**으로 출력해야 합니다. 적절한 STL 컨테이너를 선택하고 이유를 설명하시오.","why":"`std::map<std::string, int>`는 키가 정렬된 순서로 유지되므로 별도 정렬 없이 순회할 수 있습니다. 삽입·검색·수정은 일반적으로 `O(log N)`입니다. `std::unordered_map`을 사용해 평균적으로 빠르게 집계한 뒤 키를 별도 정렬하는 대안도 가능합니다.","modelCode":"#include <iostream>\n#include <map>\n#include <string>\n#include <vector>\n\nint main() {\n    std::vector<std::string> codes{\"C02\", \"C01\", \"C02\"};\n    std::map<std::string, int> counts;\n    for (const auto& code : codes) ++counts[code];\n    for (const auto& [code, count] : counts) {\n        std::cout << code << \" \" << count << \"\\n\";\n    }\n}","modelOutput":"C01 1\nC02 2"},{"id":"Q-20","kind":"written","chapter":11,"q":"기존 결과 파일을 갱신하는 보고서 프로그램에서 **중간 실패로 이전 정상 결과가 손상되는 것을 방지할 방법**을 설명하시오.","why":"원본에 바로 기록하지 말고 같은 파일시스템의 임시 파일에 결과를 모두 작성합니다. 스트림 쓰기·닫기 오류를 확인한 뒤 최종 경로로 교체합니다. 이때 `std::filesystem::rename`의 기존 대상 교체 가능 여부와 원자성은 운영체제·파일시스템 조건을 확인해야 합니다. 특히 Windows에서는 대상 파일이 이미 있거나 열려 있을 때 교체가 실패할 수 있으므로, 오류 처리와 복구 정책을 별도로 설계해야 합니다. 단순히 파일 이름을 바꿨다고 전원 차단까지 포함한 완전한 내구성이 보장되는 것은 아닙니다.","modelCode":"#include <filesystem>\n#include <fstream>\n#include <iostream>\n#include <system_error>\n\nint main() {\n    const std::filesystem::path temp = \"report.tmp\";\n    const std::filesystem::path target = \"report.txt\";\n\n    {\n        std::ofstream out(temp, std::ios::trunc);\n        if (!out) return 1;\n        out << \"REPORT OK\\n\";\n        out.flush();\n        if (!out) return 1;\n        out.close();\n        if (!out) return 1;\n    }\n\n    std::error_code ec;\n    std::filesystem::rename(temp, target, ec);\n    if (ec) {\n        std::cerr << \"교체 실패: \" << ec.message() << \"\\n\";\n        return 1;\n    }\n    std::cout << \"저장 완료\\n\";\n}"}];

    "output": "최종 배송비를 원 단위 정수로 출력합니다. 입력이 유효하지 않으면 `INVALID`를 출력합니다.",

 nav();}
function openProblem(id){active=id;renderProblem();if(mode!=='problems')switchMode('problems')}
function update(){let m=matching();if(!m.length){document.getElementById('problemHost').innerHTML='<div class="empty">조건에 맞는 문제가 없습니다.</div>';document.getElementById('pageCounter').textContent='0 / 0';document.getElementById('previous').disabled=true;document.getElementById('next').disabled=true;return}if(active==='GUIDE'){renderGuide();return}if(!m.some(p=>p.id===active))active=m[0].id;renderProblem()}
function syncFilters(){document.querySelectorAll('#problemFilters button').forEach(b=>b.classList.toggle('active',b.dataset.level===filter))}
document.querySelectorAll('#problemFilters button').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.level;syncFilters();const first=matching()[0];if(first && (active==='GUIDE' || !matching().some(p=>p.id===active)))active=first.id;update()}));
document.getElementById('search').addEventListener('input',e=>{search=e.target.value.trim();update()});
document.getElementById('previous').addEventListener('click',()=>{let m=matching(),i=m.findIndex(p=>p.id===active);if(active==='GUIDE')return;if(i>0)openProblem(m[i-1].id);else if(i===0)openProblem('GUIDE')});
document.getElementById('next').addEventListener('click',()=>{let m=matching(),i=m.findIndex(p=>p.id===active);if(active==='GUIDE'){if(m.length)openProblem(m[0].id);return;}if(i<m.length-1)openProblem(m[i+1].id)});
document.getElementById('printCurrent').addEventListener('click',()=>window.print());
function switchMode(next){mode=next;document.getElementById('problemsView').style.display=next==='problems'?'':'none';document.getElementById('quizView').style.display=next==='quiz'?'block':'none';document.getElementById('modeProblems').classList.toggle('active',next==='problems');document.getElementById('modeQuiz').classList.toggle('active',next==='quiz');document.getElementById('sideNavTitle').textContent=next==='problems'?'PROBLEM INDEX':'REVIEW';document.getElementById('problemNavigation').style.display=next==='problems'?'':'none';window.scrollTo({top:0,behavior:'instant'})}
document.getElementById('modeProblems').addEventListener('click',()=>switchMode('problems'));
document.getElementById('modeQuiz').addEventListener('click',()=>switchMode('quiz'));

function rich(value){
  return esc(value).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
}
function quizCard(q){
  const answer = q.kind==='mcq' ? `<p><strong>정답: ${q.correct+1}번 — ${rich(q.choices[q.correct])}</strong></p>` : '';
  const wrong = q.wrong?.length ? `<div class="wrong-explanations"><h4>오답 해설</h4>${q.wrong.map(w=>`<div class="wrong-row"><strong>${w.n}번 · ${esc(w.title)}</strong><p>${rich(w.body)}</p></div>`).join('')}</div>` : '';
  const code = q.modelCode ? `<div class="model-code"><div class="code-caption">예시 코드 <span>C++</span></div><pre><code>${esc(q.modelCode)}</code></pre>${q.modelOutput?`<div class="code-caption">실행 결과</div><pre class="model-output">${esc(q.modelOutput)}</pre>`:''}</div>` : '';
  return `<article class="quiz-item" id="${q.id}" data-kind="${q.kind}"><div class="quiz-index">${esc(q.id)} · ${q.kind==='mcq'?'객관식':'주관식·서술형'} / CHAPTER ${String(q.chapter).padStart(2,'0')}</div><h3>${rich(q.q)}</h3>${q.code?`<pre><code>${esc(q.code)}</code></pre>`:''}${q.kind==='mcq'?`<ol class="quiz-options">${q.choices.map((x,i)=>`<li><label class="quiz-choice"><input type="radio" name="${q.id}" value="${i}" aria-label="${q.id} ${i+1}번"><span class="choice-no">${i+1}.</span><span class="choice-text">${rich(x)}</span></label></li>`).join('')}</ol>`:`<textarea aria-label="${q.id} 답안" placeholder="답안 작성"></textarea>`}<details><summary>정답 및 해설</summary><div class="fold-body">${answer}<p>${rich(q.why)}</p>${wrong}${code}<p class="quiz-reference"><a href="${chapterUrl(q.chapter)}" target="_blank" rel="noopener noreferrer">Chapter ${String(q.chapter).padStart(2,'0')} README ↗</a></p></div></details></article>`;
}
document.getElementById('quizList').innerHTML=quiz.map(quizCard).join('');
document.querySelectorAll('[data-quiz]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-quiz]').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.quiz-item').forEach(x=>x.style.display=b.dataset.quiz==='all'||x.dataset.kind===b.dataset.quiz?'':'none');
}));
// Native radio buttons do not support unchecking themselves. Remember the pre-click
// value and toggle explicitly; keyboard selection is handled too.
function updateQuizStyles(name){
  document.querySelectorAll(`input[name="${name}"]`).forEach(input=>{
    input.closest('.quiz-choice').classList.toggle('checked',input.checked);
  });
}
document.querySelectorAll('.quiz-choice').forEach(label=>{
  label.addEventListener('pointerdown',()=>{const input=label.querySelector('input');input.dataset.previouslyChecked=input.checked?'1':'0';});
});
document.querySelectorAll('.quiz-choice input').forEach(input=>{
  input.addEventListener('pointerdown',function(){this.dataset.previouslyChecked=this.checked?'1':'0';});
  input.addEventListener('keydown',function(ev){if(ev.key===' '||ev.key==='Enter')this.dataset.previouslyChecked=this.checked?'1':'0';});
  input.addEventListener('click',function(){
    const wasSelected=this.dataset.previouslyChecked==='1';
    if(wasSelected)this.checked=false;
    document.querySelectorAll(`input[name="${this.name}"]`).forEach(r=>{
      r.dataset.previouslyChecked=r.checked?'1':'0';
    });
    updateQuizStyles(this.name);
  });
  input.addEventListener('change',function(){
    // Change can occur through keyboard navigation; synchronize selection state.
    document.querySelectorAll(`input[name="${this.name}"]`).forEach(r=>{
      r.dataset.previouslyChecked=r.checked?'1':'0';
    });
    updateQuizStyles(this.name);
  });
});

nav();renderProblem();switchMode('quiz');
</script>
</body>
