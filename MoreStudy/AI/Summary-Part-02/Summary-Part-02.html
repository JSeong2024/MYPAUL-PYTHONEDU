6kpCQ988wzyszMdNVt2LBBn3zyiSwWiwYNGnTZzwEAAJCNRA8AACVAs2bNtGLFClWpUkVvv/22KleurJtvvlkPP/ywevToofDwcPXu3VtHjx51bXL81ltvqWXLlvr5559Vr1493X///erevbuaNm2qkydPaujQoerZs6dXnuf555/XDTfcoMjISNWvX1/33XefevXqpWuvvVZNmzZVrVq15Ovr63ZPUFCQnnvuOWVlZal9+/bq1q2bbr/9djVq1EgOh0Nt27a97Dh8fHw0cuRIZWVlqVOnTrr11lv14IMPqkGDBvr0008vmnTp1auXJOmhhx7Sfffdp8cee0yPPfZYnv199tlnqlu3rr7++ms1bNhQffr00c0336wOHTooJSVF7777rmtPJgAAgIIg0QMAQAnRrl077d+/X++9956uv/567dixQ3PnztW6detUp04dvfrqq9q3b5+6du0q6dyJTKtXr9a4ceMUFhamhQsXas2aNWrVqpW++eYbTZ482WvP4ufnp59//lkjR45UYGCgFi5cqF27dmnEiBGaM2eOTp06leMkMEkaO3asJkyYoBo1aujXX3/Vzp07NXDgQP3888+u5VSX6+WXX9ZXX32lJk2aaN26dVqxYoWaNm2qyMjIix7Jfvfdd+v9999XjRo1tGjRIn3xxRf64osv8uyrevXq2rx5s0aMGCEfHx99//332rJli7p27aply5Zp+PDhBXoGAACAbCbjShwjAQAAkE+RkZFq27atunXrpv/+97/eDgcAAKBEYUYPAADwij/++CPHvjoHDx7UE088IUnq27evN8ICAAAo0ZjRAwAAvCIiIkKJiYm67rrrVLFiRR05ckRbtmxRRkaGevXqpQULFshkMnk7TAAAgBKFRA8AAPCKjz/+WHPnztWePXsUFxcnf39/XXPNNerbt6+efPJJ+fj4eDtEAACAEodEDwAAAAAAQCnBHj0AAAAAAAClBIkeAAAAAACAUoJEDwAAAAAAQClBogcAAAAAAKCUINEDAAAAAABQSpDoAQAAAAAAKCVI9AAAAAAAAJQSJHoAAAAAAABKCRI9AAAAAAAApQSJHgAAAAAAgFKCRA8AAAAAAEApQaIHAAAAAACglCDRAwAAAAAAUEr8P02mvPvbN/ciAAAAAElFTkSuQmCC\" alt=\"실제 실행 결과: 제한된 자원에서의 모델 학습 설계\" /><\/p>\n","steps":[{"title":"STEP 1. 학습 예산과 실험 설계","html":"<p>실험별 초기 조건, 배치 순서, Update 예산과 시간 측정 구간을 정합니다. 비교 결과가 실행 순서의 차이로 달라지지 않는지 확인합니다.<\/p>\n"},{"title":"STEP 2. Batch 전략과 Gradient 관리","html":"<p>실제 Batch와 Gradient Accumulation이 같은 샘플을 처리하도록 구성합니다. 마지막 Batch의 샘플 수가 64개보다 적은 경우에도 해당 샘플을 모두 사용하고, 실제 샘플 수를 반영하여 Loss를 계산합니다. Gradient Clipping은 각 Optimizer Update 직전에 한 번만 적용합니다.<\/p>\n<pre><code class=\"language-python\"># TODO: Effective Batch의 실제 샘플 수를 반영한 Loss 누적\n# TODO: 누적 후 Gradient Clipping 및 Optimizer Update\n<\/code><\/pre>\n"},{"title":"STEP 3. 결과 비교와 선택 근거","html":"<p>각 설정의 정확도, Loss, 파라미터 수, 실행 시간 중앙값을 함께 기록합니다. 계산 결과의 작은 수치 차이와 실질적 성능 차이를 구분해 기록합니다.<\/p>\n"}]},{"id":"C-01","title":"중단된 학습의 원인 분석과 복구","level":"challenge","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a> · <code>state_dict<\/code> · Dropout · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a> · Optimizer State · Scheduler State · RNG · Resume<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>설비 고장 예측 모델을 총 20 Epoch 동안 학습하던 중, 8번째 Epoch가 끝난 직후 전원이 차단되었습니다. 담당자는 Weight를 저장해 두었으므로 학습을 이어갈 수 있다고 생각했지만, 재개 후 결과는 중단 없이 학습했을 때와 달랐습니다.<\/p>\n<p>기존 프로그램은 아래와 같이 Checkpoint를 저장했습니다.<\/p>\n<pre><code class=\"language-python\"># 기존 코드 일부 — 불완전한 저장 방식\nfor epoch in range(20):\n    train_one_epoch(model, optimizer, train_loader)\n    scheduler.step()\n    torch.save(model.state_dict(), &quot;checkpoint.pt&quot;)\n\n# 재시작 코드 일부\nmodel.load_state_dict(torch.load(&quot;checkpoint.pt&quot;, weights_only=True))\ntorch.manual_seed(42)\n# Optimizer와 Scheduler를 새로 생성한 상태에서 이어서 학습\n<\/code><\/pre>\n<p>제공된 코드와 실행 이력을 비교하여 결과가 달라진 원인을 파악하십시오. 복구 보고서에는 저장·복원해야 할 상태와 각 상태의 역할도 정리하십시오.<\/p>\n<p><strong>목표는 높은 Accuracy를 얻는 것이 아니라, 중단 후 재개한 학습의 결과를 지정된 조건에서 연속 실행 결과와 일치시키는 것입니다.<\/strong><\/p>\n<h4>제공 데이터와 실행 조건<\/h4>\n<ul>\n<li><code>train.csv<\/code>: <code>record_id,f1,f2,f3,f4,label<\/code> 형식의 실습용 합성 데이터<\/li>\n<li><code>validation.csv<\/code>: 동일한 형식의 독립 검증 데이터<\/li>\n<li>Model(모델): <code>Linear(4,16) → ReLU → Dropout(0.2) → Linear(16,1)<\/code><\/li>\n<li>Loss: <code>BCEWithLogitsLoss<\/code>, Optimizer: <code>AdamW(lr=0.005)<\/code>, Scheduler: <code>StepLR(step_size=5,gamma=0.5)<\/code><\/li>\n<li>Batch Size 16, Epoch 20, CPU, <code>num_workers=0<\/code><\/li>\n<li>데이터 순서는 매 Epoch마다 Shuffle하며, 이를 위해 사용되는 <code>torch.Generator<\/code>의 상태까지 추적한다.<\/li>\n<li>비교용 실행은 동일한 입력 파일과 라이브러리 버전, Thread 설정에서 수행한다.<\/li>\n<\/ul>\n<h4>요구사항<\/h4>\n<ol>\n<li><strong>기준 실행:<\/strong> 같은 초기 Weight와 Seed를 사용하여 20 Epoch를 중단 없이 학습하고, Epoch별 Training(학습) Loss·검증 Loss·Learning Rate를 기록한다.<\/li>\n<li><strong>중단 실행:<\/strong> 별도 실행에서 8번째 Epoch까지 동일하게 학습한 뒤 Checkpoint를 저장하고 프로그램을 종료한다. 중단과 재개는 <strong>Epoch 경계<\/strong> 에서만 발생하도록 한다.<\/li>\n<li><strong>상태 보존:<\/strong> <code>model_state<\/code>, <code>optimizer_state<\/code>, <code>scheduler_state<\/code>, <code>completed_epoch<\/code>, CPU RNG State, DataLoader Shuffle용 Generator State를 저장한다. Python·NumPy 난수를 실제로 사용했다면 그 상태도 포함한다.<\/li>\n<li><strong>Early Stopping 상태:<\/strong> 이번 고정 20 Epoch 비교에서는 중단 조건을 적용하지 않지만, 검증 Best Epoch와 Best Weight를 추적한다면 그것도 함께 저장·복원한다. Best 모델과 Resume State는 목적이 다름을 명시한다.<\/li>\n<li><strong>정확한 재개:<\/strong> Checkpoint를 불러와 Epoch 9부터 20까지 진행한다. 새 프로세스에서 모델·Optimizer·Scheduler를 생성한 뒤 각각의 State를 복원하며, 모델 생성에 사용된 난수가 재개 상태에 영향을 주지 않도록 <strong>난수 State는 초기 구성 후 복원<\/strong> 한다.<\/li>\n<li><strong>결과 비교:<\/strong> 연속 실행과 재개 실행의 마지막 Parameter(파라미터)별 최대 절댓값 차이 및 각 Epoch의 Loss·LR 차이를 비교한다. 같은 CPU·동일한 결정적 실행 조건에서 파라미터 차이는 <code>1e-6<\/code> 이하, LR 차이는 <code>1e-12<\/code> 이하여야 한다.<\/li>\n<li><strong>안전한 저장:<\/strong> 새 Checkpoint를 임시 파일에 완전히 기록한 뒤 원본 경로로 교체한다. 쓰기 실패가 발생하더라도 이전 정상 Checkpoint가 남아 있어야 한다. 파일 손상이 감지되면 불완전한 파일을 학습에 사용하지 않는다. 교체 이전의 정상 버전을 백업 파일로 보관하고, 복구 가능 여부와 실패 사유를 기록한다.<\/li>\n<li><strong>복구 보고서:<\/strong> 무엇이 잘못되었는지와 수정 전·후 결과의 차이를 정리한다. 동일한 결과를 얻지 못하는 환경에서는 원인을 기록하고 정확히 일치했다고 간주하지 않는다.<\/li>\n<\/ol>\n<h4>입력 및 출력<\/h4>\n<p>프로그램은 <code>train.csv<\/code>, <code>validation.csv<\/code>와 선택적으로 저장된 <code>checkpoint.pt<\/code>를 사용합니다. <code>continuous<\/code>, <code>interrupt<\/code>, <code>resume<\/code>, <code>compare<\/code> 실행 모드를 제공하도록 구성할 수 있습니다.<\/p>\n<ul>\n<li><code>continuous_history.csv<\/code>: <code>epoch,train_loss,validation_loss,learning_rate<\/code><\/li>\n<li><code>resumed_history.csv<\/code>: 같은 열 구조. 1~8 Epoch의 이전 기록과 재개 후 9~20 Epoch의 기록을 이어서 보존<\/li>\n<li><code>checkpoint.pt<\/code>: 재개에 필요한 학습 상태<\/li>\n<li><code>resume_audit.json<\/code>: <code>completed_epoch<\/code>, <code>resumed_from_epoch<\/code>, <code>max_parameter_diff<\/code>, <code>max_lr_diff<\/code>, <code>matched<\/code><\/li>\n<li><code>recovery_report.md<\/code>: 원인 분석, 복구 방식, 손상된 파일 처리 결과<\/li>\n<\/ul>\n<p><strong>예상 결과 예시<\/strong><\/p>\n<pre><code class=\"language-json\">{\n  &quot;completed_epoch&quot;: 20,\n  &quot;resumed_from_epoch&quot;: 9,\n  &quot;max_parameter_diff&quot;: 0.0,\n  &quot;max_lr_diff&quot;: 0.0,\n  &quot;matched&quot;: true\n}\n<\/code><\/pre>\n<p>위 값은 <strong>출력 형식을 보여 주기 위한 예시<\/strong>이며, 실제 측정 결과는 아닙니다.<\/p>\n<h4>검증 기준<\/h4>\n<ul>\n<li>모델 Weight만 복원하거나 Scheduler State를 누락했을 때 차이가 발생하는 원인을 설명하는지 확인<\/li>\n<li>Shuffle과 Dropout의 난수가 정확히 이어지는지 확인<\/li>\n<li>Epoch 8까지의 기록을 재시작 시 덮어쓰지 않고 보존하는지 확인<\/li>\n<li>잘못된 Checkpoint와 쓰기 실패 시 이전 정상 Checkpoint가 유지되는지 확인<\/li>\n<li>정확한 Resume와 단순히 검증 성능이 비슷한 결과를 구분하는지 확인<\/li>\n<\/ul>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHoAAAJPCAYAAAADqLNRAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAXEgAAFxIBZ5/SUgABAABJREFUeJzs3XdYFFfbBvB7ttFBFBFsoKJYsaIgKth97d3YayzRaKKJJcauMXZjjcbeC/YS7GJB7L03sCsqTeqW+f7wY+O6SxVYyv27rrninjkz88ycZcM+nCKIoiiCiIiIiIiIiIiyPYmxAyAiIiIiIiIiovTBRA8RERERERERUQ7BRA8RERERERERUQ7BRA8RERERERERUQ7BRA8RERERERERUQ7BRA8RERERERERUQ7BRA8RERERERERUQ7BRA8RERERERERUQ7BRA8RERERERERUQ7BRA8RERERERERUQ7BRA8RERERERERUQ7BRA8RERERERERUQ7BRA8RERERERERUQ7BRA8RERERERERUQ7BRE8uFhQUBEEQ9LacZs2aNXr36OPjY+ywMpShdg0KCjJ2WESUTnx8fPR+xtesWaNXr1evXnr1Jk6cmOnxEhEREVHmYaInG4uJicGWLVvwww8/oFq1aihcuDDMzc1hYmICe3t71KhRA99//z22bNmCiIgIY4dLlC4MJbG+3KRSKaytreHs7IxGjRph8uTJePDggbHDpixk/vz5ib5//vzzT2OHR0RERET0TZjoyYbi4+MxZcoUFC1aFJ07d8bSpUtx+fJlvHz5EjExMYiPj0dISAguXLiAFStWoHPnzihYsCBWrlxp7NApF0hpT4OMotFoEBkZieDgYBw5cgQTJkxA2bJlMWzYMKjV6kyLg7KupN6Pa9euzbxAspDc0sOTiIiIKDeQGTsASp1Hjx6hY8eOuHr1aqqOi4qKws2bNzMoKspqBg8erFdmbW1thEiyBrVajQULFkAQBMyfP9/Y4ZARXbt2DdevX090/7179xAYGAgPD49MjCrjNGjQAJaWljpl1atXN1I0RERERJQZmOjJRl6+fIm6devixYsXBve7urqiUqVKsLGxQXh4OB48eIAbN26wF0MutGjRImOHkKnc3d21X15DQkJw6dIlPHnyRK/ewoULMXLkSBQsWDCzQ6QsIiW9y9asWZNjEj3dunVDt27djB0GEREREWUiJnqyCY1Gg1atWhlM8lSvXh2LFy9GtWrV9PaFhoZi7dq1mDt3bmaESWQUTZs21ZlgVq 를 바꿀 수 있는 상태를 식별합니다. 저장 시점과 재개 시점의 차이를 분석합니다.<\/p>\n"},{"title":"STEP 2. 안전한 복구 절차 설계","html":"<p>정확한 학습 재개에 필요한 상태를 관리하고, 파일 저장 중단이나 손상에도 이전 정상 상태를 보호할 수 있는 복구 흐름을 설계합니다.<\/p>\n"},{"title":"STEP 3. 재현성과 장애 대응 검증","html":"<p>Epoch별 학습 이력과 최종 모델 상태를 비교합니다. 재현성 조건을 만족하지 못하면 원인을 기록하고 성공으로 처리하지 않습니다.<\/p>\n"}]},{"id":"C-02","title":"품질 판정 시스템의 예측 오류 대응","level":"challenge","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a> · Dtype · Device · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a> · Model Inference · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a> · Reproducibility · Model Handoff<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>공장의 품질 판정 시스템은 안정적으로 운영되었지만, 입력 CSV를 생성하는 장비를 교체한 뒤 예측 점수가 급격히 달라졌습니다. 일부 측정값에는 숫자로 변환할 수 없는 문자열이 들어 있었고, Feature(특성) 열의 순서도 바뀌었습니다. 추론 코드가 평가 모드로 실행되지 않은 문제도 확인되었습니다.<\/p>\n<p>아래 코드에는 서로 다른 종류의 위험이 섞여 있습니다.<\/p>\n<pre><code class=\"language-python\"># 기존 코드 일부 — 결함 포함\nincoming = pd.read_csv(&quot;incoming.csv&quot;)\nx = torch.tensor(incoming.iloc[:, 1:].to_numpy(), dtype=torch.float32)\nmodel.train()\nprobabilities = torch.sigmoid(model(x))\nprobabilities = probabilities.detach().numpy()\n<\/code><\/pre>\n<p>기존 코드와 기준 예측 기록을 비교하여 결과가 달라진 원인을 구분하십시오. 정상 입력에서도 발생하는 오류와 유효하지 않은 입력 때문에 생긴 실패를 별도로 분석합니다.<\/p>\n<p><strong>목표는 예측 결과가 달라진 원인을 파악하고, 신뢰할 수 없는 예측이 자동 판정에 사용되지 않도록 복구 절차를 구현하는 것입니다.<\/strong><\/p>\n<h4>제공 파일<\/h4>\n<ul>\n<li><code>model_weights.pt<\/code>: 신뢰 가능한 기준 모델의 Weight<\/li>\n<li><code>preprocessing.json<\/code>: <code>feature_order<\/code>, <code>mean<\/code>, <code>scale<\/code>, <code>threshold<\/code>, <code>training_min<\/code>, <code>training_max<\/code> 저장<\/li>\n<li><code>model_config.json<\/code>: 입력 차원, 모델 구조, 출력 차원, 모델 버전<\/li>\n<li><code>reference_cases.csv<\/code>: 기준 모델로 검증한 입력 Sample(샘플)과 확률을 반올림 없이 저장한 파일 (복구 일치성 검사 전용; 확률 값은 최소 소수점 아홉째 자리까지 제공)<\/li>\n<li><code>incoming.csv<\/code>: 운영 중 수신한 신규 데이터. <code>record_id<\/code>와 특성 열을 포함하지만 <strong>열 순서는 달라질 수 있음<\/strong><\/li>\n<\/ul>\n<p>특성 이름은 <code>temperature_c<\/code>, <code>vibration<\/code>, <code>hours_active<\/code>로 고정됩니다. 학습 범위의 최솟값과 최댓값은 학습 데이터에서 계산하며, 신규 입력에는 Target 정보가 없습니다.<\/p>\n<h4>요구사항<\/h4>\n<ol>\n<li><strong>정확한 원인 분류:<\/strong> 열 순서 변경, 숫자 형식 오류, Scaling 누락, <code>train()<\/code> 상태, 잘못된 Model(모델) Config를 각각 검증한다. 재현 로그를 남겨 어떤 문제로 예측이 달라졌는지 구분한다.<\/li>\n<li><strong>Schema 검사:<\/strong> <code>incoming.csv<\/code>에 <code>record_id<\/code>와 세 특성 열이 모두 있어야 한다. 추가 열은 무시할 수 있으나 필수 열이 하나라도 없으면 전체 추론을 중단하고 <code>SCHEMA_ERROR<\/code>를 기록한다.<\/li>\n<li><strong>행별 유효성 검사:<\/strong> <code>record_id<\/code>는 고유한 비어 있지 않은 문자열이어야 한다. 각 특성은 유한한 실수이고, <code>vibration<\/code>, <code>hours_active<\/code>는 0 이상이다. 무효 행은 <code>INVALID_VALUE<\/code>, 유효 ID 중복은 <code>DUPLICATE_ID<\/code>로 분리한다. 무효 행은 ID를 점유하지 않는다.<\/li>\n<li><strong>정확한 복원:<\/strong> 모델 설정과 Checkpoint의 Parameter(파라미터) Shape를 확인한다. <code>torch.load(..., map_location=&quot;cpu&quot;, weights_only=True)<\/code>로 읽고 특성은 <strong>이름 기준<\/strong>으로 정렬한다. 저장된 Scaling 기준을 적용하고 <code>eval()<\/code> + <code>torch.inference_mode()<\/code>에서 추론한다.<\/li>\n<li><strong>기준 케이스 비교:<\/strong> <code>reference_cases.csv<\/code>의 확률과 복원 모델의 확률을 반올림 전 값으로 비교한다. 최대 차이가 <code>1e-6<\/code>을 넘으면 운영 출력을 차단하고 원인을 기록한다.<\/li>\n<li><strong>분포 변화 경보:<\/strong> 신규 유효 행이 30개 이상일 때, 하나 이상의 특성 값이 <strong>학습 Range 밖에 있는 행의 비율<\/strong>을 계산한다. 비율이 20%를 초과하면 <code>SHIFT_ALERT<\/code>를 기록하고 해당 Batch의 자동 확정을 중단한다. 이 경보는 성능 저하의 증명이 아니라 추가 점검이 필요한 신호이다.<\/li>\n<li><strong>안전한 출력:<\/strong> Schema·모델 복원 오류나 기준 케이스 불일치가 발생하면 이전 정상 <code>predictions.csv<\/code>를 덮어쓰지 않는다. 유효한 추론 결과라도 <code>SHIFT_ALERT<\/code>가 발생하면 점수는 기록하되 상태를 <code>REVIEW_REQUIRED<\/code>로 지정하고 자동 확정은 하지 않는다.<\/li>\n<li><strong>재현 및 복구:<\/strong> 정상 입력, 열 순서가 바뀐 입력, 수치 오류, 분포 변화, 잘못된 모델 설정을 테스트하고 복구 전·후 차이를 기록한다.<\/li>\n<\/ol>\n<h4>입력 및 출력 규격<\/h4>\n<p><strong><code>incoming.csv<\/code><\/strong> 예시 (순서가 변경된 경우)<\/p>\n<pre><code class=\"language-csv\">record_id,hours_active,vibration,temperature_c\nI001,220,3.1,34\nI002,280,6.2,44\nI003,185,unknown,29\n<\/code><\/pre>\n<p><strong><code>rejected_rows.csv<\/code><\/strong> 예시<\/p>\n<pre><code class=\"language-csv\">source_line,record_id,error_code\n4,I003,INVALID_VALUE\n<\/code><\/pre>\n<p>정상 실행에서는 다음 결과를 생성합니다.<\/p>\n<ul>\n<li><code>predictions.csv<\/code>: <code>record_id,probability,predicted,status<\/code> (<code>AUTO<\/code> 또는 <code>REVIEW_REQUIRED<\/code>)<\/li>\n<li><code>rejected_rows.csv<\/code>: <code>source_line,record_id,error_code<\/code><\/li>\n<li><code>incident_report.json<\/code>: <code>model_version<\/code>, <code>schema_valid<\/code>, <code>reference_max_abs_diff<\/code>, <code>valid_count<\/code>, <code>invalid_count<\/code>, <code>out_of_range_ratio<\/code>, <code>shift_alert<\/code>, <code>automatic_decisions_enabled<\/code><\/li>\n<li><code>incident_notes.md<\/code>: 원인별 재현 과정, 차단·복구 절차, 기준 모델과 결과 비교<\/li>\n<\/ul>\n<p>유효하지 않은 행에 임의로 0이나 예측 Label을 채워 정상 결과처럼 기록해서는 안 됩니다.<\/p>\n<h4>검증 기준<\/h4>\n<ul>\n<li>열 순서가 바뀌어도 결과가 같고, 필수 특성 누락은 정확히 탐지되는지 확인<\/li>\n<li>Scaling 누락, Mode 설정 오류, Checkpoint Shape 불일치를 서로 구분하는지 확인<\/li>\n<li>신규 데이터에 Target이 없어도 Range 기반 경보를 계산할 수 있는지 확인<\/li>\n<li><code>SHIFT_ALERT<\/code>가 발생했을 때 기존 점수와 자동 결정 정책을 혼동하지 않는지 확인<\/li>\n<li>실패한 실행이 이전의 정상 결과 파일을 손상시키지 않는지 확인<\/li>\n<\/ul>\n","steps":[{"title":"STEP 1. 장애 상황 재현과 원인 분리","html":"<p>기준 입력과 장애가 발생한 입력으로 추론을 반복하여 차이를 확인합니다. 입력 형식, 모델 상태, 전처리 방식, 실행 환경 가운데 어디에서 문제가 발생했는지 구분합니다.<\/p>\n"},{"title":"STEP 2. 안전한 추론·복구 구조 설계","html":"<p>정상 결과를 제공하기 전에 필수 검증을 완료하도록 구조를 설계합니다. 행별 오류와 전체 처리를 중단해야 하는 오류를 구분합니다.<\/p>\n"},{"title":"STEP 3. 운영 복귀 조건 검증","html":"<p>기준 예측과의 일치성, 분포 변화 경보, 기존 결과 보존 여부를 확인합니다. 자동 판정을 다시 허용할 수 있는 조건을 검증합니다.<\/p>\n"}]},{"id":"R-01","title":"The Last Checkpoint — AI 모델 운영과 장애 복구","level":"radiant","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a> · Tensor · Dataset · DataLoader · Autograd · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a> · MLP · Binary·Regression Loss · Inference · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a> · Optimizer · Scheduler · Early Stopping · Checkpoint · Reproducibility · Gradient Management<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>여러 지역에 시설을 운영하는 회사가 설비 고장 위험과 다음 날의 전력 수요를 예측하는 시스템을 구축했습니다. 모델은 소규모 CPU 서버에서 주기적으로 학습되며, 학습이 완료되면 현장 시스템에서 새로운 예측 결과를 활용합니다.<\/p>\n<p>그러나 실제 운영 과정에서 세 가지 문제가 확인되었습니다.<\/p>\n<blockquote>\n<p>첫째, 학습 도중 전원이 차단되면 진행 상태를 복구하지 못해 처음부터 다시 학습해야 합니다.<\/p>\n<p>둘째, 새로운 모델을 배포한 뒤 예측 결과가 달라져도 어떤 데이터와 Weight가 사용되었는지 추적하기 어렵습니다.<\/p>\n<p>셋째, 기존보다 평가 점수가 높은 모델을 배포했지만 일부 사업장에서는 오히려 잘못된 경보가 증가하는 문제가 발생했습니다.<\/p>\n<\/blockquote>\n<p>이러한 문제는 모델의 성능을 높이는 것만으로 해결할 수 없습니다. 학습 과정과 결과를 재현할 수 있어야 하며, 모델이 어떤 기준으로 평가되어 배포되었는지도 확인할 수 있어야 합니다. 또한, 문제가 발생했을 때 이전의 정상 상태로 돌아갈 수 있는 복구 체계도 필요합니다.<\/p>\n<p>해당 프로젝트의 목표는 <strong>모델의 학습과 검증, 배포 및 장애 복구를 안정적으로 수행할 수 있는 시스템을 구축하는 것<\/strong>입니다. 단순히 높은 예측 성능을 달성하는 데 그치지 않고, 실제 운영 환경에서의 안정성과 처리 효율까지 고려해야 합니다.<\/p>\n<p>다음 기능을 갖춘 Python 프로젝트를 설계하고 구현하십시오.<\/p>\n<ul>\n<li>설비 고장 위험 Binary Classification<\/li>\n<li>다음 날 전력 수요 Regression<\/li>\n<li>중단된 학습의 정확한 재개<\/li>\n<li>신규 사업장과 미래 데이터의 독립 평가<\/li>\n<li>검증된 새 모델의 안전한 배포·복구<\/li>\n<li>운영 데이터의 입력 오류와 분포 변화 감지<\/li>\n<li>Batch 추론의 처리 효율 분석<\/li>\n<\/ul>\n<p><em>해당 문제는 Chapter 05~07에서 학습한 PyTorch를 중심으로 해결할 수 있도록 구성되어 있습니다. CNN, Transformer, 분산 학습, 외부 클라우드 서비스 등의 기술은 요구하지 않습니다.<\/em><\/p>\n<h4>제공 데이터와 시점<\/h4>\n<p>모든 파일은 UTF-8 형식이고, 데이터는 실습용 합성 데이터입니다.<\/p>\n<p><strong>1. <code>sites.csv<\/code> — 시설 기준 정보<\/strong><\/p>\n<pre><code class=\"language-csv\">site_id,zone,capacity\nS001,NORTH,200\nS002,SOUTH,150\n<\/code><\/pre>\n<ul>\n<li><code>site_id<\/code>: 시설 고유 식별자<\/li>\n<li><code>zone<\/code>: 운영 지역<\/li>\n<li><code>capacity<\/code>: 1 이상의 정수, 모델 입력 Feature(특성)<\/li>\n<\/ul>\n<p><strong>2. <code>history.csv<\/code> — 과거 관측값 및 사후 확정 Target<\/strong><\/p>\n<pre><code class=\"language-csv\">site_id,date,temperature_c,vibration,energy_kwh,alarms_7d,failure_next_7d,energy_next_day,final_repair_cost\nS001,2026-06-01,23,2.1,96,1,0,102,0\nS002,2026-06-01,25,4.3,84,3,1,91,150000\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>열<\/th>\n<th>의미<\/th>\n<th>사용 기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>site_id<\/code>, <code>date<\/code><\/td>\n<td>시설과 관측 날짜<\/td>\n<td>연결·분할·중복 판단<\/td>\n<\/tr>\n<tr>\n<td><code>temperature_c<\/code><\/td>\n<td>당일 관측 기온<\/td>\n<td>특성<\/td>\n<\/tr>\n<tr>\n<td><code>vibration<\/code><\/td>\n<td>당일 진동 값<\/td>\n<td>특성, 0 이상<\/td>\n<\/tr>\n<tr>\n<td><code>energy_kwh<\/code><\/td>\n<td>당일 전력 사용량<\/td>\n<td>특성, 0 이상<\/td>\n<\/tr>\n<tr>\n<td><code>alarms_7d<\/code><\/td>\n<td>관측 시점까지 최근 7일 경보 수<\/td>\n<td>특성, 0 이상의 정수<\/td>\n<\/tr>\n<tr>\n<td><code>capacity<\/code><\/td>\n<td><code>sites.csv<\/code>에서 결합한 시설 수용 규모<\/td>\n<td>특성<\/td>\n<\/tr>\n<tr>\n<td><code>failure_next_7d<\/code><\/td>\n<td>관측 이후 7일 동안 고장이 발생했는지 여부<\/td>\n<td>Classification Target 전용<\/td>\n<\/tr>\n<tr>\n<td><code>energy_next_day<\/code><\/td>\n<td>관측 다음 날의 확정 전력 수요<\/td>\n<td>Regression Target 전용<\/td>\n<\/tr>\n<tr>\n<td><code>final_repair_cost<\/code><\/td>\n<td>정비 후 확정된 수리비<\/td>\n<td><strong>특성 사용 금지<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>3. <code>incoming.csv<\/code> — 운영 추론 대상<\/strong><\/p>\n<pre><code class=\"language-csv\">site_id,date,temperature_c,vibration,energy_kwh,alarms_7d\nS001,2026-09-01,24,2.4,105,1\nS002,2026-09-01,26,4.7,89,4\n<\/code><\/pre>\n<p>Incoming 데이터에는 Target과 <code>final_repair_cost<\/code>가 없습니다. 관측이 종료된 시점에서 다음 날의 전력 수요와 이후 7일간의 고장 위험을 예측합니다.<\/p>\n<p><strong>4. <code>deployment_manifest.json<\/code> — 현재 배포 중인 모델 정보<\/strong><\/p>\n<p>최초 실행 시에는 배포된 모델이 없습니다. 따라서 이전 정상 버전이 확보된 이후에만 Rollback을 수행할 수 있습니다.<\/p>\n<pre><code class=\"language-json\">{\n  &quot;active_version&quot;: null,\n  &quot;status&quot;: &quot;EMPTY&quot;\n}\n<\/code><\/pre>\n<p>프로젝트에는 최소 10개 시설에 대해 아래 날짜 구간별로 충분한 기록이 제공됩니다. 학습·검증 데이터에는 두 클래스가 모두 존재합니다. Incoming에는 최소 30개 이상의 유효한 시설·날짜 기록이 포함된 기본 검증 세트가 제공됩니다.<\/p>\n<h4>데이터 무결성과 처리 규칙<\/h4>\n<ol>\n<li>모든 CSV는 헤더를 포함한다. <code>sites.csv<\/code>의 <code>site_id<\/code>는 고유해야 하며 <code>capacity<\/code>가 1 이상의 정수여야 한다. 시설 기준 파일의 오류는 전체 처리 중단 사유이다.<\/li>\n<li>과거·운영 데이터의 키는 <code>(site_id,date)<\/code>이다. 등록되지 않은 시설은 <code>UNKNOWN_SITE<\/code>, 잘못된 날짜는 <code>INVALID_DATE<\/code>, 누락 또는 비유한 숫자와 범위 오류는 <code>INVALID_VALUE<\/code>, 잘못된 Target은 <code>INVALID_TARGET<\/code>으로 기록한다.<\/li>\n<li>동일한 키를 가진 여러 기록 가운데 <strong>첫 번째 유효한 행만 인정<\/strong> 한다. 유효한 중복 기록은 <code>DUPLICATE_RECORD<\/code>로 거부한다. 앞선 무효 행은 키를 점유하지 않는다.<\/li>\n<li>오류 판정 우선순위는 <code>UNKNOWN_SITE<\/code> → <code>INVALID_DATE<\/code> → <code>INVALID_VALUE<\/code> → <code>INVALID_TARGET<\/code> → <code>DUPLICATE_RECORD<\/code>이다. Incoming에는 Target이 없으므로 <code>INVALID_TARGET<\/code> 검사를 적용하지 않는다.<\/li>\n<li><code>temperature_c<\/code>는 음수를 허용하지만 유한한 실수여야 한다. <code>vibration<\/code>·<code>energy_kwh<\/code>는 0 이상, <code>alarms_7d<\/code>는 0 이상의 정수이다. <code>failure_next_7d<\/code>는 0 또는 1, <code>energy_next_day<\/code>는 0 이상의 유한 실수이다.<\/li>\n<li>정합성 검사를 통과한 기록은 날짜 오름차순, 같은 날짜에서는 시설 ID 오름차순으로 정렬한다. 모든 오류 기록에는 <code>source_file<\/code>, 실제 파일 행 번호 <code>source_line<\/code>, <code>error_code<\/code>를 포함한다.<\/li>\n<li><code>final_repair_cost<\/code>는 사후 정보이므로 수치가 입력되어 있더라도 예측 특성, Scaling 기준 및 모델 선택 기준에 사용하지 않는다.<\/li>\n<\/ol>\n<h4>요구사항<\/h4>\n<p><strong>STEP 01 — 데이터 준비와 검증<\/strong><\/p>\n<ul>\n<li>세 CSV를 검사하고 정상 행과 거부 행을 분리한다.<\/li>\n<li>학습에서 사용할 특성 목록을 <code>[temperature_c, vibration, energy_kwh, alarms_7d, capacity]<\/code>로 고정한다.<\/li>\n<li>모든 특성의 Scaling 기준은 학습 데이터에서만 계산한다. 표준편차가 0인 특성은 Scale을 1로 처리한다.<\/li>\n<li>정상·오류 행의 개수, 시설 수, 날짜 범위와 오류 코드별 건수를 기록한다.<\/li>\n<li>데이터 검증에 실패해 학습할 수 없다면 이전에 배포한 모델과 결과를 손상시키지 않는다.<\/li>\n<\/ul>\n<p><strong>STEP 02 — 시간 구간과 신규 시설 분리<\/strong><\/p>\n<p>날짜 기준은 다음과 같이 고정한다.<\/p>\n<table>\n<thead>\n<tr>\n<th>구간<\/th>\n<th>기록 날짜<\/th>\n<th>용도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>학습<\/td>\n<td>2026-03-01 ~ 2026-06-30<\/td>\n<td>학습·전처리 기준<\/td>\n<\/tr>\n<tr>\n<td>Gap 1<\/td>\n<td>2026-07-01 ~ 2026-07-07<\/td>\n<td>평가 대상에서 제외<\/td>\n<\/tr>\n<tr>\n<td>검증<\/td>\n<td>2026-07-08 ~ 2026-07-21<\/td>\n<td>Best Weight·Threshold·배포 후보 비교<\/td>\n<\/tr>\n<tr>\n<td>Gap 2<\/td>\n<td>2026-07-22 ~ 2026-07-28<\/td>\n<td>평가 대상에서 제외<\/td>\n<\/tr>\n<tr>\n<td>Test(테스트)<\/td>\n<td>2026-07-29 ~ 2026-08-11<\/td>\n<td>독립적인 최종 평가<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>고장 여부의 Target은 관측 이후 7일간 발생한 사건을 나타내므로, 구간 사이에 7일의 Gap을 둔다. Gap은 학습·모델 선택·점수 계산에 포함하지 않는다. 운영 추론 날짜는 <code>2026-09-01<\/code> 이후이며, 테스트 Target이 확정된 뒤에 배포 평가가 진행된다고 가정한다.<\/p>\n<p>추가로 학습하지 않은 시설에 대한 일반화 성능도 평가한다.<\/p>\n<ul>\n<li>고유 <code>site_id<\/code>를 문자열 오름차순으로 정렬한 뒤 <strong>5번째, 10번째, 15번째 …<\/strong> 시설을 Holdout으로 지정한다.<\/li>\n<li>Holdout 시설의 모든 기록은 학습·검증과 Scaling에 사용하지 않는다.<\/li>\n<li><strong>평가 A:<\/strong> Holdout이 아닌 시설의 테스트 기간 기록<\/li>\n<li><strong>평가 B:<\/strong> Holdout 시설의 테스트 기간 기록<\/li>\n<\/ul>\n<p>평가 A와 B의 결과를 따로 기록한다. Holdout 시설의 Target을 사용해 모델·Threshold·배포 후보를 선택하지 않는다.<\/p>\n<p><strong>STEP 03 — 두 종류의 MLP 구성 및 학습<\/strong><\/p>\n<p>Classification과 Regression을 서로 독립적인 모델로 구성한다. 공통 입력은 5개 특성이다.<\/p>\n<table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>Model(모델) 구조<\/th>\n<th>Loss<\/th>\n<th>주요 Metric<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Classification<\/td>\n<td><code>Linear(5,16) → ReLU → Linear(16,1)<\/code><\/td>\n<td><code>BCEWithLogitsLoss<\/code><\/td>\n<td>Recall, F2, Precision<\/td>\n<\/tr>\n<tr>\n<td>Regression<\/td>\n<td><code>Linear(5,16) → ReLU → Linear(16,1)<\/code><\/td>\n<td><code>MSELoss<\/code><\/td>\n<td>MAE, RMSE<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>두 모델 모두 Dataset·DataLoader를 사용하며 CPU에서 실행하는 것을 기본으로 한다.<\/li>\n<li>1개 Batch는 최대 32개 Sample(샘플)을 포함하고 마지막 Batch를 버리지 않는다.<\/li>\n<li>학습 Loss는 Batch별 단순 평균이 아니라 샘플 수를 반영해 집계한다.<\/li>\n<li>Gradient 초기화는 매 Optimizer Update 전에 수행한다.<\/li>\n<li>Classification의 Baseline은 학습 다수 클래스를 예측하는 모델이며, Regression Baseline은 당일 <code>energy_kwh<\/code>를 그대로 예측하는 방법이다.<\/li>\n<\/ul>\n<p><strong>STEP 04 — 배포 버전별 학습과 중단 복구<\/strong><\/p>\n<p>모델 버전을 두 단계로 구성한다.<\/p>\n<ul>\n<li><strong>v1:<\/strong> <code>SGD(lr=0.02, momentum=0.9)<\/code>, 최대 24 Epoch<\/li>\n<li><strong>v2:<\/strong> <code>AdamW(lr=0.005, weight_decay=0.01)<\/code>, 최대 24 Epoch<\/li>\n<\/ul>\n<p>두 버전은 모델 구조와 초기 Seed 42, DataLoader의 샘플 순서, 학습·검증 데이터를 동일하게 맞춘다. 단, Optimizer 설정이 다르므로 같은 학습 궤적이나 같은 성능을 기대하는 것은 아니다.<\/p>\n<p>v2 학습에는 <code>StepLR(step_size=8,gamma=0.5)<\/code>를 적용한다. 검증 Metric이 개선된 Best Weight를 보관하고 Early Stopping Patience 6을 적용하되, <strong>최소 8 Epoch를 완료한 뒤부터<\/strong> 중단 조건을 허용한다. v1·v2의 최고 검증 기준은 Classification에서는 F2, Regression에서는 RMSE이다. Classification은 각 Epoch에서 검증의 <code>[0.30,0.50,0.70]<\/code>을 모두 평가하여 F2가 가장 높은 Weight·Threshold 조합을 Best로 보관한다. F2 동점이면 높은 Threshold, 그래도 같으면 이른 Epoch를 선택한다.<\/p>\n<p>v2는 <strong>6번째 Epoch 종료 직후 의도적으로 중단하고 새 프로세스에서 재개<\/strong> 해야 한다. Checkpoint에는 최소한 다음 상태가 포함되어야 한다.<\/p>\n<ul>\n<li>모델·Optimizer·Scheduler State<\/li>\n<li>완료한 Epoch, Best 검증 Metric·Best Weight, Early Stopping Counter<\/li>\n<li>Torch RNG State와 Shuffle용 Generator State<\/li>\n<li>학습에 영향을 준 Config·특성 순서·Scaling 기준의 식별 정보<\/li>\n<\/ul>\n<p>연속 실행과 중단·재개 실행을 동일한 CPU·입력·환경에서 비교하여 최종 Parameter(파라미터)의 최대 절댓값 차이가 <code>1e-6<\/code> 이하인지 검사한다. 저장은 임시 파일 작성 후 원자적 교체를 사용한다.<\/p>\n<p><strong>STEP 05 — 검증 기반 배포 후보 선택<\/strong><\/p>\n<p>v1과 v2를 <strong>검증에서만<\/strong> 비교한다. 배포 승격 규칙을 다음과 같이 고정한다.<\/p>\n<ol>\n<li>v2의 Classification 검증 F2가 v1보다 낮아서는 안 된다.<\/li>\n<li>v2의 Regression 검증 RMSE가 v1보다 높아서는 안 된다.<\/li>\n<li>두 조건을 충족하며 적어도 하나의 지표가 엄격하게 개선되어야 v2를 승격한다.<\/li>\n<li>이 조건을 만족하지 않으면 v1을 유지한다.<\/li>\n<\/ol>\n<p>비교는 반올림 전 값으로 수행한다. 선정이 끝나면 <strong>확정한 버전의 두 모델<\/strong>로만 평가 A·B의 테스트 점수를 계산한다. 테스트 성능을 기준으로 승격 결정을 바꾸지 않는다.<\/p>\n<p><strong>STEP 06 — 운영 추론과 경보 처리<\/strong><\/p>\n<ul>\n<li><code>incoming.csv<\/code>의 특성을 저장된 이름·순서와 Scaling 기준으로 변환한다.<\/li>\n<li><code>eval()<\/code>과 <code>torch.inference_mode()<\/code>에서 Classification 확률과 Regression 예측값을 계산한다.<\/li>\n<li>Classification의 확률이 선정된 Threshold 이상인 기록을 점검 후보로 정한다.<\/li>\n<li><strong>지역(<code>zone<\/code>)·날짜별 최대 3개 시설<\/strong>을 확률 내림차순으로 선정한다. 확률이 같으면 시설 ID 오름차순을 적용한다. 나머지는 <code>BELOW_THRESHOLD<\/code> 또는 <code>CAPACITY_LIMIT<\/code>로 표시한다.<\/li>\n<li>신규 입력에서 한 행이라도 누락값이나 범위 오류가 있으면 해당 행을 거부하며, 유효한 나머지 기록은 별도로 처리한다.<\/li>\n<\/ul>\n<p><strong>STEP 07 — 분포 변화 경보와 안전한 배포<\/strong><\/p>\n<ul>\n<li>학습에서 특성별 관측 최소·최댓값을 함께 저장한다.<\/li>\n<li>Incoming에서 유효 행이 30개 이상이면, 하나 이상의 특성값이 학습 Range 밖에 있는 행의 비율을 구한다.<\/li>\n<li>해당 비율이 20%를 초과하면 <code>SHIFT_ALERT<\/code>를 기록하고 자동 점검 대상 확정을 중단한다. 예측 점수는 확인용으로 남길 수 있지만 <code>REVIEW_REQUIRED<\/code>로 구분한다.<\/li>\n<li>새 모델의 학습·검증과 Incoming 추론을 모두 통과한 뒤에만 배포 버전 정보를 갱신한다. 배포 정보 파일은 마지막에 교체한다.<\/li>\n<li>모델 파일 손상, Loader 예외, 기준 예측값 불일치 또는 결과 저장 실패가 발생하면 이전 정상 버전의 Weight·전처리 기준·결과를 유지해야 한다.<\/li>\n<li>배포 이후 문제가 확인되면 보존된 이전 정상 버전으로 Rollback할 수 있어야 한다. 이전 정상 버전이 없는 상태에서 Rollback을 요청하면 <code>NO_ROLLBACK_TARGET<\/code>을 기록한다. 배포 버전의 변경 이력은 별도로 관리한다.<\/li>\n<\/ul>\n<p><strong>STEP 08 — 추론 최적화 및 결과 일치 검증<\/strong><\/p>\n<ul>\n<li>검증 가능한 기준 구현(행별 추론)과 Batch 단위 Tensor(텐서) 추론을 각각 실행한다.<\/li>\n<li>동일한 입력에 대해 Classification 확률과 Regression 예측값의 최대 절댓값 차이가 <code>1e-6<\/code> 이하인지 확인한다.<\/li>\n<li>동일 CPU에서 여러 번 실행한 처리 시간을 측정하고 중앙값을 기록한다. 환경에 따라 시간 차이가 달라지므로 특정 속도 향상을 요구하지 않는다.<\/li>\n<li>추론 속도가 개선되어도 행 순서, 예측값, 상태 코드, 경보 목록이 바뀌지 않아야 한다.<\/li>\n<\/ul>\n<h4>입력 및 출력 규격<\/h4>\n<p>프로젝트는 <code>validate<\/code>, <code>train<\/code>, <code>resume<\/code>, <code>evaluate<\/code>, <code>predict<\/code>, <code>promote<\/code>, <code>rollback<\/code>, <code>benchmark<\/code> 등 단계별 명령으로 실행할 수 있습니다. 코드 구조는 자유롭게 설계하되, 각 단계에서 필요한 이전 단계의 산출물이 준비되었는지 확인해야 합니다.<\/p>\n<p><strong>필수 결과물<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>파일<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>clean_history.csv<\/code><\/td>\n<td>정상 과거 기록, 날짜·시설 ID 순으로 정렬<\/td>\n<\/tr>\n<tr>\n<td><code>rejected_rows.csv<\/code><\/td>\n<td><code>source_file,source_line,error_code<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>data_audit.json<\/code><\/td>\n<td>유효·무효 행 수, 오류 코드, 분할 날짜, Holdout Site 목록<\/td>\n<\/tr>\n<tr>\n<td><code>training_history.csv<\/code><\/td>\n<td><code>version,task,epoch,train_loss,validation_metric,learning_rate<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>checkpoints/<\/code><\/td>\n<td>v2의 중단·재개 학습 상태, Best Weight<\/td>\n<\/tr>\n<tr>\n<td><code>resume_audit.json<\/code><\/td>\n<td>연속 실행과 재개 실행의 파라미터 차이, 성공 여부<\/td>\n<\/tr>\n<tr>\n<td><code>validation_selection.json<\/code><\/td>\n<td>v1·v2 검증 지표와 배포 후보 선택 이유<\/td>\n<\/tr>\n<tr>\n<td><code>test_evaluation.json<\/code><\/td>\n<td>평가 A·B의 Classification·Regression 지표와 Baseline 비교<\/td>\n<\/tr>\n<tr>\n<td><code>deployment_manifest.json<\/code><\/td>\n<td>현재 버전, 모델·전처리 파일 경로, 검증 상태<\/td>\n<\/tr>\n<tr>\n<td><code>incoming_predictions.csv<\/code><\/td>\n<td><code>site_id,date,failure_probability,energy_prediction,selected,status<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>shift_report.json<\/code><\/td>\n<td>유효 행 수, 범위 초과 비율, <code>SHIFT_ALERT<\/code>, 자동 확정 가능 여부<\/td>\n<\/tr>\n<tr>\n<td><code>benchmark.json<\/code><\/td>\n<td>행별·Batch 추론 시간 중앙값, 결과 최대 차이<\/td>\n<\/tr>\n<tr>\n<td><code>final_report.md<\/code><\/td>\n<td>실험 설계, 복구·배포 이력, 테스트 평가, 오류 분석 및 성능 비교<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Classification 평가에는 Accuracy뿐 아니라 Precision·Recall·F2·Confusion Matrix도 포함해야 합니다. Regression에는 MAE와 RMSE를 함께 기록하며, 테스트 예측값의 오차가 큰 사례도 분석합니다. 수치 파일에는 소수점 넷째 자리까지 기록할 수 있지만, 모든 비교와 경보 판정은 반올림 전 값으로 수행합니다.<\/p>\n<h4>공개 검증 예제 — 무효 행과 중복 처리<\/h4>\n<p>다음은 Schema 검사 후 정상 행을 선택하는 규칙을 보여 주는 예시입니다. 전체 모델을 학습하기 위한 데이터 규모는 아닙니다.<\/p>\n<p><strong><code>sites.csv<\/code><\/strong><\/p>\n<pre><code class=\"language-csv\">site_id,zone,capacity\nS001,NORTH,200\nS002,SOUTH,150\n<\/code><\/pre>\n<p><strong><code>history.csv<\/code><\/strong><\/p>\n<pre><code class=\"language-csv\">site_id,date,temperature_c,vibration,energy_kwh,alarms_7d,failure_next_7d,energy_next_day,final_repair_cost\nS001,2026-06-01,23,2.1,96,1,0,102,0\nS001,2026-06-01,24,2.2,98,2,0,105,0\nS002,2026-06-01,25,-1,84,3,1,91,150000\nS002,2026-06-01,25,4.3,84,3,1,91,150000\n<\/code><\/pre>\n<p><strong>예제 <code>rejected_rows.csv<\/code><\/strong><\/p>\n<pre><code class=\"language-csv\">source_file,source_line,error_code\nhistory.csv,3,DUPLICATE_RECORD\nhistory.csv,4,INVALID_VALUE\n<\/code><\/pre>\n<p><code>S001<\/code>의 첫 번째 유효 기록만 인정합니다. <code>S002<\/code>의 음수 진동 기록은 무효이므로 같은 키를 점유하지 않으며, 그다음 유효 기록을 정상 처리합니다.<\/p>\n<h4>최종 검증 기준<\/h4>\n<ol>\n<li><strong>구조와 수식:<\/strong> 텐서 Shape, Logit·Target Shape, Loss와 학습 Loop가 의도한 대로 작동하는지 확인<\/li>\n<li><strong>데이터 무결성:<\/strong> 무효 행이 학습·평가·운영 출력에 섞이지 않고 오류 사유를 추적할 수 있는지 확인<\/li>\n<li><strong>미래 정보 차단:<\/strong> 사후 수리비와 미래 Target이 특성에 들어가지 않으며, 날짜 Gap과 Holdout 구분이 지켜지는지 확인<\/li>\n<li><strong>정확한 복구:<\/strong> Optimizer·Scheduler·난수 상태를 포함한 Resume이 연속 실행 결과와 일치하는지 확인<\/li>\n<li><strong>독립적인 평가:<\/strong> 검증으로 확정한 모델·Threshold를 테스트에서 변경하지 않는지 확인<\/li>\n<li><strong>안전한 운영 정책:<\/strong> 지역별 점검 한도, 동점 처리, Shift 경보와 자동 처리 차단이 정확한지 확인<\/li>\n<li><strong>배포·복구:<\/strong> 새 버전 실패 시 이전 정상 Weight·전처리·결과가 남고 Rollback이 가능한지 확인<\/li>\n<li><strong>재현성:<\/strong> 동일한 입력·설정에서 파일 순서와 결정적 판단 결과가 일치하는지 확인<\/li>\n<li><strong>최적화:<\/strong> 더 빠른 추론 구현이 결과를 바꾸지 않으며, 시간 측정 조건을 명확히 기록했는지 확인<\/li>\n<\/ol>\n<h4>제출 결과물<\/h4>\n<p>실행 가능한 Python 프로그램, 실습용 합성 데이터, 결과 파일, 자동 검증 코드와 최종 보고서를 제출한다. 코드의 폴더 구조는 자유롭게 설계할 수 있으나, 데이터 검사부터 학습·복구·평가·배포·Rollback까지 각 단계의 입력과 출력이 명확해야 한다.<\/p>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHoAAAJPCAYAAAADqLNRAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAXEgAAFxIBZ5/SUgAA1MdJREFUeJzs3XlUzfn/B/Dnbb3tCxFSCclWREjIMgiT7PvShGGMGcYyGGNkG8YYa5ax7 const LABELS={basic:'Basic',advanced:'Advanced',professional:'Professional',challenge:'Challenge',radiant:'Radiant'};
const STORAGE='mypaul-ai-part02-answers-v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let stored={};try{stored=JSON.parse(localStorage.getItem(STORAGE))||{}}catch(e){}
const state={view:'quiz',qFilter:'all',level:'all',search:'',problemId:'B-01',choices:stored.choices||{},written:stored.written||{},graded:false,help:{}};
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({choices:state.choices,written:state.written}))}catch(e){}}
function renderProgress(){
 const done=DATA.quizzes.filter(q=>q.kind==='mcq'&&state.choices[q.id]!==undefined).length;
 const written=DATA.quizzes.filter(q=>q.kind==='written'&&String(state.written[q.id]||'').trim()).length;
 $('#quizProgress').textContent=`객관식 ${done} / 16 응답`;$('#writtenProgress').textContent=`주관식 ${written} / 8 작성`;
 const el=$('#quizResult');
 if(state.graded){
  if(done===0){el.textContent='답안을 선택한 문항이 없습니다.';el.dataset.graded='false';}
  else{const correct=DATA.quizzes.filter(q=>q.kind==='mcq'&&state.choices[q.id]!==undefined&&Number(state.choices[q.id])===q.answer).length;
   el.textContent=`채점 결과 · 응답 ${done}문항 / 정답 ${correct}문항 / 오답 ${done-correct}문항`;el.dataset.graded='true';}
 }else{el.textContent='';el.dataset.graded='false';}
}
function renderQuiz(){
 const selected=DATA.quizzes.filter(q=>state.qFilter==='all'||q.kind===state.qFilter);
 $('#quizList').innerHTML=selected.map(q=>{
  const selectedIdx=state.choices[q.id];
  const opts=q.kind==='mcq'?`<div class="quiz-options" role="group" aria-label="${q.id} 답안">`+q.choices.map((choice,i)=>{
   const checked=selectedIdx!==undefined&&Number(selectedIdx)===i;
   // NEVER mark the correct option if a different option was selected.
   const status=state.graded&&checked?(i===q.answer?'correct':'incorrect'):checked?'checked':'';
   return `<label class="quiz-choice ${status}"><input type="checkbox" name="ans-${q.id}" data-quiz-id="${q.id}" value="${i}" ${checked?'checked':''}><span class="choice-no">${i+1}.</span><div class="choice-text">${choice}</div></label>`;
  }).join('')+'</div>':`<textarea spellcheck="false" data-written-id="${q.id}" aria-label="${q.id} 주관식 답안" placeholder="답안을 작성하세요.">${esc(state.written[q.id]||'')}</textarea><div class="writing-note">작성한 답안은 현재 브라우저에 저장됩니다.</div>`;
  const status=state.graded&&q.kind==='mcq'&&selectedIdx!==undefined?(Number(selectedIdx)===q.answer?'정답':'오답'):'';
  return `<article class="quiz-item" id="quiz-${q.id}"><h3 class="quiz-number">${q.id}.</h3><div class="quiz-reference">${q.related}</div><div class="quiz-question">${q.stem}</div>${opts}<div class="quiz-eval ${status==='정답'?'ok':status==='오답'?'bad':''}" aria-live="polite">${status?`채점: ${status}`:''}</div><details class="quiz-answer"><summary><strong>정답 및 해설</strong></summary><div class="fold-body">${q.solution}</div></details></article>`;
 }).join('');
 $$('.quiz-filter').forEach(b=>b.classList.toggle('active',b.dataset.quiz===state.qFilter));
 $('#crumb').textContent=state.qFilter==='all'?'전체 문항':state.qFilter==='mcq'?'객관식':'주관식';
 renderProgress();renderNavigation();
}

function helpMarkup(p){
 if(!p.steps.length)return '';
 const shown=Math.min(p.steps.length,Math.max(0,Number(state.help[p.id]||0)));
 return `<section class="guided-help" id="guidedHelp"><div class="guided-help-header"><h3>단계별 가이드</h3><button id="helpNext" type="button">${shown===0?'HELP':shown<p.steps.length?`STEP ${shown+1} 보기`:'모든 STEP 확인'}</button></div>${shown?`<p class="help-progress">${shown} / ${p.steps.length} 단계 확인</p>`:''}${p.steps.slice(0,shown).map(s=>`<section class="guided-help-step"><h4>${esc(s.title)}</h4><div>${s.html}</div></section>`).join('')}</section>`;
}
function renderProblem(){
 const all=visibleProblems();if(all.length&&!all.some(p=>p.id===state.problemId))state.problemId=all[0].id;
 const index=all.findIndex(p=>p.id===state.problemId),p=all[index];
 if(!p){$('#problemHost').innerHTML='<div class="search-empty">검색 조건에 해당하는 문제가 없습니다.</div>';$('#crumb').textContent='검색 결과 없음';$('#pageCounter').textContent='0 / 0';}
 else{
  $('#problemHost').innerHTML=`<article class="sheet problem-wrap ${p.level==='radiant'?'radiant-sheet':''}" data-level="${p.level}" id="problem-${p.id}"><div class="sheet-top"></div><div class="sheet-content"><div class="sheet-meta"><span>AI · SUMMARY PART 02</span><span class="right">${LABELS[p.level].toUpperCase()} / ${p.id}</span></div><header class="problem-header"><div class="problem-no ${p.level==='radiant'?'radiant-gem':''}">${p.level==='radiant'?gemHTML():`<strong>${p.id}</strong><small>PROBLEM</small>`}</div><div class="header-titles"><h2>${esc(p.title)}</h2></div></header>${p.related?`<div class="problem-related">${p.related}</div>`:''}<div class="problem-body">${p.body}</div>${helpMarkup(p)}</div><footer class="sheet-footer"><div class="footer-inner"><span>Deep Learning with PyTorch · Chapter 05–07</span><span>${p.id} / Summary — Part 02</span></div></footer></article>`;
  $('#crumb').textContent=`${LABELS[p.level]} · ${p.id}`;$('#pageCounter').textContent=`${index+1} / ${all.length}`;
 }
 $('#previous').disabled=index<=0;$('#next').disabled=index<0||index===all.length-1;
 $$('#problemFilters button[data-level]').forEach(b=>b.classList.toggle('active',b.dataset.level===state.level));renderNavigation();

function renderNavigation(){
 const nav=$('#navigation');let out='';
 if(state.view==='quiz'){for(const [kind,label] of [['mcq','객관식'],['written','주관식']]){
  const items=DATA.quizzes.filter(q=>q.kind===kind);out+=`<div class="tierhead"><span>${label}</span><span>${items.length}</span></div>`+items.map(q=>`<button type="button" class="side-link" data-nav-quiz="${q.id}"><span class="n">${q.id}</span></button>`).join('');}}
 else{for(const level of Object.keys(LABELS)){const items=DATA.problems.filter(p=>p.level===level);out+=`<div class="tierhead"><span>${LABELS[level]}</span><span>${items.length}</span></div>`+items.map(p=>`<button type="button" class="side-link ${p.id===state.problemId?'active':''}" data-nav-problem="${p.id}"><span class="n">${p.id}</span><span class="t">${esc(p.title)}</span></button>`).join('');}}
 nav.innerHTML=out;
}
function setView(view){state.view=view;$('#quizView').classList.toggle('hidden',view!=='quiz');$('#problemsView').classList.toggle('hidden',view!=='problems');$('#modeQuiz').classList.toggle('active',view==='quiz');$('#modeProblems').classList.toggle('active',view==='problems');$('#sideNavTitle').textContent=view==='quiz'?'QUIZ / REVIEW':'PROBLEMS / LEVELS';$('#toolbarMode').textContent=view==='quiz'?'Quiz':'Problems';$('#resetAnswers').classList.toggle('hidden',view!=='quiz');view==='quiz'?renderQuiz():renderProblem();}
$('#modeQuiz').addEventListener('click',()=>setView('quiz'));$('#modeProblems').addEventListener('click',()=>setView('problems'));
$$('.quiz-filter').forEach(b=>b.addEventListener('click',()=>{state.qFilter=b.dataset.quiz;renderQuiz();}));
$('#quizList').addEventListener('change',e=>{const input=e.target;if(input.matches('input[data-quiz-id]')){if(input.checked)state.choices[input.dataset.quizId]=Number(input.value);else delete state.choices[input.dataset.quizId];state.graded=false;save();renderQuiz();}});
$('#quizList').addEventListener('input',e=>{const el=e.target;if(el.matches('textarea[data-written-id]')){state.written[el.dataset.writtenId]=el.value;save();renderProgress();}});
$('#gradeQuiz').addEventListener('click',()=>{state.graded=true;renderQuiz();});
$('#resetAnswers').addEventListener('click',()=>{if(!confirm('작성한 객관식·주관식 답안을 모두 초기화하시겠습니까?'))return;state.choices={};state.written={};state.graded=false;save();renderQuiz();});
$$('#problemFilters button[data-level]').forEach(b=>b.addEventListener('click',()=>{state.level=b.dataset.level;state.problemId='';renderProblem();}));
$('#search').addEventListener('input',e=>{state.search=e.target.value;state.problemId='';renderProblem();});
function move(delta){const ps=visibleProblems();const idx=ps.findIndex(p=>p.id===state.problemId);const nxt=ps[idx+delta];if(nxt){state.problemId=nxt.id;renderProblem();}}
$('#previous').addEventListener('click',()=>move(-1));$('#next').addEventListener('click',()=>move(1));
$('#navigation').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.navQuiz){state.qFilter='all';renderQuiz();document.getElementById('quiz-'+b.dataset.navQuiz)?.scrollIntoView({behavior:'auto',block:'start'});}
 else if(b.dataset.navProblem){state.level='all';state.search='';$('#search').value='';state.problemId=b.dataset.navProblem;renderProblem();document.getElementById('problem-'+state.problemId)?.scrollIntoView({behavior:'auto',block:'start'});}
});
$('#printCurrent').addEventListener('click',()=>window.print());
document.addEventListener('keydown',e=>{if(state.view==='problems'&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.target.matches('input,textarea,select,button')&&!$('#helpModal').classList.contains('hidden'))return;
 if(state.view==='problems'&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.target.matches('input,textarea,select,button')){if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);}});
// Accessible custom yes/no confirmation sequence.
function askHelp(question,confirmOnly=false){return new Promise(resolve=>{const modal=$('#helpModal');$('#helpQuestion').textContent=question;$('#helpYes').textContent=confirmOnly?'확인':'네';$('#helpNo').classList.toggle('hidden',confirmOnly);modal.classList.remove('hidden');$('#helpYes').focus();
 function finish(value){modal.classList.add('hidden');$('#helpYes').removeEventListener('click',yes);$('#helpNo').removeEventListener('click',no);document.removeEventListener('keydown',key);resolve(value);}
 function yes(){finish(true);}function no(){finish(false);}function key(e){if(e.key==='Escape'&&!confirmOnly)finish(false);}
 $('#helpYes').addEventListener('click',yes);$('#helpNo').addEventListener('click',no);document.addEventListener('keydown',key);
 });}
let helpBusy=false;
async function revealHelp(){
 if(helpBusy)return;const p=DATA.problems.find(x=>x.id===state.problemId);if(!p?.steps.length)return;
 const seen=Number(state.help[p.id]||0);if(seen>=p.steps.length)return;
 helpBusy=true;try{
  const n=seen+1;
  if(n===1){if(!await askHelp('정말로 도움이 필요하신가요?'))return;if(!await askHelp('간절한가요?'))return;}
  else if(n===2){if(!await askHelp('궁금한가요?'))return;}
  else if(n===3){if(!await askHelp('패배를 인정합니까'))return;await askHelp('당신은 졌습니다',true);}
  state.help[p.id]=n;const panel=$('#guidedHelp');if(panel)panel.outerHTML=helpMarkup(p);
 }finally{helpBusy=false;}
}
$('#problemHost').addEventListener('click',e=>{if(e.target.closest('#helpNext'))revealHelp();});
setView('quiz');
</script></body></html>
