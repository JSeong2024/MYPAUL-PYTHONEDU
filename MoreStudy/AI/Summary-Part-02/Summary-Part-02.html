<script>
'use strict';
const DATA={"quizzes":[{"id":"Q-01","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a><\/p>\n","stem":"<p>다음 코드의 실행 결과로 올바른 것은 무엇입니까?<\/p>\n<pre><code class=\"language-python\">import torch\n\nx = torch.tensor([[1, 2, 3], [4, 5, 6]], dtype=torch.float32)\nprint(x.shape, x.dtype)\n<\/code><\/pre>\n","choices":["<p><code>torch.Size([3, 2]) torch.float32<\/code><\/p>\n","<p><code>torch.Size([2, 3]) torch.int64<\/code><\/p>\n","<p><code>torch.Size([2, 3]) torch.float32<\/code><\/p>\n","<p><code>torch.Size([6]) torch.float32<\/code><\/p>\n"],"answer":2,"solution":"<p><strong>정답: ③<\/strong><\/p>\n<p>2행 3열의 2차원 텐서이므로 Shape는 <code>(2, 3)<\/code>입니다. <code>dtype=torch.float32<\/code>를 지정했으므로 정수 형태로 입력한 값도 <code>float32<\/code> 자료형으로 저장됩니다.<\/p>\n<p><strong>오답 해설<\/strong><\/p>\n<ul>\n<li><strong>①:<\/strong> 행과 열의 수를 뒤바꾸었습니다.<\/li>\n<li><strong>②:<\/strong> <code>dtype<\/code>을 명시했으므로 <code>int64<\/code>가 아닙니다.<\/li>\n<li><strong>④:<\/strong> 텐서를 1차원으로 펼치는 연산은 수행하지 않았습니다.<\/li>\n<\/ul>\n"},{"id":"Q-02","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a><\/p>\n","stem":"<p>다음 중 PyTorch에서 두 텐서를 원소별로 더할 때 <strong>Shape 오류 없이 실행되는 조합<\/strong>은 무엇입니까?<\/p>\n","choices":["<p><code>(4, 3)<\/code>과 <code>(4,)<\/code><\/p>\n","<p><code>(4, 3)<\/code>과 <code>(3,)<\/code><\/p>\n","<p><code>(4, 3)<\/code>과 <code>(2, 3)<\/code><\/p>\n","<p><code>(4, 3)<\/code>과 <code>(3, 4)<\/code><\/p>\n"],"answer":1,"solution":"<p><strong>정답: ②<\/strong><\/p>\n<p>Broadcasting은 뒤쪽 차원부터 크기를 비교합니다. <code>(4, 3)<\/code>과 <code>(3,)<\/code>은 마지막 차원의 크기가 <code>3<\/code>으로 같으므로 두 번째 텐서가 각 행에 더해집니다. 결과 Shape는 <code>(4, 3)<\/code>입니다.<\/p>\n<p><strong>오답 해설<\/strong><\/p>\n<ul>\n<li><strong>①:<\/strong> 뒤쪽 차원 <code>3<\/code>과 <code>4<\/code>가 맞지 않습니다.<\/li>\n<li><strong>③:<\/strong> 첫 차원 <code>4<\/code>와 <code>2<\/code>는 서로 다르고 어느 쪽도 <code>1<\/code>이 아닙니다.<\/li>\n<li><strong>④:<\/strong> 마지막 차원부터 비교하면 <code>3<\/code>과 <code>4<\/code>가 일치하지 않습니다.<\/li>\n<\/ul>\n"},{"id":"Q-03","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a><\/p>\n","stem":"<p><code>A<\/code>의 Shape가 <code>(8, 5)<\/code>, <code>B<\/code>의 Shape가 <code>(5, 3)<\/code>일 때 <code>A @ B<\/code>의 결과 Shape는 무엇입니까?<\/p>\n","choices":["<p><code>(8, 3)<\/code><\/p>\n","<p><code>(5, 5)<\/code><\/p>\n","<p><code>(8, 5, 3)<\/code><\/p>\n","<p><code>(3, 8)<\/code><\/p>\n"],"answer":0,"solution":"<p><strong>정답: ①<\/strong><\/p>\n<p>행렬 곱에서는 왼쪽 행렬의 열 수와 오른쪽 행렬의 행 수가 같아야 합니다. 따라서 <code>(8, 5) @ (5, 3)<\/code>의 결과 Shape는 <code>(8, 3)<\/code>입니다.<\/p>\n"},{"id":"Q-04","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a><\/p>\n","stem":"<p>CPU 메모리에 있는 NumPy 배열 <code>a<\/code>로 <code>x = torch.from_numpy(a)<\/code>를 실행했습니다. 이어서 <code>x[0] = 99<\/code>를 실행하면 어떻게 됩니까?<\/p>\n","choices":["<p><code>torch.from_numpy()<\/code>는 항상 복사본을 만들므로 <code>a<\/code>는 변경되지 않습니다.<\/p>\n","<p>일반적으로 저장 공간을 공유하므로 <code>a[0]<\/code>도 변경됩니다.<\/p>\n","<p>텐서의 값을 변경하면 NumPy 배열의 Dtype이 자동으로 <code>float32<\/code>로 바뀝니다.<\/p>\n","<p><code>torch.from_numpy()<\/code>는 GPU 배열만 입력받을 수 있습니다.<\/p>\n"],"answer":1,"solution":"<p><strong>정답: ②<\/strong><\/p>\n<p><code>torch.from_numpy()<\/code>로 만든 텐서는 NumPy 배열과 메모리를 공유합니다. 따라서 텐서에서 원소를 수정하면 원본 배열에도 반영됩니다. 독립적인 텐서가 필요하다면 <code>.clone()<\/code>을 사용할 수 있습니다. 단, 읽기 전용 배열이나 지원하지 않는 자료형은 별도로 주의해야 합니다.<\/p>\n<p><strong>오답 해설<\/strong><\/p>\n<ul>\n<li><strong>①:<\/strong> 항상 복사하는 함수가 아닙니다.<\/li>\n<li><strong>③:<\/strong> 원소 값을 수정해도 배열의 Dtype은 바뀌지 않습니다.<\/li>\n<li><strong>④:<\/strong> <code>torch.from_numpy()<\/code>는 NumPy 배열을 입력받는 함수로, GPU 배열만 허용하는 것이 아닙니다.<\/li>\n<\/ul>\n"},{"id":"Q-05","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a><\/p>\n","stem":"<p>다음 코드의 출력으로 올바른 것은 무엇입니까?<\/p>\n<pre><code class=\"language-python\">import torch\n\nw = torch.tensor(2.0, requires_grad=True)\n(w**2).backward()\n(w**2).backward()\nprint(w.grad.item())\n<\/code><\/pre>\n","choices":["<p><code>0.0<\/code><\/p>\n","<p><code>4.0<\/code><\/p>\n","<p><code>8.0<\/code><\/p>\n","<p>실행 시 항상 <code>RuntimeError<\/code>가 발생합니다.<\/p>\n"],"answer":2,"solution":"<p><strong>정답: ③<\/strong><\/p>\n<p>각 <code>w**2<\/code>의 미분값은 <code>2w = 4<\/code>입니다. PyTorch는 Gradient를 기본적으로 누적하므로 두 번의 <code>backward()<\/code> 실행 후 <code>w.grad<\/code>는 <code>4 + 4 = 8<\/code>이 됩니다. <code>w**2<\/code>를 매번 다시 계산해 서로 다른 그래프에서 역전파하므로 그래프 재사용 오류도 발생하지 않습니다.<\/p>\n<p><strong>오답 해설<\/strong><\/p>\n<ul>\n<li><strong>①:<\/strong> <code>backward()<\/code>는 기존 Gradient를 자동으로 초기화하지 않습니다.<\/li>\n<li><strong>②:<\/strong> 한 번만 역전파한 값입니다.<\/li>\n<li><strong>④:<\/strong> 코드의 두 연산은 서로 다른 계산 그래프를 만듭니다.<\/li>\n<\/ul>\n"},{"id":"Q-06","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a>, <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a><\/p>\n","stem":"<p>다음 중 추론 코드에 대한 설명으로 가장 적절한 것은 무엇입니까?<\/p>\n","choices":["<p><code>model.eval()<\/code>은 모델의 파라미터에 저장된 Gradient를 모두 삭제합니다.<\/p>\n","<p><code>torch.no_grad()<\/code>만 사용하면 Dropout이 자동으로 평가 모드로 바뀝니다.<\/p>\n","<p><code>model.eval()<\/code>과 <code>torch.no_grad()<\/code>는 동일한 기능을 수행합니다.<\/p>\n","<p><code>model.eval()<\/code>로 평가 동작을 설정하고, <code>torch.no_grad()<\/code>로 Gradient 기록을 비활성화할 수 있습니다.<\/p>\n"],"answer":3,"solution":"<p><strong>정답: ④<\/strong><\/p>\n<p><code>model.eval()<\/code>은 Dropout이나 BatchNorm처럼 학습·평가 모드에 따라 동작이 달라지는 계층을 평가 모드로 전환합니다. <code>torch.no_grad()<\/code>는 실행 구간에서 Autograd의 그래프 기록을 비활성화합니다. 두 기능은 역할이 다르므로 일반적인 평가·추론에서는 함께 사용합니다.<\/p>\n<p><strong>오답 해설<\/strong><\/p>\n<ul>\n<li><strong>①:<\/strong> 모드를 바꾸는 것과 저장된 Gradient를 지우는 것은 다릅니다.<\/li>\n<li><strong>②:<\/strong> <code>no_grad()<\/code>는 Dropout의 동작 모드를 바꾸지 않습니다.<\/li>\n<li><strong>③:<\/strong> 역할이 다릅니다.<\/li>\n<\/ul>\n"},{"id":"Q-07","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a><\/p>\n","stem":"<p>샘플 23개를 <code>DataLoader(batch_size=8, shuffle=False, drop_last=False)<\/code>로 처리했습니다. 각 배치의 샘플 수는 무엇입니까?<\/p>\n","choices":["<p><code>8, 8, 8<\/code><\/p>\n","<p><code>8, 8, 7<\/code><\/p>\n","<p><code>8, 7, 7, 1<\/code><\/p>\n","<p><code>8, 8<\/code>이며 나머지 7개는 항상 버려집니다.<\/p>\n"],"answer":1,"solution":"<p><strong>정답: ②<\/strong><\/p>\n<p>23개를 8개씩 나누면 크기가 8인 배치 2개와 크기가 7인 배치 1개가 만들어집니다. <code>drop_last=False<\/code>이므로 마지막 배치도 처리합니다. Loss를 집계하거나 Gradient를 누적할 때는 이 배치의 실제 샘플 수도 고려해야 합니다.<\/p>\n"},{"id":"Q-08","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a><\/p>\n","stem":"<p>PyTorch의 Custom Dataset에서 <code>__len__()<\/code>과 <code>__getitem__(index)<\/code>의 역할을 올바르게 설명한 것은 무엇입니까?<\/p>\n","choices":["<p>두 함수 모두 반드시 GPU로 데이터를 이동시켜야 합니다.<\/p>\n","<p><code>__len__()<\/code>은 전체 샘플 수를, <code>__getitem__()<\/code>은 지정된 인덱스의 샘플을 반환합니다.<\/p>\n","<p><code>__len__()<\/code>은 배치 크기를, <code>__getitem__()<\/code>은 Epoch 수를 반환합니다.<\/p>\n","<p>두 함수를 구현하면 <code>DataLoader<\/code>가 항상 데이터를 섞습니다.<\/p>\n"],"answer":1,"solution":"<p><strong>정답: ②<\/strong><\/p>\n<p>일반적인 Map-style Dataset은 전체 샘플 수를 반환하는 <code>__len__()<\/code>과 지정된 인덱스의 샘플을 반환하는 <code>__getitem__()<\/code>을 구현합니다. 배치 구성과 데이터 섞기(Shuffle)는 주로 <code>DataLoader<\/code>에서 설정하며, GPU로 데이터를 옮기는 작업은 Dataset의 필수 역할이 아닙니다.<\/p>\n"},{"id":"Q-09","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a><\/p>\n","stem":"<p><code>torch.nn.Linear(4, 3, bias=True)<\/code>의 학습 가능한 파라미터 수는 얼마입니까?<\/p>\n","choices":["<p>7개<\/p>\n","<p>12개<\/p>\n","<p>15개<\/p>\n","<p>24개<\/p>\n"],"answer":2,"solution":"<p><strong>정답: ③<\/strong><\/p>\n<p>Weight의 Shape는 <code>(out_features, in_features) = (3, 4)<\/code>이므로 원소가 12개입니다. Bias는 출력 뉴런마다 1개씩 있어 3개이며, 총 파라미터 수는 <code>12 + 3 = 15<\/code>개입니다.<\/p>\n"},{"id":"Q-10","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a><\/p>\n","stem":"<p>다음 신경망에서 두 <code>Linear<\/code> 계층 사이에 ReLU 활성화 함수를 사용하는 주된 이유는 무엇입니까?<\/p>\n<pre><code class=\"language-python\">import torch\n\nmodel = torch.nn.Sequential(\n    torch.nn.Linear(2, 8),\n    torch.nn.ReLU(),\n    torch.nn.Linear(8, 1),\n)\n<\/code><\/pre>\n","choices":["<p>모든 파라미터를 고정하여 학습을 방지하기 위해서<\/p>\n","<p>신경망이 선형 변환만으로 표현하기 어려운 비선형 관계를 학습할 수 있도록 하기 위해서<\/p>\n","<p>입력 샘플 수를 자동으로 늘리기 위해서<\/p>\n","<p><code>backward()<\/code> 호출 없이 Gradient를 계산하기 위해서<\/p>\n"],"answer":1,"solution":"<p><strong>정답: ②<\/strong><\/p>\n<p>비선형 연산 없이 <code>Linear<\/code> 계층만 연결하면 전체를 하나의 아핀 변환(Affine Transformation)으로 표현할 수 있습니다. ReLU는 비선형성을 추가해 모델이 더 복잡한 관계를 학습하도록 돕습니다. 예를 들어 XOR 데이터는 하나의 직선으로 분리할 수 없습니다.<\/p>\n<p><strong>오답 해설<\/strong><\/p>\n<ul>\n<li><strong>①:<\/strong> ReLU는 파라미터를 고정하지 않습니다.<\/li>\n<li><strong>③:<\/strong> ReLU는 샘플 수를 바꾸지 않습니다.<\/li>\n<li><strong>④:<\/strong> 자동 미분이 활성화 함수를 대신하는 것은 아닙니다.<\/li>\n<\/ul>\n"},{"id":"Q-11","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a><\/p>\n","stem":"<p>출력 계층이 <code>nn.Linear(8, 1)<\/code>이고 <code>forward()<\/code>에서 <strong>Sigmoid를 적용하지 않은 Logit<\/strong>을 반환합니다. 이진 분류 학습에 가장 적절한 방법은 무엇입니까?<\/p>\n","choices":["<p><code>nn.BCEWithLogitsLoss()<\/code>에 Logit과 실수형 Target을 전달합니다.<\/p>\n","<p>Logit에 Softmax를 적용한 뒤 <code>nn.MSELoss()<\/code>만 사용해야 합니다.<\/p>\n","<p><code>nn.CrossEntropyLoss()<\/code>를 사용하되 Target은 반드시 <code>(N, 1)<\/code> 실수형이어야 합니다.<\/p>\n","<p>Logit에 Sigmoid를 적용하고 다시 <code>nn.BCEWithLogitsLoss()<\/code>를 사용합니다.<\/p>\n"],"answer":0,"solution":"<p><strong>정답: ①<\/strong><\/p>\n<p><code>BCEWithLogitsLoss<\/code>는 Sigmoid와 이진 교차 엔트로피 계산을 수치적으로 안정적인 방식으로 결합합니다. Logit을 입력받으며, Target에는 Logit과 Shape가 같은 실수형 <code>0<\/code> 또는 <code>1<\/code>을 사용합니다.<\/p>\n<p><strong>오답 해설<\/strong><\/p>\n<ul>\n<li><strong>②:<\/strong> 이진 분류에 Softmax와 MSE 조합이 필요한 것은 아닙니다.<\/li>\n<li><strong>③:<\/strong> 일반적인 두 클래스 Logit 출력의 <code>CrossEntropyLoss<\/code>는 <code>(N, 2)<\/code> Logit과 <code>(N,)<\/code> 정수형 클래스 인덱스를 사용합니다.<\/li>\n<li><strong>④:<\/strong> Sigmoid를 미리 적용하면 Logit을 입력받아야 하는 Loss 함수에 확률을 전달하게 됩니다.<\/li>\n<\/ul>\n"},{"id":"Q-12","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a><\/p>\n","stem":"<p>5개 클래스를 분류하는 모델의 배치 크기가 16일 때, <code>CrossEntropyLoss<\/code>를 올바르게 사용하는 방법은 무엇입니까?<\/p>\n","choices":["<p>모델 출력 <code>(16, 5)<\/code> Logit, Target <code>(16,)<\/code> 정수형 클래스 인덱스<\/p>\n","<p>모델 출력 <code>(16,)<\/code> Logit, Target <code>(16, 5)<\/code> 문자열 Label<\/p>\n","<p>모델 출력 <code>(5, 16)<\/code> 확률, Target <code>(5,)<\/code> 실수형 Label<\/p>\n","<p>모델 출력 <code>(16, 5)<\/code>에 Softmax를 반드시 적용한 뒤 <code>CrossEntropyLoss<\/code>를 호출<\/p>\n"],"answer":0,"solution":"<p><strong>정답: ①<\/strong><\/p>\n<p>일반적인 단일 레이블 다중 분류에서는 샘플마다 클래스별 Logit 5개를 출력합니다. <code>CrossEntropyLoss<\/code>에는 <code>(N, C)<\/code> Shape의 Logit과 <code>(N,)<\/code> Shape의 <code>torch.long<\/code> 클래스 인덱스를 전달합니다. 내부적으로 LogSoftmax에 해당하는 계산을 수행하므로 Softmax를 미리 적용하지 않습니다.<\/p>\n"},{"id":"Q-13","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a><\/p>\n","stem":"<p>Dropout을 포함한 MLP에서 동일한 입력에 대한 예측을 반복 실행했을 때 평가 모드에서 결과가 안정적으로 나오는 주된 이유는 무엇입니까?<\/p>\n","choices":["<p><code>eval()<\/code>이 저장된 Weight를 모두 0으로 만들기 때문입니다.<\/p>\n","<p>평가 모드에서는 Dropout의 무작위 제거가 적용되지 않기 때문입니다.<\/p>\n","<p>평가 모드에서는 모든 텐서가 자동으로 CPU로 이동하기 때문입니다.<\/p>\n","<p><code>eval()<\/code>을 호출하면 <code>optimizer.step()<\/code>이 자동으로 실행되기 때문입니다.<\/p>\n"],"answer":1,"solution":"<p><strong>정답: ②<\/strong><\/p>\n<p>Dropout은 학습 모드에서 일부 활성값을 무작위로 제거해 Overfitting을 줄이는 데 사용됩니다. 평가 모드에서는 Dropout이 비활성화되므로 입력과 Weight가 같고 연산이 결정적이라면 같은 결과가 나옵니다. 단, <code>eval()<\/code>만으로 Gradient 기록이 중단되지는 않습니다.<\/p>\n"},{"id":"Q-14","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a><\/p>\n","stem":"<p>어떤 Epoch에서 샘플 4개인 배치의 평균 Loss가 <code>0.2<\/code>, 샘플 1개인 마지막 배치의 평균 Loss가 <code>0.8<\/code>이었습니다. 각 배치의 Loss가 샘플별 Loss의 평균일 때, 전체 Epoch 평균 Loss는 얼마입니까?<\/p>\n","choices":["<p><code>0.20<\/code><\/p>\n","<p><code>0.30<\/code><\/p>\n","<p><code>0.32<\/code><\/p>\n","<p><code>0.50<\/code><\/p>\n"],"answer":2,"solution":"<p><strong>정답: ③<\/strong><\/p>\n<p>배치 평균을 다시 단순 평균하면 <code>(0.2 + 0.8) / 2 = 0.5<\/code>입니다. 하지만 샘플마다 같은 비중을 주려면 배치 크기로 가중 평균해야 하므로 <code>(0.2 × 4 + 0.8 × 1) / 5 = 0.32<\/code>가 됩니다.<\/p>\n"},{"id":"Q-15","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a><\/p>\n","stem":"<p>초기 학습률이 <code>0.1<\/code>이고 다음과 같이 Scheduler를 설정했습니다. <code>model<\/code>은 이미 정의되어 있다고 가정합니다. 매 Epoch 학습을 마친 뒤 <code>scheduler.step()<\/code>을 한 번 호출한다면, <strong>두 번째 호출 직후<\/strong>의 학습률은 얼마입니까?<\/p>\n<pre><code class=\"language-python\">import torch\n\noptimizer = torch.optim.SGD(model.parameters(), lr=0.1)\nscheduler = torch.optim.lr_scheduler.StepLR(\n    optimizer, step_size=2, gamma=0.5\n)\n<\/code><\/pre>\n","choices":["<p><code>0.1<\/code><\/p>\n","<p><code>0.05<\/code><\/p>\n","<p><code>0.025<\/code><\/p>\n","<p><code>0.5<\/code><\/p>\n"],"answer":1,"solution":"<p><strong>정답: ②<\/strong><\/p>\n<p><code>StepLR(step_size=2, gamma=0.5)<\/code>는 <code>scheduler.step()<\/code>을 두 번 호출할 때마다 학습률에 <code>0.5<\/code>를 곱합니다. 첫 번째 호출 직후에는 <code>0.1<\/code>, 두 번째 호출 직후에는 <code>0.05<\/code>가 됩니다. 일반적인 학습 루프에서는 해당 Epoch의 Optimizer 갱신을 마친 뒤 Scheduler를 실행합니다.<\/p>\n"},{"id":"Q-16","title":"","kind":"mcq","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a><\/p>\n","stem":"<p>AdamW와 Scheduler를 사용하는 모델의 학습을 완료한 Epoch 다음부터 재개하려고 합니다. <strong>가장 적절한 저장 방식<\/strong>은 무엇입니까?<\/p>\n","choices":["<p>모델의 <code>state_dict()<\/code>만 저장하면 Optimizer의 내부 상태와 Scheduler 진행 위치까지 항상 복원됩니다.<\/p>\n","<p>최종 Test Accuracy만 기록하면 재학습 없이 같은 Weight를 얻을 수 있습니다.<\/p>\n","<p>모델·Optimizer·Scheduler State와 완료한 Epoch, 필요한 난수·데이터 순서 상태를 함께 보관합니다.<\/p>\n","<p>중단 후에는 모델을 반드시 처음부터 다시 초기화하고 Test 결과를 기준으로 최적 Epoch를 찾습니다.<\/p>\n"],"answer":2,"solution":"<p><strong>정답: ③<\/strong><\/p>\n<p>학습을 이어서 수행하려면 모델 Weight뿐 아니라 Optimizer와 Scheduler의 내부 상태, 완료한 Epoch 정보를 저장해야 합니다. 데이터 순서와 Dropout에 사용된 난수 상태도 재현성에 영향을 줍니다. Epoch 경계에서 재개하는지, 배치 중간에서 재개하는지에 따라 필요한 저장 정보가 달라집니다.<\/p>\n<p><strong>오답 해설<\/strong><\/p>\n<ul>\n<li><strong>①:<\/strong> 모델 Weight만으로 Optimizer와 Scheduler의 상태가 복원되지는 않습니다.<\/li>\n<li><strong>②:<\/strong> 평가 점수만으로는 모델 Weight나 학습 상태를 복원할 수 없습니다.<\/li>\n<li><strong>④:<\/strong> Test 데이터를 반복적인 모델 선택에 사용하면 최종 평가의 독립성이 훼손됩니다.<\/li>\n<\/ul>\n"},{"id":"Q-17","title":"","kind":"written","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a>, <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a><\/p>\n","stem":"<p>다음 식에서 <code>y<\/code>와 <code>dy/dw<\/code>를 계산하고, PyTorch 코드로 Gradient를 확인하십시오.<\/p>\n<div class=\"math-expression math-rendered\" role=\"math\"><mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertic  498 172 481T127 463Z\"><\/path><\/g><g data-mml-node=\"mo\" transform=\"translate(12426.2,0)\"><path data-c=\"3D\" d=\"M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z\"><\/path><\/g><g data-mml-node=\"mn\" transform=\"translate(13482,0)\"><path data-c=\"34\" d=\"M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z\"><\/path><path data-c=\"32\" d=\"M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z\" transform=\"translate(500,0)\"><\/path><\/g><\/g><\/g><\/svg><\/mjx-container><\/div>\n<pre><code class=\"language-python\">import torch\n\nw = torch.tensor(2.0, requires_grad=True)\nx = torch.tensor(3.0)\ny = (w * x + 1) ** 2\ny.backward()\nprint(y.item())       # 49.0\nprint(w.grad.item())  # 42.0\n<\/code><\/pre>\n<p>PyTorch는 Leaf Tensor의 <code>.grad<\/code>에 Gradient를 누적합니다. 누적이 필요하지 않다면 다음 역전파 전에 <code>w.grad = None<\/code> 등으로 초기화해야 합니다. 같은 계산 그래프를 다시 역전파할 때는 그래프 재사용 가능 여부도 확인해야 합니다.<\/p>\n"},{"id":"Q-18","title":"","kind":"written","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a><\/p>\n","stem":"<p>센서 측정값 <code>x<\/code>의 Shape는 <code>(2, 3)<\/code>입니다. 각 행에 채널별 보정값 <code>offsets = [1.0, -2.0, 0.5]<\/code>를 더한 뒤 유효한 값만 집계하려고 합니다. <code>NaN<\/code>은 유효하지 않은 값으로 처리합니다.<\/p>\n<pre><code class=\"language-python\">import torch\n\nx = torch.tensor([\n    [10.0, 20.0, float(&quot;nan&quot;)],\n    [12.0, 22.0, 30.0],\n])\noffsets = torch.tensor([1.0, -2.0, 0.5])\n<\/code><\/pre>\n<p>유효한 원소만 보정해 <strong>채널별 유효 샘플 수와 평균<\/strong>을 계산하는 코드를 작성하십시오. 유효값이 없는 채널의 처리 방침도 제시하십시오.<\/p>\n","choices":[],"answer":null,"solution":"<p><strong>모범답안<\/strong><\/p>\n<pre><code class=\"language-python\">mask = torch.isfinite(x)\ncorrected = torch.where(mask, x, torch.zeros_like(x)) + offsets\ncorrected = torch.where(mask, corrected, torch.zeros_like(corrected))\ncounts = mask.sum(dim=0)\nmeans = corrected.sum(dim=0) / counts.clamp_min(1)\nmeans = torch.where(counts &gt; 0, means, torch.full_like(means, float(&quot;nan&quot;)))\nprint(counts.tolist())  # [2, 2, 1]\nprint(means.tolist())   # [12.0, 19.0, 30.5]\n<\/code><\/pre>\n<p><code>offsets<\/code>는 <code>x<\/code>의 마지막 차원 크기인 <code>3<\/code>과 일치하므로 Broadcasting됩니다. 유효하지 않은 값은 Mask로 합산에서 제외합니다. 유효값이 없는 채널은 예시처럼 <code>NaN<\/code>을 반환하거나 오류 상태로 처리할 수 있으며, 선택한 방침을 명확히 해야 합니다.<\/p>\n"},{"id":"Q-19","title":"","kind":"written","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a><\/p>\n","stem":"<p>CSV 파일의 <code>temperature<\/code>, <code>pressure<\/code>, <code>failure<\/code> 세 열을 이용해 두 입력 특성과 하나의 이진 분류 Target을 반환하는 Custom Dataset을 설계하십시오. 다음 조건을 충족해야 합니다.<\/p>\n<ul>\n<li>샘플 하나의 <code>x<\/code>는 <code>float32<\/code> 텐서이며 Shape는 <code>(2,)<\/code>입니다.<\/li>\n<li>Target <code>y<\/code>는 <code>float32<\/code> 텐서이며 Shape는 <code>(1,)<\/code>입니다.<\/li>\n<li>배치 크기는 4이며 마지막 배치도 사용합니다.<\/li>\n<li>Dataset에 샘플이 10개 있을 때 배치별 Target Shape를 제시합니다.<\/li>\n<\/ul>\n","choices":[],"answer":null,"solution":"<p><strong>모범답안<\/strong><\/p>\n<pre><code class=\"language-python\">import pandas as pd\nimport torch\nfrom torch.utils.data import Dataset, DataLoader\n\nclass SensorDataset(Dataset):\n    def __init__(self, path):\n        df = pd.read_csv(path)\n        self.x = torch.tensor(\n            df[[&quot;temperature&quot;, &quot;pressure&quot;]].to_numpy(dtype=&quot;float32&quot;)\n        )\n        self.y = torch.tensor(\n            df[[&quot;failure&quot;]].to_numpy(dtype=&quot;float32&quot;)\n        )\n\n    def __len__(self):\n        return len(self.x)\n\n    def __getitem__(self, index):\n        return self.x[index], self.y[index]\n\nloader = DataLoader(SensorDataset(&quot;sensors.csv&quot;), batch_size=4, shuffle=False)\n<\/code><\/pre>\n<p>배치별 Target Shape는 <code>(4, 1)<\/code>, <code>(4, 1)<\/code>, <code>(2, 1)<\/code>입니다. 실제 데이터를 사용할 때는 누락값과 자료형도 검증해야 합니다. Scaling을 적용한다면 평균과 표준편차는 Training 데이터에서만 계산해 데이터 누수를 방지해야 합니다.<\/p>\n"},{"id":"Q-20","title":"","kind":"written","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a><\/p>\n","stem":"<p>입력 특성 3개, 은닉 뉴런 5개, 출력 Logit 2개인 MLP를 구성하십시오. 은닉층에는 ReLU를 사용하고, 모든 <code>nn.Linear<\/code> 계층에는 Bias를 포함합니다. 학습 가능한 파라미터의 총수와 입력 Shape가 <code>(7, 3)<\/code>일 때의 출력 Shape를 계산하십시오.<\/p>\n","choices":[],"answer":null,"solution":"<p><strong>모범답안<\/strong><\/p>\n<pre><code class=\"language-python\">import torch\nfrom torch import nn\n\nmodel = nn.Sequential(nn.Linear(3, 5), nn.ReLU(), nn.Linear(5, 2))\nprint(sum(p.numel() for p in model.parameters()))  # 32\nprint(model(torch.zeros(7, 3)).shape)               # torch.Size([7, 2])\n<\/code><\/pre>\n<p>첫 번째 <code>Linear<\/code> 계층은 <code>3×5+5=20<\/code>개, 두 번째 <code>Linear<\/code> 계층은 <code>5×2+2=12<\/code>개의 파라미터를 가집니다. ReLU에는 학습 가능한 파라미터가 없으므로 총 <code>32<\/code>개입니다.<\/p>\n"},{"id":"Q-21","title":"","kind":"written","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a><\/p>\n","stem":"<p>샘플 6개로 구성된 배치가 있습니다. 이진 분류와 4개 클래스의 다중 분류에 적합한 <strong>모델 출력 Shape, Target의 Shape·Dtype, Loss 함수<\/strong>를 각각 제시하십시오. 해당 Loss 함수에 전달하기 전에 Sigmoid나 Softmax를 적용하면 안 되는 이유도 설명하십시오.<\/p>\n","choices":[],"answer":null,"solution":"<p><strong>모범답안<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>모델 출력<\/th>\n<th>Target<\/th>\n<th>Loss<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Binary<\/td>\n<td><code>(6, 1)<\/code> 실수형 Logit<\/td>\n<td><code>(6, 1)<\/code> <code>float32<\/code>의 0·1<\/td>\n<td><code>nn.BCEWithLogitsLoss()<\/code><\/td>\n<\/tr>\n<tr>\n<td>Multiclass<\/td>\n<td><code>(6, 4)<\/code> 실수형 Logit<\/td>\n<td><code>(6,)<\/code> <code>torch.long<\/code>의 클래스 인덱스 0~3<\/td>\n<td><code>nn.CrossEntropyLoss()<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>두 Loss 함수는 각각 Sigmoid 또는 LogSoftmax에 해당하는 계산을 내부에 포함합니다. 모델 출력에 미리 확률 변환을 적용하면 Loss 함수가 요구하는 Logit 대신 확률을 전달하게 되어 계산 결과와 수치 안정성에 영향을 줍니다. 추론 시 확률이 필요하다면 <code>torch.sigmoid()<\/code>나 <code>torch.softmax()<\/code>를 사용합니다.<\/p>\n"},{"id":"Q-22","title":"","kind":"written","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a><\/p>\n","stem":"<p>샘플별 Loss의 평균을 반환하는 함수를 사용했습니다. 배치 크기가 <code>[4, 4, 2]<\/code>이고 각 배치의 평균 Loss가 <code>[0.2, 0.3, 0.8]<\/code>일 때, 전체 샘플 기준 Epoch 평균 Loss를 계산하고 코드로 구현하십시오.<\/p>\n","choices":[],"answer":null,"solution":"<p><strong>모범답안<\/strong><\/p>\n<div class=\"math-expression math-rendered\" role=\"math\"><mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -1.602ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"39.283ex\" height=\"4.663ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -1353 17363.1 2061\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"msub\"><g data-mml-node=\"mi\"><path data-c=\"1D43F\" d=\"M228 637Q194 637 192 641Q191 643 191 649Q191 673 202 682Q204 683 217 683Q271 680 344 680Q485 680 506 683H518Q524 677 524 674T522 656Q517 641 513 637H475Q406 636 394 628Q387 624 380 600T313 336Q297 271 279 198T252 88L243 52Q243 48 252 48T311 46H328Q36 rm=\"translate(500,0)\"><\/path><\/g><rect width=\"10146.2\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><g data-mml-node=\"mo\" transform=\"translate(14529.3,0)\"><path data-c=\"3D\" d=\"M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z\"><\/path><\/g><g data-mml-node=\"mn\" transform=\"translate(15585.1,0)\"><path data-c=\"30\" d=\"M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z\"><\/path><path data-c=\"2E\" d=\"M78 60Q78 84 95 102T138 120Q162 120 180 104T199 61Q199 36 182 18T139 0T96 17T78 60Z\" transform=\"translate(500,0)\"><\/path><path data-c=\"33\" d=\"M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z\" transform=\"translate(778,0)\"><\/path><path data-c=\"36\" d=\"M42 313Q42 476 123 571T303 666Q372 666 402 630T432 550Q432 525 418 510T379 495Q356 495 341 509T326 548Q326 592 373 601Q351 623 311 626Q240 626 194 566Q147 500 147 364L148 360Q153 366 156 373Q197 433 263 433H267Q313 433 348 414Q372 400 396 374T435 317Q456 268 456 210V192Q456 169 451 149Q440 90 387 34T253 -22Q225 -22 199 -14T143 16T92 75T56 172T42 313ZM257 397Q227 397 205 380T171 335T154 278T148 216Q148 133 160 97T198 39Q222 21 251 21Q302 21 329 59Q342 77 347 104T352 209Q352 289 347 316T329 361Q302 397 257 397Z\" transform=\"translate(1278,0)\"><\/path><\/g><\/g><\/g><\/svg><\/mjx-container><\/div>\n<pre><code class=\"language-python\">batch_sizes = [4, 4, 2]\nbatch_losses = [0.2, 0.3, 0.8]\nweighted_total = sum(n * loss for n, loss in zip(batch_sizes, batch_losses))\nepoch_loss = weighted_total / sum(batch_sizes)\nprint(f&quot;{epoch_loss:.2f}&quot;)  # 0.36\n<\/code><\/pre>\n<p>배치 평균 Loss를 단순 평균하면 <code>(0.2 + 0.3 + 0.8) / 3 ≈ 0.4333<\/code>이 됩니다. 샘플별 Loss에 같은 비중을 주려면 배치 크기를 반영해 가중 평균해야 합니다.<\/p>\n"},{"id":"Q-23","title":"","kind":"written","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a><\/p>\n","stem":"<p>샘플 5개를 크기가 <code>[2, 2, 1]<\/code>인 Micro-Batch로 나누었습니다. 샘플별 Loss의 평균을 구하는 <code>reduction=&quot;mean&quot;<\/code>을 사용할 때, 전체 샘플을 하나의 배치로 처리한 것과 같은 평균 Gradient를 얻으려면 각 Micro-Batch의 Loss에 어떤 계수를 곱해야 합니까? 한 번의 Optimizer Update를 수행하는 코드 흐름도 설명하십시오.<\/p>\n","choices":[],"answer":null,"solution":"<p><strong>모범답안<\/strong><\/p>\n<p>각 Micro-Batch의 평균 Loss에 <code>현재 Micro-Batch의 샘플 수 / 전체 샘플 수<\/code>를 곱합니다. 따라서 계수는 <code>2/5<\/code>, <code>2/5<\/code>, <code>1/5<\/code>입니다.<\/p>\n<pre><code class=\"language-python\">optimizer.zero_grad(set_to_none=True)\nfor x_batch, y_batch in micro_batches:\n    loss = criterion(model(x_batch), y_batch)\n    (loss * (len(x_batch) / 5)).backward()\noptimizer.step()\n<\/code><\/pre>\n<p>이 방식은 전체 샘플의 평균 Loss에서 계산한 Gradient와 일치하도록 보정한 것입니다. 다만 Dropout처럼 난수가 관여하거나 BatchNorm처럼 배치 통계에 의존하는 계층이 있으면 결과가 완전히 같지는 않을 수 있습니다. Gradient Clipping을 적용한다면 모든 Gradient를 누적한 뒤 <code>optimizer.step()<\/code> 직전에 한 번 적용해야 합니다.<\/p>\n"},{"id":"Q-24","title":"","kind":"written","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a><\/p>\n","stem":"<p>AdamW, StepLR, Dropout을 사용하는 MLP를 20 Epoch 동안 학습하던 중 8번째 Epoch 종료 직후 프로그램이 중단되었습니다. 다음 Epoch부터 학습을 재개하려면 어떤 정보를 저장하고 복원해야 합니까? <strong>Best Model 저장<\/strong>과 <strong>Resume Checkpoint 저장<\/strong>의 목적도 비교하십시오.<\/p>\n","choices":[],"answer":null,"solution":"<p><strong>모범답안<\/strong><\/p>\n<p>모델 Weight, AdamW의 Optimizer State, StepLR의 Scheduler State, 완료한 Epoch 번호, 난수 생성기의 상태를 저장해야 합니다. 데이터 순서에 영향을 주는 Generator나 Sampler의 상태도 재현성에 필요할 수 있습니다. Early Stopping을 사용했다면 최적 검증 점수와 Epoch, Patience Counter도 함께 보관합니다.<\/p>\n<p>Epoch가 끝난 시점부터 재개할 때는 다음 Epoch의 데이터 순서가 기존 실행과 같아야 합니다. 배치 중간에서 재개한다면 해당 Epoch의 샘플 순서, 처리한 배치 위치, 필요한 경우 누적 Gradient까지 복원해야 합니다.<\/p>\n<p><strong>Best Model<\/strong>은 검증 성능이 가장 좋았던 Weight를 최종 평가나 추론에 사용하기 위해 저장합니다. <strong>Resume Checkpoint<\/strong>는 학습을 중단된 지점부터 이어가기 위한 파일로, Optimizer와 Scheduler 등의 진행 상태를 포함합니다. 두 파일의 목적은 서로 다릅니다.<\/p>\n"}],"problems":[{"id":"B-01","title":"텐서 구조와 차원별 집계","level":"basic","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a> · Tensor · Shape · Dtype · Reduction<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>센서에서 수집한 측정값이 행렬 형태로 주어집니다. 데이터를 Tensor(텐서)로 변환하여 채널별 합계와 Sample(샘플)별 평균을 계산하십시오. 텐서의 Shape와 자료형도 함께 출력하십시오.<\/p>\n<h4>요구사항<\/h4>\n<ol>\n<li>입력에서 샘플 수 <code>N<\/code>과 채널 수 <code>D<\/code>를 읽고 Shape <code>(N, D)<\/code>의 텐서를 생성한다.<\/li>\n<li>채널별 합계는 <code>dim=0<\/code>, 샘플별 평균은 <code>dim=1<\/code>로 계산한다.<\/li>\n<li>수치는 소수점 둘째 자리까지 표시한다.<\/li>\n<li>행·열 개수나 숫자 형식이 잘못되었거나 유한하지 않은 값이 있으면 <code>INVALID<\/code>만 출력한다.<\/li>\n<\/ol>\n<h4>입력<\/h4>\n<p>첫 줄에는 <code>N D<\/code>가 주어집니다. 이후 <code>N<\/code>개 줄에는 각각 <code>D<\/code>개의 실수가 공백으로 구분되어 주어집니다.<\/p>\n<ul>\n<li><code>1 ≤ N ≤ 200<\/code>, <code>1 ≤ D ≤ 20<\/code><\/li>\n<li><code>3<\/code>처럼 소수점 없이 표기된 값도 실수형으로 처리합니다.<\/li>\n<li><code>NaN<\/code>, 무한대 및 추가 데이터 행은 허용하지 않습니다. 입력값은 <code>float32<\/code>에서 유한하게 표현할 수 있는 범위에 속합니다.<\/li>\n<\/ul>\n<h4>출력<\/h4>\n<pre><code class=\"language-text\">SHAPE N D\nDTYPE float32\nCOLUMN_SUM 값1 값2 ...\nROW_MEAN 값1 값2 ...\n<\/code><\/pre>\n<p><strong>예제 입력<\/strong><\/p>\n<pre><code class=\"language-text\">2 3\n1 2 3\n4 5 6\n<\/code><\/pre>\n<p><strong>예제 출력<\/strong><\/p>\n<pre><code class=\"language-text\">SHAPE 2 3\nDTYPE float32\nCOLUMN_SUM 5.00 7.00 9.00\nROW_MEAN 2.00 5.00\n<\/code><\/pre>\n<h4>검증 기준<\/h4>\n<ul>\n<li><code>N=1<\/code>, <code>D=1<\/code>에서 차원이 사라지지 않는지 확인<\/li>\n<li>누락·초과된 원소와 잘못된 숫자를 구분 없이 <code>INVALID<\/code>로 처리하는지 확인<\/li>\n<li>합계와 평균이 올바른 차원에 대해 계산되는지 확인<\/li>\n<\/ul>\n","steps":[]},{"id":"B-02","title":"센서 측정값 보정","level":"basic","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a> · Broadcasting · Element-wise Operations · Reduction<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>여러 센서 채널에서 수집한 측정값이 행렬로 주어집니다. 채널마다 보정값과 배율이 다르므로 Tensor(텐서)의 Broadcasting을 이용해야 합니다. 아래 식에 따라 측정값을 보정하고 채널별 평균을 출력하십시오.<\/p>\n<div class=\"math-expression math-rendered\" role=\"math\"><mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.666ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"16.539ex\" height=\"2.363ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 7310.2 1044.2\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"msub\"><g data-mml-node=\"mi\"><path data-c=\"1D467\" d=\"M347 338Q337 338 294 349T231 360Q211 360 197 356T174 346T162 335T155 324L153 320Q150 317 138 317Q117 317 117 325Q117 330 120 339Q133 378 163 406T229 440Q241 442 246 442Q271 442 291 425T329 392T367 375Q389 375 411 408T434 441Q435 442 449 442H462Q468 436 468 434Q468 430 463 420T449 399T432 377T418 358L411 349Q368 298 275 214T160 106L148 94L163 93Q185 93 227 82T290 71Q328 71 360 90T402 140Q406 149 409 151T424 153Q443 153 443 143Q443 138 442 134Q425 72 376 31T278 -11Q252 -11 232 6T193 40T155 57Q111 57 76 -3Q70 -11 59 -11H54H 94 -164T75 -204Q25 -204 7 -183T-12 -137Q-12 -110 7 -91T53 -71Q70 -71 82 -81T95 -112Q95 -148 63 -167Q69 -168 77 -168Q111 -168 139 -140T182 -74L193 -32Q204 11 219 72T251 197T278 308T289 365Q289 372 288 376Z\"><\/path><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container><\/span>: 채널 <span class=\"math-inline\" role=\"math\"><mjx-container class=\"MathJax\" jax=\"SVG\"><svg style=\"vertical-align: -0.462ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"0.932ex\" height=\"1.957ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -661 412 865\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mi\"><path data-c=\"1D457\" d=\"M297 596Q297 627 318 644T361 661Q378 661 389 651T403 623Q403 595 384 576T340 557Q322 557 310 567T297 596ZM288 376Q288 405 262 405Q240 405 220 393T185 362T161 325T144 293L137 279Q135 278 121 278H107Q101 284 101 286T105 299Q126 348 164 391T252 441Q253 441 260 441T272 442Q296 441 316 432Q341 418 354 401T367 348V332L318 133Q267 -67 264 -75Q246 -125 194 -164T75 -204Q25 -204 7 -183T-12 -137Q-12 -110 7 -91T53 -71Q70 -71 82 -81T95 -112Q95 -148 63 -167Q69 -168 77 -168Q111 -168 139 -140T182 -74L193 -32Q204 11 219 72T251 197T278 308T289 365Q289 372 288 376Z\"><\/path><\/g><\/g><\/g><\/svg><\/mjx-container><\/span>의 Scale<\/li>\n<\/ul>\n<h4>요구사항<\/h4>\n<ol>\n<li>측정값 행렬의 Shape는 <code>(N, D)<\/code>, Offset과 Scale의 Shape는 <code>(D,)<\/code>로 구성한다.<\/li>\n<li>Broadcasting으로 전체 행렬을 한 번에 보정한다.<\/li>\n<li>보정된 샘플을 원래 순서대로 출력하고, 채널별 보정 평균을 계산한다.<\/li>\n<li>Offset·Scale의 길이가 맞지 않거나 Scale이 0 이하이면 <code>INVALID<\/code>를 출력한다.<\/li>\n<\/ol>\n<h4>입력<\/h4>\n<p>첫 줄에 <code>N D<\/code>, 두 번째 줄에 <code>D<\/code>개의 Offset, 세 번째 줄에 <code>D<\/code>개의 Scale이 주어집니다. 이어서 <code>N<\/code>개 측정값 행이 주어집니다.<\/p>\n<ul>\n<li><code>1 ≤ N ≤ 200<\/code>, <code>1 ≤ D ≤ 20<\/code><\/li>\n<li>모든 입력값은 유한한 실수이며, Scale은 모두 양수입니다.<\/li>\n<\/ul>\n<h4>출력<\/h4>\n<p>각 보정 결과 행은 <code>SAMPLE_i<\/code>로, 채널별 평균 행은 <code>CHANNEL_MEAN<\/code>으로 시작합니다. 모든 수치는 소수점 둘째 자리까지 표시합니다.<\/p>\n<p><strong>예제 입력<\/strong><\/p>\n<pre><code class=\"language-text\">2 2\n1 -2\n2 0.5\n10 20\n12 30\n<\/code><\/pre>\n<p><strong>예제 출력<\/strong><\/p>\n<pre><code class=\"language-text\">SAMPLE_1 22.00 9.00\nSAMPLE_2 26.00 14.00\nCHANNEL_MEAN 24.00 11.50\n<\/code><\/pre>\n<h4>검증 기준<\/h4>\n<ul>\n<li>Offset과 Scale을 샘플 축이 아닌 채널 축에 적용했는지 확인<\/li>\n<li>단일 샘플 또는 단일 채널에서도 Broadcasting이 올바르게 동작하는지 확인<\/li>\n<li>Shape 불일치, 0 이하의 Scale, 무한대 입력을 올바르게 처리하는지 확인<\/li>\n<\/ul>\n","steps":[]},{"id":"B-03","title":"Autograd를 이용한 Gradient 계산","level":"basic","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a> · Autograd · Gradient · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a> · Loss<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>선형 Model(모델) <code>wx+b<\/code>로 입력 <code>x<\/code>의 예측값을 구하고, 정답 <code>y<\/code>와의 오차를 계산합니다. Autograd로 Gradient를 계산해 Parameter(파라미터)를 한 번 갱신하십시오. 갱신 전의 예측값·Loss·Gradient와 갱신한 파라미터·예측값을 지정된 형식으로 출력하십시오. 여러 Epoch에 걸친 학습은 수행하지 않습니다.<\/p>\n<div class=\"math-expression math-rendered\" role=\"math\"><mjx-container class=\"MathJax\" jax=\"SVG\" display=\"true\"><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"26.333ex\" height=\"2.565ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -883.9 11639.2 1133.9\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\"><g data-mml-node=\"mover\"><g data-mml-node=\"mi\"><path data-c=\"1D466\" d=\"M21 287Q21 301 36 335T84 406T158 442Q199 442 224 419T250 355Q248 336 247 334Q247 331 231 288T198 191T182 105Q182 62 196 45T238 27Q261 27 281 38T312 61T339 94Q339 95 344 114T358 173T377 247Q415 397 419 404Q432 431 462 431Q475 431 483 424T494 412T496 403Q496 390 447 193T391 -23Q363 -106 2 code>이고 모든 값은 유한한 실수입니다. 계산은 <code>float64<\/code>로 수행합니다.<\/p>\n<h4>출력<\/h4>\n<p>수치는 소수점 넷째 자리까지 표시합니다. 유효하지 않은 입력은 <code>INVALID<\/code>를 출력합니다.<\/p>\n<p><strong>예제 입력<\/strong><\/p>\n<pre><code class=\"language-text\">1 0 2 5 0.1\n<\/code><\/pre>\n<p><strong>예제 출력<\/strong><\/p>\n<pre><code class=\"language-text\">PREDICTION 2.0000\nLOSS 9.0000\nGRAD_W -12.0000\nGRAD_B -6.0000\nUPDATED_W 2.2000\nUPDATED_B 0.6000\nUPDATED_PREDICTION 5.0000\n<\/code><\/pre>\n<h4>검증 기준<\/h4>\n<ul>\n<li><code>x=0<\/code>일 때 Weight Gradient가 0이 되는지 확인<\/li>\n<li>예측이 정확하여 Loss가 0인 경우 Gradient도 0인지 확인<\/li>\n<li><code>backward()<\/code>를 중복 호출해 Gradient를 누적하지 않는지 확인<\/li>\n<\/ul>\n","steps":[]},{"id":"B-04","title":"신경망 구조와 파라미터 수","level":"basic","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a> · <code>nn.Linear<\/code> · ReLU · Parameter Count · Forward<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>입력 Feature(특성) 수, 은닉 뉴런 수, 출력 뉴런 수가 주어집니다. 이를 이용해 <code>Linear → ReLU → Linear<\/code> 구조의 MLP를 구성하십시오. 학습은 수행하지 않으며, Forward 결과의 Shape와 학습 가능한 Parameter(파라미터) 수를 출력하십시오.<\/p>\n<h4>요구사항<\/h4>\n<ol>\n<li><code>nn.Sequential(nn.Linear(D, H), nn.ReLU(), nn.Linear(H, O))<\/code>를 구성한다. 두 Linear Layer 모두 Bias를 사용한다.<\/li>\n<li>첫 Layer와 두 번째 Layer의 파라미터 수를 구한다.<\/li>\n<li>Batch Size가 <code>N<\/code>인 영(0) Tensor(텐서)를 입력하여 Forward 결과의 Shape를 확인한다.<\/li>\n<li>입력 범위가 잘못되면 <code>INVALID<\/code>를 출력한다.<\/li>\n<\/ol>\n<h4>입력<\/h4>\n<p>한 줄에 <code>N D H O<\/code>가 주어집니다. 모든 값은 정수이며 각각 <code>1 ≤ N ≤ 256<\/code>, <code>1 ≤ D,H,O ≤ 128<\/code>입니다.<\/p>\n<h4>출력<\/h4>\n<pre><code class=\"language-text\">LAYER_1_PARAMETERS 값\nLAYER_2_PARAMETERS 값\nTOTAL_PARAMETERS 값\nOUTPUT_SHAPE N O\n<\/code><\/pre>\n<p><strong>예제 입력<\/strong><\/p>\n<pre><code class=\"language-text\">5 3 4 2\n<\/code><\/pre>\n<p><strong>예제 출력<\/strong><\/p>\n<pre><code class=\"language-text\">LAYER_1_PARAMETERS 16\nLAYER_2_PARAMETERS 10\nTOTAL_PARAMETERS 26\nOUTPUT_SHAPE 5 2\n<\/code><\/pre>\n<h4>검증 기준<\/h4>\n<ul>\n<li>Bias를 빠뜨리지 않고 계산하는지 확인<\/li>\n<li><code>nn.Linear<\/code>의 Weight Shape가 <code>(out_features, in_features)<\/code>임을 반영했는지 확인<\/li>\n<li>출력 Shape를 실제 Forward 실행으로 검사하는지 확인<\/li>\n<\/ul>\n","steps":[]},{"id":"B-05","title":"DataLoader의 배치 구성","level":"basic","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a> · TensorDataset · DataLoader · Batch Size · <code>drop_last<\/code><\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>Sample(샘플) ID 목록과 배치 크기가 주어집니다. <code>DataLoader<\/code>를 이용해 ID를 입력 순서대로 배치에 나누어 담고, 각 배치의 구성과 제외된 샘플 수를 출력하십시오.<\/p>\n<h4>요구사항<\/h4>\n<ol>\n<li>입력된 ID를 <code>torch.long<\/code> Tensor(텐서)로 만든 뒤 <code>TensorDataset<\/code>과 <code>DataLoader<\/code>를 사용한다.<\/li>\n<li><code>shuffle=False<\/code>, 지정된 <code>batch_size=B<\/code>, 지정된 <code>drop_last<\/code> 옵션을 적용한다.<\/li>\n<li>생성된 Batch 개수, 각 Batch의 ID 목록, 사용하지 않은 샘플 수를 출력한다.<\/li>\n<li>입력에 오류가 있으면 <code>INVALID<\/code>를 출력한다.<\/li>\n<\/ol>\n<h4>입력<\/h4>\n<p>첫 줄에 <code>N B drop_last<\/code>가 주어지고, 다음 줄에는 서로 다른 정수형 ID <code>N<\/code>개가 주어집니다.<\/p>\n<ul>\n<li><code>1 ≤ N ≤ 200<\/code>, <code>1 ≤ B ≤ 200<\/code><\/li>\n<li><code>drop_last<\/code>는 <code>0<\/code> 또는 <code>1<\/code>입니다.<\/li>\n<\/ul>\n<h4>출력<\/h4>\n<p><code>drop_last=1<\/code>이면 크기가 <code>B<\/code>보다 작은 마지막 Batch를 제외합니다.<\/p>\n<p><strong>예제 입력<\/strong><\/p>\n<pre><code class=\"language-text\">7 3 0\n10 20 30 40 50 60 70\n<\/code><\/pre>\n<p><strong>예제 출력<\/strong><\/p>\n<pre><code class=\"language-text\">BATCHES 3\nBATCH_1 10 20 30\nBATCH_2 40 50 60\nBATCH_3 70\nDROPPED 0\n<\/code><\/pre>\n<h4>검증 기준<\/h4>\n<ul>\n<li><code>N<\/code>이 <code>B<\/code>로 나누어떨어지지 않는 경우<\/li>\n<li><code>B &gt; N<\/code>이면서 <code>drop_last=1<\/code>인 경우 (<code>BATCHES 0<\/code>)<\/li>\n<li>중복 ID, 잘못된 Flag, 부족하거나 초과된 입력값<\/li>\n<\/ul>\n","steps":[]},{"id":"A-01","title":"센서 데이터 품질 검사와 보정","level":"advanced","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a> · Tensor · Broadcasting · Mask · Data Validation<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>시설 운영 시스템은 공간별 온도·습도·전력 사용량을 수집합니다. 측정 항목마다 보정 계수가 다르고, 일부 기록에는 누락값이나 허용 범위를 벗어난 값이 포함되어 있습니다. 이러한 기록까지 집계하면 평균이 왜곡될 수 있으므로 데이터를 먼저 검증해야 합니다.<\/p>\n<p>두 CSV 파일을 읽어 유효한 측정값을 Tensor(텐서)로 구성하고, 특성별 보정과 집계를 수행한 뒤 결과를 파일로 저장하는 프로그램을 작성하십시오.<\/p>\n<h4>요구사항<\/h4>\n<ol>\n<li><code>sensor_readings.csv<\/code>의 필수 열과 각 행의 값을 검사한다. <code>record_id<\/code>는 공백이 포함되지 않은 고유 문자열이어야 하며, <code>room_id<\/code>는 비어 있으면 안 된다. 필수 열이 누락된 파일은 입력 오류로 처리한다.<\/li>\n<li>측정값의 허용 범위는 <code>-40 ≤ temperature ≤ 100<\/code>, <code>0 ≤ humidity ≤ 100<\/code>, <code>power_kw ≥ 0<\/code>이다. 모든 측정값은 유한한 실수여야 하며 <code>NaN<\/code>, <code>Infinity<\/code>는 허용하지 않는다.<\/li>\n<li>행별 오류 우선순위는 <strong>필수값 누락 → ID 형식 오류 → 잘못된 숫자 또는 범위 → 유효한 ID 중복<\/strong> 순서로 정한다. 무효 행의 <code>record_id<\/code>는 중복 검사 대상에 등록하지 않는다.<\/li>\n<li><code>calibration.csv<\/code>에서 세 Feature(특성)의 Offset과 Scale을 읽는다. <code>temperature<\/code>, <code>humidity<\/code>, <code>power_kw<\/code>가 각각 정확히 한 번씩 있어야 하며, Offset과 Scale은 유한한 실수이고 Scale은 양수여야 한다. 보정식은 <code>z=(x+offset)*scale<\/code>이다. 보정 파일의 조건을 만족하지 않으면 보정을 진행하지 않고 실패 상태로 종료한다.<\/li>\n<li>정상 측정값을 Shape <code>(N, 3)<\/code>의 <code>float32<\/code> 텐서로 변환하고 Broadcasting으로 보정한다. <code>N<\/code>은 정상 행의 수이며, 특성 순서는 <code>temperature<\/code>, <code>humidity<\/code>, <code>power_kw<\/code>로 고정한다.<\/li>\n<li><code>calibrated.csv<\/code>, <code>rejected_rows.csv<\/code>, <code>quality_report.json<\/code>을 생성한다. 정상 Sample(샘플)이 5개 미만이면 <code>calibrated.csv<\/code>를 생성하지 않고, 부족한 샘플 수를 <code>quality_report.json<\/code>에 기록한 뒤 실패 상태로 종료한다. 이때도 <code>rejected_rows.csv<\/code>와 <code>quality_report.json<\/code>은 생성한다.<\/li>\n<\/ol>\n<h4>입력 파일 규격<\/h4>\n<p><strong><code>sensor_readings.csv<\/code><\/strong><\/p>\n<pre><code class=\"language-csv\">record_id,room_id,temperature,humidity,power_kw\nR01,LAB-A,20,50,3\nR02,LAB-A,22,55,4\nR03,LAB-B,,80,2\n<\/code><\/pre>\n<p><strong><code>calibration.csv<\/code><\/strong><\/p>\n<pre><code class=\"language-csv\">feature,offset,scale\ntemperature,1,1\nhumidity,-5,1\npower_kw,0,2\n<\/code><\/pre>\n<p><em>위 두 파일은 데이터 형식 예시입니다. 실제 프로젝트 데이터에는 정상 기록이 5개 이상 포함됩니다.<\/em><\/p>\n<h4>출력 파일 규격<\/h4>\n<ul>\n<li><code>calibrated.csv<\/code>: <code>record_id,room_id,temperature,humidity,power_kw<\/code> 순서로 기록합니다. 정상 행은 원본 순서를 유지하고, 보정값은 소수점 이하 넷째 자리까지 기록합니다. 정상 샘플이 5개 미만이면 파일을 생성하지 않습니다.<\/li>\n<li><code>rejected_rows.csv<\/code>: <code>source_line,record_id,error_code<\/code> 순서로 기록합니다. <code>source_line<\/code>에는 헤더를 1행으로 계산한 원본 CSV의 행 번호를 기록합니다. 오류 코드는 <code>MISSING_VALUE<\/code>(필수값 누락), <code>INVALID_ID<\/code>(ID 형식 오류), <code>INVALID_NUMBER<\/code>(숫자 변환 실패·비유한 값·범위 위반), <code>DUPLICATE_ID<\/code>(유효한 ID 중복) 중 하나입니다.<\/li>\n<li><code>quality_report.json<\/code>: <code>status<\/code>, <code>valid_count<\/code>, <code>rejected_count<\/code>, <code>shape<\/code>, <code>channel_mean<\/code>, <code>missing_count<\/code>의 여섯 항목을 기록합니다. 정상 샘플이 5개 이상이면 <code>status<\/code>는 <code>OK<\/code>, 5개 미만이면 <code>INSUFFICIENT_DATA<\/code>로 기록합니다. <code>shape<\/code>는 <code>[N, 3]<\/code>이며, <code>channel_mean<\/code>에는 <code>temperature<\/code>, <code>humidity<\/code>, <code>power_kw<\/code> 순서로 보정값의 평균을 기록합니다. 정상 샘플이 없으면 <code>channel_mean<\/code>은 <code>null<\/code>입니다. <code>missing_count<\/code>는 <code>max(0, 5 - N)<\/code>으로 계산합니다.<\/li>\n<\/ul>\n<p><strong>예제 처리 결과<\/strong><\/p>\n<p><code>R01<\/code>의 보정값은 <code>[21,45,6]<\/code>, <code>R02<\/code>는 <code>[23,50,8]<\/code>입니다. <code>R03<\/code>은 온도값이 누락되어 거부됩니다. 정상 샘플이 2개뿐이므로 <code>calibrated.csv<\/code>는 생성하지 않습니다.<\/p>\n<p><code>rejected_rows.csv<\/code>에는 다음 행이 기록됩니다.<\/p>\n<pre><code class=\"language-csv\">source_line,record_id,error_code\n4,R03,MISSING_VALUE\n<\/code><\/pre>\n<p><code>quality_report.json<\/code>에는 샘플 부족 상태와 집계 결과가 기록됩니다.<\/p>\n<pre><code class=\"language-json\">{\n  &quot;status&quot;: &quot;INSUFFICIENT_DATA&quot;,\n  &quot;valid_count&quot;: 2,\n  &quot;rejected_count&quot;: 1,\n  &quot;shape&quot;: [2, 3],\n  &quot;channel_mean&quot;: [22.0, 47.5, 7.0],\n  &quot;missing_count&quot;: 3\n}\n<\/code><\/pre>\n<h4>검증 기준<\/h4>\n<ul>\n<li>무효 행의 <code>record_id<\/code>가 이후 정상 행의 중복 검사에 영향을 주지 않는지 확인<\/li>\n<li>필수 열 누락과 <code>record_id<\/code> 형식 오류, <code>NaN<\/code>, <code>Infinity<\/code>, 측정 범위 위반을 올바르게 처리하는지 확인<\/li>\n<li>Calibration 특성의 중복·누락 및 잘못된 Offset·Scale을 거부하는지 확인<\/li>\n<li>특성 순서와 텐서의 Shape <code>(N, 3)<\/code>을 정확하게 유지하는지 확인<\/li>\n<li>유효한 측정값에만 보정을 적용하고, 보정된 데이터로 통계를 계산하는지 확인<\/li>\n<li>정상 샘플이 5개 미만일 때 출력 파일 생성 조건과 실패 상태를 올바르게 처리하는지 확인<\/li>\n<\/ul>\n","steps":[{"title":"STEP 1. 입력 형식 확인","html":"<p>두 CSV 파일의 필수 열과 자료형을 확인합니다. 숫자로 변환하기 전에 원본 문자열을 보존하면 오류 행을 기록하기 쉽습니다. 보정 파일의 특성 목록과 계수도 함께 검사합니다.<\/p>\n<pre><code class=\"language-python\"># TODO: 각 파일의 필수 열 검사\n# TODO: 행별 누락값·ID·숫자·범위 검증\n# TODO: 보정 파일의 특성 및 계수 검사\n<\/code><\/pre>\n"},{"title":"STEP 2. 정상·오류 기록 분리","html":"<p>검사를 통과한 행과 거부된 행을 분리합니다. 거부된 행의 ID 때문에 이후 정상 기록이 중복으로 처리되지 않도록 검사 순서를 설계합니다.<\/p>\n<pre><code class=\"language-python\"># TODO: 유효한 record_id만 중복 검사에 등록\n# TODO: source_line과 error_code 기록\n<\/code><\/pre>\n"},{"title":"STEP 3. 텐서 변환과 보정","html":"<p>특성 순서를 고정한 후 측정값과 특성별 보정 계수를 텐서로 구성합니다. Broadcasting을 이용한 보정과 채널별 평균 계산을 직접 구현합니다.<\/p>\n<pre><code class=\"language-python\">features = [&quot;temperature&quot;, &quot;humidity&quot;, &quot;power_kw&quot;]\nvalues = torch.tensor(valid_df[features].to_numpy(dtype=&quot;float32&quot;))\n\n# TODO: 보정 파일을 Feature 순서에 맞춰 정렬\n# TODO: Offset·Scale Tensor 구성 및 Broadcasting\n# TODO: 채널별 평균 계산\n<\/code><\/pre>\n"},{"title":"STEP 4. 출력 및 일관성 확인","html":"<p>정상 행의 원본 순서, 결과 CSV의 행 수, 거부된 행의 수, 보고서의 집계값을 확인합니다. 정상 샘플이 5개 미만이면 부족한 수를 기록하고 지정된 출력 파일만 생성한 뒤 실패 상태로 종료합니다.<\/p>\n"}]},{"id":"A-02","title":"혼잡 예측 모델의 학습과 평가","level":"advanced","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a> · Dataset · DataLoader · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a> · MLP · <code>BCEWithLogitsLoss<\/code> · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a> · Training Loop<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>시설의 혼잡 여부를 두 가지 이용 지표로 예측하려고 합니다. 데이터에는 직선 하나로 구분하기 어려운 패턴이 포함되어 있습니다. 학습·검증·테스트 데이터를 구분한 뒤, 학습한 모델을 간단한 Baseline과 비교해야 합니다.<\/p>\n<p>PyTorch로 간단한 MLP를 학습한 뒤, 지정된 테스트 데이터에 대한 예측 결과를 기록하는 프로그램을 작성하십시오.<\/p>\n<h4>요구사항<\/h4>\n<ol>\n<li><code>usage.csv<\/code>의 <code>split<\/code> 값(<code>train<\/code>, <code>validation<\/code>, <code>test<\/code>)을 그대로 사용한다. 행을 다시 임의로 분할하지 않는다.<\/li>\n<li>Model(모델) 입력 Feature(특성)는 <code>x1<\/code>, <code>x2<\/code> 두 개이며, Target <code>crowded<\/code>는 <code>0<\/code> 또는 <code>1<\/code>이다. 각 분할에는 두 클래스가 모두 존재한다고 가정한다.<\/li>\n<li>Training(학습) 데이터만 사용해 특성별 평균과 표준편차를 계산하고, 세 분할에 같은 기준을 적용한다. 표준편차는 모집단 기준(<code>ddof=0<\/code>)으로 계산한다. 표준편차가 0인 특성은 Scale을 1로 처리한다.<\/li>\n<li><code>nn.Linear(2,12) → nn.ReLU() → nn.Linear(12,1)<\/code> 구조를 구현한다.<\/li>\n<li><code>BCEWithLogitsLoss<\/code>, <code>AdamW(lr=0.01)<\/code>, Batch Size 16, 최대 100 Epoch, <code>torch.manual_seed(42)<\/code>를 사용한다. Epoch마다 DataLoader를 사용하고 마지막 Batch를 버리지 않는다.<\/li>\n<li>매 Epoch의 학습 평균 Loss와 검증 Accuracy를 기록한다. <strong>최종 선택 기준은 검증 Accuracy 최대, 동점이면 더 이른 Epoch<\/strong>로 정한다.<\/li>\n<li>학습 데이터에서 가장 빈번한 클래스를 항상 예측하는 Majority Baseline도 계산한다. 빈도가 같다면 <code>0<\/code>을 선택한다.<\/li>\n<li>테스트 결과에 대한 Accuracy·F1·Confusion Matrix를 계산하고, <code>test_predictions.csv<\/code>를 생성한다. 예측 Label은 <code>torch.sigmoid(logit) ≥ 0.5<\/code>로 결정한다. 테스트 결과를 보고 모델을 다시 선택하지 않는다.<\/li>\n<\/ol>\n<h4>입력 파일 규격<\/h4>\n<p><strong><code>usage.csv<\/code><\/strong><\/p>\n<pre><code class=\"language-csv\">record_id,split,x1,x2,crowded\nU001,train,-1.2,0.8,1\nU002,train,0.4,0.5,0\nU003,validation,1.1,-0.9,1\nU004,test,-0.2,-0.3,0\n<\/code><\/pre>\n<p>실습 파일에는 학습·검증·테스트 분할마다 30개 이상의 샘플이 포함되어 있습니다. 각 데이터 행에는 서로 다른 <code>record_id<\/code>가 부여됩니다. <code>x1<\/code>, <code>x2<\/code>는 실수형으로 처리하며, 결측값이나 <code>NaN<\/code>, <code>Infinity<\/code>는 포함되지 않습니다.<\/p>\n<h4>출력 파일 규격<\/h4>\n<ul>\n<li><code>training_history.csv<\/code>: <code>epoch,train_loss,validation_accuracy<\/code><\/li>\n<li><code>model_selection.json<\/code>: <code>best_epoch,best_validation_accuracy,train_majority_class,test_baseline_accuracy<\/code><\/li>\n<li><code>test_predictions.csv<\/code>: <code>record_id,actual,probability,predicted<\/code> (테스트 데이터의 원본 순서 유지, 확률은 소수점 넷째 자리까지 기록)<\/li>\n<li><code>test_metrics.json<\/code>: <code>accuracy,f1,tp,fp,fn,tn<\/code> (반올림 전 확률로 예측 Label을 결정한 뒤 지표를 계산하며, F1의 분모가 0이면 0으로 기록)<\/li>\n<\/ul>\n<h4>검증 기준<\/h4>\n<ul>\n<li>Train만으로 계산한 Scaling 기준을 검증·테스트에 적용하는지 확인<\/li>\n<li>Loss에 Sigmoid가 중복 적용되지 않는지 확인<\/li>\n<li>마지막 Batch의 크기에 맞춰 학습 Loss를 집계하는지 확인<\/li>\n<li>모델 선택은 검증으로 수행하고 테스트는 한 번만 평가하는지 확인<\/li>\n<\/ul>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHoAAAJPCAYAAAADqLNRAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAXEgAAFxIBZ5/SUgABAABJREFUeJzs3Xlc0/UfB/DXBhvjvu9TEERRLu88UPM2xdTULBWvrLQ0TSuzMtPuLEvrZ1lqmleaZ963oXghIKioyH3JfY+x7fv7YzI2N2CDwTZ4Px+PPeR7fb6fje9w3/c+n/ebxTAMA0IIIYQQQgghhBCi99ja7gAhhBBCCCGEEEII0QwK9BBCCCGEEEIIIYS0ERToIYQQQgghhBBCCGkjKNBDCCGEEEIIIYQQ0kZQoIcQQgghhBBCCCGkjaBADyGEEEIIIYQQQkgbQYEeQgghhBBCCCGEkDaCAj2EEEIIIYQQQgghbQQFegghhBBCCCGEEELaCAr0EEIIIYQQQgghhLQRFOghhBBCCCGEEEIIaSMo0EMIIYQQQgghhBDSRlCghxBCCCGEEEIIIaSNoEAPIYQQQgghhBBCSBtBgR5CtMTLywssFkvuceHChVY597PnZbFYSElJaZVzt2Xa/J0SQgghhBBCCECBHq3YunWr0httFouFjh07QiwWN3i8WCyGj49PvW0ou7Gs75xNublXdjP77IPD4cDOzg4hISGYM2cOjh07BpFIpPa51Dmnqo9BgwY1uR9Evym7HlatWtXgMatWrVJ6HCGEEEIIIYToIgr06JikpCT8+++/De5z9OhRPH78uJV61DRCoRAFBQWIiYnBH3/8gTFjxiA0NBTR0dHa7hohbQaNzCKEEEIIIYQ8y1DbHSCKfvzxR4wdO7be7evXr2/F3mhOXFwcBg0ahLNnz6Jnz57a7o7WzZw5EwUFBXLrXF1dW+XcCx TEP 3. 검증과 가중치 보관","html":"<p>매 Epoch마다 검증 Accuracy를 계산하고, 정해진 동점 처리 기준에 따라 가장 좋은 Weight를 선택합니다. 선택한 Weight는 이후 학습 과정에서 변경되지 않도록 별도의 사본으로 보관합니다.<\/p>\n<pre><code class=\"language-python\"># TODO: 검증 Accuracy 계산\n# TODO: Best Epoch와 Weight 보존\n<\/code><\/pre>\n"},{"title":"STEP 4. 독립 평가","html":"<p>보관한 Weight를 복원한 뒤 테스트 데이터에서 최종 성능을 평가합니다. 테스트 결과를 기준으로 모델을 다시 선택하거나 전처리 기준을 변경하지 않습니다.<\/p>\n"}]},{"id":"A-03","title":"학습 설정 비교 실험","level":"advanced","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a> · SGD · AdamW · Learning Rate · Fair Comparison · Reproducibility<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>데이터센터의 전력 사용량을 예측하기 위해 MLP를 학습합니다. 서로 다른 Optimizer 설정에 따른 성능 차이를 비교하되, 초기 Weight나 데이터 순서가 달라지지 않도록 조건을 통제해야 합니다.<\/p>\n<p><strong>초기 Parameter(파라미터), 데이터 분할, Epoch 수, Batch 순서<\/strong>를 동일하게 유지하며 두 학습 설정을 비교하는 실험 프로그램을 작성하십시오.<\/p>\n<h4>요구사항<\/h4>\n<ol>\n<li><code>energy.csv<\/code>에 명시된 <code>train<\/code>, <code>validation<\/code>, <code>test<\/code> 분할을 유지한다. Training(학습) 데이터에서만 Feature(특성) Scaling 기준을 계산한다. 표준편차는 모집단 기준(<code>ddof=0<\/code>)을 사용하고, 0이면 1로 대체한다.<\/li>\n<li>입력 특성은 <code>occupancy<\/code>, <code>temperature_c<\/code>, <code>weekend<\/code>이고 Target은 <code>energy_kwh<\/code>이다. 회귀 MLP는 <code>Linear(3,16) → ReLU → Linear(16,1)<\/code>이다.<\/li>\n<li>같은 Seed 42로 생성한 초기 <code>state_dict<\/code>를 두 후보에 각각 복사한다. Epoch별 Shuffle 순서도 두 후보에 동일하게 적용한다.<\/li>\n<li>후보 A는 <code>SGD(lr=0.02, momentum=0.9)<\/code>, 후보 B는 <code>AdamW(lr=0.01, weight_decay=0.01)<\/code>이다. 이 비교는 <strong>Optimizer와 학습률을 포함한 두 설정의 비교<\/strong> 이지, Optimizer 종류만 바꾸는 통제 실험은 아니다.<\/li>\n<li>Batch Size 16, 최대 30 Epoch, MSELoss로 학습한다. Epoch 평균 Loss는 Sample(샘플) 수를 반영한다.<\/li>\n<li>매 Epoch의 Validation(검증) RMSE를 기록하고, 각 후보의 최저 검증 RMSE에 해당하는 Weight를 별도로 보관한다.<\/li>\n<li>후보별 최저 검증 RMSE를 비교하여 가장 낮은 값을 기록한 설정을 선택한다. 동점이면 후보 A를 선택한다. 선정된 설정의 Best Weight로 테스트 데이터를 한 번만 평가한다.<\/li>\n<\/ol>\n<h4>입력 파일 규격<\/h4>\n<p><strong><code>energy.csv<\/code><\/strong><\/p>\n<pre><code class=\"language-csv\">record_id,split,occupancy,temperature_c,weekend,energy_kwh\nE001,train,35,20,0,96\nE002,train,61,23,0,129\nE003,validation,47,22,1,114\nE004,test,53,19,0,120\n<\/code><\/pre>\n<ul>\n<li>각 데이터 행에는 서로 다른 <code>record_id<\/code>가 부여됩니다.<\/li>\n<li><code>weekend<\/code>는 <code>0<\/code> 또는 <code>1<\/code>이며, <code>occupancy<\/code>와 <code>energy_kwh<\/code>는 <code>0<\/code> 이상의 유한한 실수입니다.<\/li>\n<li>학습·검증·테스트 데이터에는 각각 30개 이상의 샘플이 포함됩니다.<\/li>\n<\/ul>\n<h4>출력 파일 규격<\/h4>\n<ul>\n<li><code>training_history.csv<\/code>: <code>candidate,epoch,train_loss,validation_rmse<\/code><\/li>\n<li><code>comparison.json<\/code>: 각 후보의 <code>optimizer<\/code>, <code>learning_rate<\/code>, <code>best_epoch<\/code>, <code>best_validation_rmse<\/code> 및 최종 선정된 후보를 나타내는 <code>selected_candidate<\/code><\/li>\n<li><code>test_predictions.csv<\/code>: <code>record_id,actual,predicted<\/code><\/li>\n<li><code>test_metrics.json<\/code>: 선정된 모델의 <code>mae,rmse<\/code><\/li>\n<\/ul>\n<p>모델 선택은 검증 RMSE를 기준으로 수행하며, 테스트 데이터는 최종 성능 평가에만 사용합니다. 또한 모델 비교 결과를 해석할 때는 Optimizer 종류뿐 아니라 학습률 등 다른 설정도 함께 고려해야 합니다.<\/p>\n<p><strong>실제 실행 결과 예시 — 후보별 Validation RMSE 비교<\/strong><\/p>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHoAAAJPCAYAAAADqLNRAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAXEgAAFxIBZ5/SUgAAwhJJREFUeJzs3Xd4FNXbxvHvJiEFUoAQQgm9BKT33nvvKEUpoiKKFQULiiIqKCKC+kNB4BVEpVfpRao06b33ngKBkDbvH2sSwm4gZcNukvtzXXNBzpw588zmZJM8OcVkGIaBiIiIiIiIiIike072DkBERERERERERGxDiR4RERERERERkQxCiR4RERERERERkQxCiR4RERERERERkQxCiR4RERERERERkQxCiR4RERERERERkQxCiR4RERERERERkQxCiR4RERERERERkQxCiR4RERERERERkQxCiR4RERERERERkQxCiR4RERERERERkQxCiR4RERERERERkQxCiR4RERERERERkQxCiR4RERERERERkQxCiR6xq8KFC2MymRIc69evt3dYcUaMGGERX9++fe0dljiIHTt28Pzzz1OqVCk8PT0T7cvqR47F0d93RGxl2rRpFn29YcOG9g5LRERE0piLvQOQxzt16hTz589nw4YNHD58mJs3b3Lnzh18fHzw9fWlfPny1K9fny5dupA3b157hyuZmGEYrFmzhjVr1rBlyxbOnTvH 산했는지 확인<\/li>\n<li>Best Epoch가 마지막 Epoch가 아닐 때도 해당 Weight로 테스트를 수행하는지 확인<\/li>\n<\/ul>\n","steps":[{"title":"STEP 1. 실험 공통 조건 준비","html":"<p>두 후보가 동일한 초기 Weight와 전처리 기준을 사용하도록 준비합니다. 초기 모델의 <code>state_dict<\/code>는 학습 과정에서 변경되지 않도록 별도의 복사본으로 보관합니다.<\/p>\n<pre><code class=\"language-python\">torch.manual_seed(42)\ninitial_model = make_model()\n# TODO: 초기 state_dict를 독립적인 복사본으로 보관\n<\/code><\/pre>\n"},{"title":"STEP 2. 후보별 학습","html":"<p>각 후보에 사용할 모델과 Optimizer를 별도로 생성합니다. Epoch마다 두 후보가 동일한 순서로 샘플을 학습하도록 Shuffle 조건을 맞춥니다.<\/p>\n<pre><code class=\"language-python\"># TODO: 후보별 초기 상태 복원\n# TODO: 동일한 배치 순서로 학습\n<\/code><\/pre>\n"},{"title":"STEP 3. 검증 결과 비교","html":"<p>Epoch마다 검증 RMSE를 계산하고, 각 후보에서 가장 낮은 RMSE를 기록한 시점의 Weight를 보관합니다. 결과를 비교할 때는 Optimizer 종류뿐 아니라 학습률 등의 설정 차이도 고려합니다.<\/p>\n"},{"title":"STEP 4. 최종 모델 평가","html":"<p>검증 RMSE를 기준으로 선정한 후보의 최적 Weight를 복원하고, 테스트 데이터에서 최종 성능을 평가합니다. 결과 파일에 평가 지표가 올바르게 기록되었는지, 예측 결과가 원본 데이터 순서대로 저장되었는지 확인합니다.<\/p>\n"}]},{"id":"A-04","title":"모델 인계와 추론 결과 검증","level":"advanced","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a> · Dtype · Device · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a> · <code>state_dict<\/code> · Inference · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a> · Reproducibility<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>실험 환경에서 학습한 모델을 다른 담당자가 추론에 사용하려고 합니다. Weight 파일만 전달해서는 학습 당시의 Feature(특성) 순서나 Scaling 기준을 정확히 재현하기 어려우며, 예측 결과도 달라질 수 있습니다.<\/p>\n<p>학습과 추론을 <strong>서로 다른 프로세스로 실행<\/strong> 하고, 저장·복원 후에도 같은 입력에 대해 일관된 예측을 얻도록 프로그램을 작성하십시오.<\/p>\n<h4>요구사항<\/h4>\n<ol>\n<li><code>training.csv<\/code>의 <code>split<\/code>을 유지한다. 특성은 <code>temperature_c<\/code>, <code>vibration<\/code>, <code>hours_active<\/code> 세 개이고 Binary Target은 <code>needs_service<\/code>이다.<\/li>\n<li>학습 데이터에서만 평균·표준편차를 구한다. 표준편차는 모집단 기준(<code>ddof=0<\/code>)으로 계산하고, 0이면 1로 대체한다.<\/li>\n<li><code>Linear(3,8) → ReLU → Linear(8,1)<\/code> 모델을 만들고 <code>BCEWithLogitsLoss<\/code>, <code>AdamW(lr=0.01)<\/code>로 최대 50 Epoch 학습한다. Best Validation(검증) Loss를 기준으로 Weight를 선택한다.<\/li>\n<li>모델의 <code>state_dict<\/code>를 <code>model_weights.pt<\/code>에 저장하고 특성 순서·Scaling 기준·Target·예측 Threshold 0.5를 <code>preprocessing.json<\/code>에 기록한다.<\/li>\n<li>별도 <code>predict<\/code> 실행에서는 학습 CSV를 읽지 않고 저장 파일과 <code>incoming.csv<\/code>만 사용한다. CSV 열의 순서가 달라져도 <strong>이름을 기준으로<\/strong> 동일한 특성 순서를 복원한다.<\/li>\n<li>신규 데이터에서 특성값이 누락되거나 숫자가 유효하지 않은 행, <code>record_id<\/code>가 중복된 행은 거부하고 사유를 기록한다. 필수 열 자체가 누락되었으면 추론을 중단한다.<\/li>\n<li>원래 모델과 새 프로세스에서 복원한 모델의 동일한 테스트 입력에 대한 확률 차이는 CPU 환경에서 <code>1e-6<\/code> 이하여야 한다.<\/li>\n<\/ol>\n<h4>입력 파일 규격<\/h4>\n<p><strong><code>training.csv<\/code><\/strong><\/p>\n<pre><code class=\"language-csv\">record_id,split,temperature_c,vibration,hours_active,needs_service\nT01,train,30,2.1,180,0\nT02,train,42,5.8,260,1\nT03,validation,37,4.0,230,1\nT04,test,32,2.5,210,0\n<\/code><\/pre>\n<p><strong><code>incoming.csv<\/code><\/strong> (특성 순서를 바꾼 예시)<\/p>\n<pre><code class=\"language-csv\">record_id,hours_active,temperature_c,vibration\nN01,220,34,3.1\nN02,280,44,6.2\n<\/code><\/pre>\n<h4>출력 파일 규격<\/h4>\n<ul>\n<li><code>model_weights.pt<\/code>: 검증 Loss를 기준으로 선택한 모델의 Weight<\/li>\n<li><code>preprocessing.json<\/code>: 특성 순서, Scaling 기준, Target, 예측 Threshold<\/li>\n<li><code>test_predictions.csv<\/code>: <code>record_id,actual,probability,predicted<\/code><\/li>\n<li><code>incoming_predictions.csv<\/code>: <code>record_id,probability,predicted<\/code><\/li>\n<li><code>rejected_rows.csv<\/code>: <code>record_id,error_code<\/code> (오류 코드는 <code>INVALID_VALUE<\/code>, <code>DUPLICATE_ID<\/code>)<\/li>\n<li><code>handoff_report.json<\/code>: <code>feature_order<\/code>, <code>test_accuracy<\/code>, <code>reload_max_abs_diff<\/code><\/li>\n<\/ul>\n<p>예측 확률은 소수점 여섯째 자리까지 기록합니다. 원본 모델과 복원한 모델의 예측 결과를 비교할 때는 <strong>반올림 전<\/strong> 확률을 사용합니다.\n<code>torch.load()<\/code>는 프로젝트에서 생성한 신뢰할 수 있는 파일에 한해 사용하며, <code>weights_only=True<\/code> 옵션을 적용합니다.<\/p>\n<h4>검증 기준<\/h4>\n<ul>\n<li><code>incoming.csv<\/code>의 특성 열 순서가 달라도 동일한 예측 결과가 나오는지 확인<\/li>\n<li>추론 과정에서 <code>eval()<\/code>과 <code>torch.no_grad()<\/code>를 올바르게 적용했는지 확인<\/li>\n<li>잘못된 Dtype·Shape, 필수 특성 누락, Scaling 기준 불일치를 감지하는지 확인<\/li>\n<li>마지막 Epoch가 아닌 최저 검증 Loss를 기준으로 선택한 Weight가 저장·복원되는지 확인<\/li>\n<\/ul>\n","steps":[{"title":"STEP 1. 학습 결과 정리","html":"<p>모델의 Weight뿐 아니라 입력 특성의 순서, Scaling 기준, 모델 구조, 자료형, 예측 Threshold도 함께 보관합니다. 별도의 프로세스에서도 동일한 모델과 전처리 과정을 재현할 수 있도록 저장 방식을 설계합니다.<\/p>\n<pre><code class=\"language-python\">feature_order = [&quot;temperature_c&quot;, &quot;vibration&quot;, &quot;hours_active&quot;]\n# TODO: 학습 결과 및 전처리 정보 저장\n<\/code><\/pre>\n"},{"title":"STEP 2. 독립 추론 실행","html":"<p>학습에 사용한 메모리 객체에 의존하지 않고, 저장된 파일을 불러와 별도의 프로세스에서 모델을 복원합니다. 필요한 파일이 없거나 저장된 정보가 모델 구조와 일치하지 않으면 추론을 중단합니다.<\/p>\n"},{"title":"STEP 3. 입력 특성 정렬","html":"<p>CSV의 열 위치와 관계없이 특성 이름을 기준으로 입력 순서를 맞춥니다. 저장된 Scaling 기준을 적용한 뒤 복원한 모델로 예측을 수행합니다.<\/p>\n<pre><code class=\"language-python\"># TODO: 저장된 정보에 따라 입력 열 정렬\n# TODO: 저장된 기준으로 Scaling\n# TODO: 모델 복원 및 추론\n<\/code><\/pre>\n"},{"title":"STEP 4. 정합성 검증","html":"<p>학습 당시의 모델과 새 프로세스에서 복원한 모델에 동일한 입력을 적용합니다. 두 모델의 예측 확률을 반올림 전 값으로 비교하고, 최대 절댓값 차이가 허용 범위 이내인지 확인합니다.<\/p>\n"}]},{"id":"P-01","title":"설비 고장 위험 예측과 정비 우선순위 결정","level":"professional","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-05/README.md\">Chapter 05<\/a> · DataLoader · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a> · Binary MLP · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a> · <code>pos_weight<\/code> · Early Stopping · Group Split · Threshold<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>여러 사업장에서 설비의 온도, 진동, 경보 횟수를 수집합니다. 정비팀은 앞으로 7일 안에 고장이 발생할 가능성이 높은 설비를 파악하려고 합니다. 고장 사례는 드물고, 같은 사업장의 장비들은 사용 환경을 공유합니다. 따라서 데이터를 무작위로 분할하면 새로운 사업장에서의 모델 성능을 과대평가할 수 있습니다.<\/p>\n<p><strong>PyTorch 학습 파이프라인<\/strong>을 구축하고, 클래스 불균형에 대응하는 Loss와 Early Stopping을 적용하십시오. 사업장 단위로 성능을 평가한 뒤, 제한된 정비 인력을 고려한 경보 정책까지 구현해야 합니다.<\/p>\n<h4>제공 데이터<\/h4>\n<p>모든 CSV는 UTF-8 형식의 실습용 합성 데이터입니다. 과거 기록에는 최소 12개 사업장과 400개 이상의 유효 Sample(샘플)이 포함됩니다.<\/p>\n<p><strong><code>maintenance_history.csv<\/code><\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>열 이름<\/th>\n<th>의미<\/th>\n<th>사용 기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>record_id<\/code><\/td>\n<td>관측 기록 ID<\/td>\n<td>중복 확인·결과 추적<\/td>\n<\/tr>\n<tr>\n<td><code>site_id<\/code><\/td>\n<td>사업장 ID<\/td>\n<td>그룹 분할 기준<\/td>\n<\/tr>\n<tr>\n<td><code>asset_id<\/code><\/td>\n<td>설비 ID<\/td>\n<td>운영 예측 정렬·추적<\/td>\n<\/tr>\n<tr>\n<td><code>recorded_date<\/code><\/td>\n<td>관측 날짜<\/td>\n<td>날짜별 운영 정책에 사용<\/td>\n<\/tr>\n<tr>\n<td><code>temperature_c<\/code><\/td>\n<td>온도<\/td>\n<td>Feature(특성)<\/td>\n<\/tr>\n<tr>\n<td><code>vibration_mm_s<\/code><\/td>\n<td>진동<\/td>\n<td>특성<\/td>\n<\/tr>\n<tr>\n<td><code>alarm_count_7d<\/code><\/td>\n<td>최근 7일 경보 건수<\/td>\n<td>특성<\/td>\n<\/tr>\n<tr>\n<td><code>operating_hours<\/code><\/td>\n<td>누적 작동 시간<\/td>\n<td>특성<\/td>\n<\/tr>\n<tr>\n<td><code>failure_next_7d<\/code><\/td>\n<td>관측 뒤 7일 이내 고장 여부(0·1)<\/td>\n<td>Target 전용<\/td>\n<\/tr>\n<tr>\n<td><code>final_repair_cost<\/code><\/td>\n<td>고장 이후 확정 수리비<\/td>\n<td><strong>특성 사용 금지<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong><code>incoming_maintenance.csv<\/code><\/strong> 는 <code>failure_next_7d<\/code>, <code>final_repair_cost<\/code>가 없는 신규 관측 기록입니다. 신규 입력에는 과거 학습 데이터에 없던 <code>site_id<\/code>가 포함될 수 있습니다. <code>site_id<\/code>와 <code>asset_id<\/code>는 모델 입력 특성으로 사용하지 않습니다.<\/p>\n<h4>요구사항<\/h4>\n<ol>\n<li><strong>입력 검증:<\/strong> 필수 열 누락, <code>record_id<\/code> 중복, 날짜 오류, 결측값, 비유한 수치를 확인한다. 네 숫자 특성 가운데 <code>vibration_mm_s<\/code>, <code>alarm_count_7d<\/code>, <code>operating_hours<\/code>는 음수일 수 없으며 경보 건수는 정수여야 한다. 무효 행은 <code>invalid_records.csv<\/code>로 분리한다.<\/li>\n<li><strong>그룹 분할:<\/strong> 고유 <code>site_id<\/code>를 기준으로 학습 약 60%, 검증 약 20%, 테스트 약 20%로 나눈다. <code>GroupShuffleSplit(random_state=42)<\/code>을 이용할 수 있다. 사업장 ID의 교집합은 모두 비어 있어야 한다. 그룹별 행 수가 달라 전체 샘플 비율은 다를 수 있다.<\/li>\n<li><strong>Scaling:<\/strong> 허용된 네 숫자 특성만 사용한다. 평균·표준편차는 Training(학습)에서 계산하고 검증·테스트·Incoming에 그대로 적용한다. <code>final_repair_cost<\/code>와 Target을 특성에 혼합하지 않는다.<\/li>\n<li><strong>Baseline:<\/strong> 학습 다수 클래스를 예측하는 모델을 기준으로 두고 테스트 Accuracy·Recall·F2를 함께 기록한다.<\/li>\n<li><strong>신경망:<\/strong> <code>Linear(4,16) → ReLU → Linear(16,8) → ReLU → Linear(8,1)<\/code>을 구성한다. <code>BCEWithLogitsLoss(pos_weight=...)<\/code>의 가중치는 <strong>학습 데이터의 음성 수를 양성 수로 나눈 값<\/strong>으로 계산한다. 학습에 양성 또는 음성이 하나도 없으면 학습을 중단하고 이유를 기록한다.<\/li>\n<li><strong>학습:<\/strong> <code>AdamW(lr=0.003, weight_decay=0.01)<\/code>, Batch Size 32, 최대 80 Epoch를 사용한다. 검증 Loss 기준 Patience 8로 Early Stopping을 수행하고 Best Weight를 복원한다. 동일한 Seed 42와 CPU 실행을 기본 검증 환경으로 설정한다.<\/li>\n<li><strong>Threshold 선택:<\/strong> 검증에서 <code>[0.25,0.40,0.55,0.70]<\/code> 중 F2가 최대인 Threshold를 선택한다. 동점이라면 더 큰 Threshold를 선택한다. 테스트에서 Threshold를 재선택하지 않는다.<\/li>\n<li><strong>운영 정책:<\/strong> Incoming에 선택된 Threshold를 적용한다. Threshold를 통과한 설비 중 <strong>사업장·날짜별 최대 5대의 고유 설비<\/strong>를 선정한다. 동일 설비에 여러 기록이 있다면 확률이 가장 높은 기록을 대표로 택하고, 확률이 같으면 <code>record_id<\/code> 오름차순으로 정한다. 대표 기록끼리는 점수 내림차순, 동점이면 <code>asset_id<\/code>, 다시 동점이면 <code>record_id<\/code> 오름차순으로 정렬한다. 나머지 기록에는 미선정 사유를 남긴다.<\/li>\n<li><strong>인계:<\/strong> 특성 순서·Scaling 기준·Threshold·Best Epoch·Weight를 저장하고, 재로딩 후 동일 샘플의 예측 결과가 일치하는지 확인한다.<\/li>\n<\/ol>\n<h4>입력 예시<\/h4>\n<pre><code class=\"language-csv\">record_id,site_id,asset_id,recorded_date,temperature_c,vibration_mm_s,alarm_count_7d,operating_hours,failure_next_7d,final_repair_cost\nM001,S01,A01,2026-03-01,38,4.1,2,820,0,0\nM002,S02,A14,2026-03-01,51,8.2,7,1130,1,230000\n<\/code><\/pre>\n<p>위 표는 Schema 예시이며, 실제 학습용 파일에는 여러 사업장과 충분한 양성·음성 샘플이 포함됩니다.<\/p>\n<h4>출력 파일 규격<\/h4>\n<ul>\n<li><code>invalid_records.csv<\/code>: <code>source_file,source_line,record_id,error_code<\/code><\/li>\n<li><code>split_audit.json<\/code>: 분할별 샘플·Site 수와 Site ID 교집합 크기<\/li>\n<li><code>training_history.csv<\/code>: <code>epoch,train_loss,validation_loss<\/code><\/li>\n<li><code>evaluation.json<\/code>: <code>best_epoch<\/code>, <code>pos_weight<\/code>, <code>threshold<\/code>, Baseline 및 모델의 테스트 Accuracy·Recall·F2·Confusion Matrix<\/li>\n<li><code>incoming_priorities.csv<\/code>: <code>record_id,site_id,asset_id,recorded_date,probability,selected,status<\/code> (<code>SELECTED<\/code>, <code>BELOW_THRESHOLD<\/code>, <code>CAPACITY_LIMIT<\/code>, <code>DUPLICATE_ASSET<\/code>)<\/li>\n<li><code>model_weights.pt<\/code>, <code>preprocessing.json<\/code><\/li>\n<\/ul>\n<p>평가 점수에 일률적인 하한을 두지는 않습니다. 데이터 분할의 독립성과 운영 정책을 정확히 구현했는지를 함께 확인합니다.<\/p>\n<h4>검증 기준<\/h4>\n<ul>\n<li>중복 Site 없이 분할되었는지, 학습 이후에만 얻을 수 있는 정보를 특성에서 제외했는지 확인<\/li>\n<li><code>pos_weight<\/code>와 Scaling에 테스트 또는 Incoming 정보가 섞이지 않았는지 확인<\/li>\n<li>Best 검증 Loss가 발생한 Epoch의 Weight를 선택했는지 확인<\/li>\n<li>테스트 성능과 Incoming 우선 검토 목록을 별도 결과로 보관했는지 확인<\/li>\n<li>사업장·날짜별 선정 한도와 동점 규칙, 유효하지 않은 운영 기록의 처리 결과를 확인<\/li>\n<\/ul>\n","steps":[{"title":"STEP 1. 데이터·평가 체계 설계","html":"<p>사업장 단위 분할과 입력 검증을 먼저 설계합니다. 그룹별 클래스 분포를 확인하고, Target이나 사후 확정 정보가 학습에 포함되지 않는지 점검합니다.<\/p>\n"},{"title":"STEP 2. 학습·모델 선택 정책 설계","html":"<p>클래스 불균형을 반영한 Loss, Early Stopping, 검증 데이터에서의 Threshold 선택을 연결합니다. 선택 기준과 모델 상태를 재현 가능하게 보관합니다.<\/p>\n<pre><code class=\"language-python\"># TODO: 학습 분할의 클래스 분포에 따른 Loss 구성\n# TODO: 최적 Weight와 Threshold 선택 정책\n<\/code><\/pre>\n"},{"title":"STEP 3. 운영 우선순위와 인계 검증","html":"<p>평가용 예측과 실제 정비 대상 선정은 별도로 수행합니다. 사업장·날짜별 중복 설비 처리, 선정 한도, 미선정 사유와 재로딩 후 일치성을 검증합니다.<\/p>\n"}]},{"id":"P-02","title":"시간 흐름을 반영한 전력 수요 예측","level":"professional","related":"<p><a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-06/README.md\">Chapter 06<\/a> · Regression MLP · <a href=\"https://github.com/JSeong2024/MYPAUL-PYTHONEDU/blob/main/MoreStudy/AI/Chapter-07/README.md\">Chapter 07<\/a> · Temporal Split · Scheduler · Early Stopping · Residual Analysis<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>소형 전력망 운영자는 각 지역의 다음 날 전력 수요를 예측해 공급 계획을 조정합니다. 예측 시점 이후에 확정된 수요를 Feature(특성)로 사용하거나 과거와 미래의 기록을 무작위로 섞으면, 평가 결과가 실제 운영 성능을 제대로 반영하지 못할 수 있습니다.<\/p>\n<p>미래 정보가 섞이지 않도록 데이터를 날짜별로 분할하십시오. 이어서 전력 수요 예측 MLP의 학습, Learning Rate Scheduler 적용, 예측 오차 분석과 모델 저장 기능을 구현하십시오.<\/p>\n<h4>제공 데이터<\/h4>\n<p><strong><code>microgrid_daily.csv<\/code><\/strong> 에는 다음 열이 포함됩니다.<\/p>\n<pre><code class=\"language-csv\">grid_id,date,energy_kwh,temperature_c,weekday,holiday,alarm_count,next_day_energy_kwh\nG01,2026-01-01,120,8,3,1,0,127\nG02,2026-01-01,96,8,3,1,1,92\nG01,2026-01-02,127,7,4,0,0,122\n<\/code><\/pre>\n<ul>\n<li>관측 종료 시점에 이용 가능한 특성: <code>energy_kwh<\/code>, <code>temperature_c<\/code>, <code>weekday<\/code>, <code>holiday<\/code>, <code>alarm_count<\/code><\/li>\n<li>Target: <code>next_day_energy_kwh<\/code> (다음 날 확정되는 값)<\/li>\n<li><code>weekday<\/code>는 <code>0<\/code>(월요일)부터 <code>6<\/code>(일요일)까지, <code>holiday<\/code>는 0 또는 1<\/li>\n<li>같은 <code>grid_id<\/code>와 <code>date<\/code>의 조합이 반복되어서는 안 됩니다. 실제 파일에는 날짜마다 5개 이상 구역의 기록이 포함됩니다.<\/li>\n<\/ul>\n<h4>요구사항<\/h4>\n<ol>\n<li><strong>무결성 검사:<\/strong> 날짜가 올바른 ISO 형식인지, <code>(grid_id,date)<\/code>가 중복되지 않는지, 필수 수치가 유한한지 확인한다. <code>energy_kwh<\/code>, <code>alarm_count<\/code>, <code>next_day_energy_kwh<\/code>는 음수일 수 없다. 유효하지 않은 행은 오류 사유를 포함해 별도로 기록한다.<\/li>\n<li><strong>Temporal Split:<\/strong> 정상 기록의 고유 날짜를 오름차순으로 정렬한다. 첫 60% 날짜는 학습, 다음 20%는 검증, 마지막 20%는 테스트로 나누되 <strong>각 구간 사이의 경계 날짜 1일씩을 Gap으로 제외<\/strong> 한다. 이 문서에서는 <code>floor(0.6D)<\/code>, <code>floor(0.2D)<\/code>를 기준으로 날짜 구간을 먼저 나눈 뒤 학습과 검증 구간의 마지막 날짜를 제외하는 방법으로 통일한다. <code>D<\/code>는 고유 날짜 수이며, 최소 40일의 <strong>연속된 달력 날짜<\/strong>가 제공된다. 따라서 경계에서 제외하는 각 날짜는 달력 기준 1일에 해당한다.<\/li>\n<li><strong>Baseline:<\/strong> 관측 당일 <code>energy_kwh<\/code>를 다음 날 수요의 예측값으로 사용하는 Persistence Baseline을 구현한다.<\/li>\n<li><strong>신경망:<\/strong> 위 5개 특성을 입력받는 <code>Linear(5,24) → ReLU → Linear(24,1)<\/code>을 학습한다. 특성 Scaling은 학습 데이터에서만 계산한다. <code>MSELoss<\/code>, <code>AdamW(lr=0.003)<\/code>, Batch Size 32를 사용한다.<\/li>\n<li><strong>학습 제어:<\/strong> 최대 120 Epoch 동안 검증 RMSE를 계산하고, <code>ReduceLROnPlateau(mode=&quot;min&quot;, factor=0.5, patience=5)<\/code>로 학습률을 조정한다. Early Stopping은 검증 RMSE 기준 Patience 15를 사용하고 Best Weight를 복원한다.<\/li>\n<li><strong>결과 평가:<\/strong> 최종 테스트에서 Baseline과 MLP의 MAE·RMSE를 계산한다. 구역별 MAE와 <code>actual - predicted<\/code>인 Residual을 함께 기록하고, 가장 큰 과소 예측 5건을 기록한다. 과소 예측은 <code>actual - predicted<\/code>가 큰 순서이며 동점은 <code>date<\/code>, <code>grid_id<\/code> 오름차순으로 정한다.<\/li>\n<li><strong>모델 전달:<\/strong> Best Weight, Scaling 기준, 학습 설정, 데이터 분할 날짜를 저장하고, 재로딩된 모델의 추론 결과를 비교한다.<\/li>\n<\/ol>\n<h4>출력 파일 규격<\/h4>\n<ul>\n<li><code>invalid_daily.csv<\/code>: <code>source_line,grid_id,date,error_code<\/code><\/li>\n<li><code>split_dates.json<\/code>: Train·검증·테스트 날짜 수와 경계·Gap 날짜<\/li>\n<li><code>training_history.csv<\/code>: <code>epoch,train_mse,validation_rmse,learning_rate<\/code><\/li>\n<li><code>model_comparison.json<\/code>: 테스트 Baseline 및 MLP의 <code>mae,rmse<\/code>, <code>best_epoch<\/code><\/li>\n<li><code>test_predictions.csv<\/code>: <code>grid_id,date,actual,baseline_prediction,model_prediction,residual<\/code><\/li>\n<li><code>grid_report.csv<\/code>: <code>grid_id,sample_count,mae<\/code><\/li>\n<li><code>underprediction_top5.csv<\/code>: <code>grid_id,date,actual,model_prediction,residual<\/code><\/li>\n<li><code>model_weights.pt<\/code>, <code>preprocessing.json<\/code><\/li>\n<\/ul>\n<p>예측값과 오차는 CSV에 소수점 넷째 자리까지 기록합니다. 평가 지표는 반올림 전 값으로 계산합니다.<\/p>\n<h4>검증 기준<\/h4>\n<ul>\n<li>동일한 날짜의 Sample(샘플)이 서로 다른 분할에 섞이지 않는지 확인<\/li>\n<li>Train과 검증 사이, 검증과 테스트 사이에서 Target의 다음 날 정보가 넘어가지 않도록 Gap을 적용했는지 확인<\/li>\n<li><code>scheduler.step(validation_rmse)<\/code>가 검증 측정 후 실행되는지 확인<\/li>\n<li>Best Model(모델)의 테스트 점수만 최종 기록하고, 테스트 지표로 Early Stopping을 조정하지 않는지 확인<\/li>\n<li>전력 사용량이 0인 날짜와 과소 예측이 큰 날짜를 올바르게 처리하는지 확인<\/li>\n<\/ul>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHoAAAJPCAYAAAADqLNRAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAXEgAAFxIBZ5/SUgABAABJREFUeJzs3XdcU9f7B/BPAmHvvZcMRVHBhRs3CuJuFXfVWquto9rWTrXj26qtVmtrl9q69wK3goKAinsgskUEGbI3yf39kR9XQhJmIIE879eLl9x7z733OQlB8uSc53AYhmFACCGEEEIIIYQQQto8rrwDIIQQQgghhBBCCCGyQYkeQgghhBBCCCGEkHaCEj2EEEIIIYQQQggh7QQlegghhBBCCCGEEELaCUr0EEIIIYQQQgghhLQTlOghhBBCCCGEEEIIaSco0UMIIYQQQgghhBDSTlCihxBCCCGEEEIIIaSdoEQPIYQQQgghhBBCSDtBiR5CCCGEEEIIIYSQdoISPYQQQgghhBBCCCHtBCV6CCGEEEIIIYQQQtoJSvQQQgghhBBCCCGEtBOU6CGEEEIIIYQQQghpJyjRQwghhLRhPj4+4HA4Il+7du2Sd1iEEEIIIUROKNHTgnbt2iX2xzeHw4GOjg4yMzOlnjdnzhyxc+bMmdN6gbchkh4rDocDFRUVqKurQ09PD3Z2dvDy8sLEiRPx9ddfIywsTN5htxppj09DvpKTk+UdPmkCBwcHic+nqqoqNDU1YWhoCCcnJ/Tt2xfTp0/Hzz//jGfPnsk7bKKkbt68iW+//RZjxoyBi4sLTExMwOPxoK2tDXNzc/Tq1QvTpk3Dpk2bcPv27QZf99atW1i+fDm6desGExMTqKurw8rKCv3798c333yD1NTUBl0nISEBBw8exKpVq+Dj4wM9PT2x15aDg0MTe08IIYQQ0jJU5R2AMiouLsZ3332HX375Rd6htJhdu3Zh7ty5IvsGDx6M0NDQVrm/QCBARUUFKioqUFhYiNTUVNy9exfHjx/HunXr4O7ujo8++gjvvPNOq8RDiLzx+Xzw+XyUlZUhLy8PSUlJiIqKwr59+7By5UoMHz4cn3/+OQYPHizvUIkSOH36NL755hvcunVL4vGqqiqUlJQgMzMT0dHROHDgAADAyckJBw4cQK9evSSeV1RUhIULF2Lfvn1ix9LT05Geno6IiAj873//w5dffonVq1dLjfHq1avw8fFpfOcIIYQQQuSMRvTIyfbt25GSkiLvMJTWkydPMG/ePIwbNw6vX7+WdziEyBXDMLh48SKGDh2Kr776Cnw+X94hkXaqtLQU8+fPR0BAgNQkT10SExOl/t9ZWFiIESNGSEzySIrjs88+w5IlS6S2YRim0fERQgghhCgCGtEjJxUVFVizZg127twp71DaHV1dXcyaNQuA8NPd9PR03Lx5E3l5eWJtT506hWHDhiE8PBza2tqtHKl81Hx86qKnp9cK0ZDW0LFjRwwbNgwMwyAvLw/JycmIjo5GRUWFSDuBQIBvvvkG6enp+Ouvv+QULWmv+Hw+3nrrLQQFBUk8rqWlhT59+sDGxgaamprIy8tDYmIiHj58iPLy8nqv/9FHHyEqKkpkH4fDwbBhw2Bvb4/bt2/j3r17Ise3bduGAQMGYOrUqfVeX1NTE7a2tjTVkRBCCCEKjxI9crR79258/PHH6NSpk7xDaVeMjIzw66+/iuzj8/k4cuQIVq1aJVab4d69e5g7dy4OHTrUmmHKjaTHh7Rvffr0EXvOCwsLsW3bNqxduxZlZWUix/ · Fair Comparison<\/p>\n","body":"<h4>문제 설명<\/h4>\n<p>제한된 CPU 환경에서 모델을 학습하는 팀은 모델 크기와 학습 예산을 신중하게 정해야 합니다. 모델이 크다고 반드시 좋은 결과를 얻는 것은 아닙니다. 같은 학습 예산에서 실행 시간을 측정하고, Batch Size가 제한된 상황에서도 Gradient를 정확히 계산해 성능과 자원 사용량을 함께 비교해야 합니다.<\/p>\n<p>두 모델 구조와 두 Batch 처리 전략을 비교하여 제한된 자원에 적합한 구성을 선택하십시오.<\/p>\n<h4>제공 데이터<\/h4>\n<p><code>quality_train.csv<\/code>는 다음 형식의 Binary Classification 데이터입니다. 모든 행은 합성 데이터이며, <code>split<\/code>은 <code>train<\/code>, <code>validation<\/code>, <code>test<\/code> 중 하나입니다.<\/p>\n<pre><code class=\"language-csv\">record_id,split,f1,f2,f3,f4,defective\nQ001,train,0.3,12,2.1,5,0\nQ002,train,0.8,20,4.3,3,1\nQ003,validation,0.5,18,3.1,4,1\nQ004,test,0.1,9,1.5,6,0\n<\/code><\/pre>\n<p>실제 파일에는 각 분할마다 최소 50개 Sample(샘플)이 포함됩니다. Feature(특성)는 유한한 수치이며, Target은 0 또는 1입니다.<\/p>\n<h4>요구사항<\/h4>\n<ol>\n<li><strong>모델 후보:<\/strong> 구조 S는 <code>Linear(4,8) → ReLU → Linear(8,1)<\/code>, 구조 L은 <code>Linear(4,32) → ReLU → Linear(32,16) → ReLU → Linear(16,1)<\/code>이다. 각각의 학습 가능한 Parameter(파라미터) 수를 기록한다.<\/li>\n<li><strong>실험 조건:<\/strong> <code>torch.manual_seed(42)<\/code>, CPU, <code>num_workers=0<\/code>을 기준으로 한다. <code>BCEWithLogitsLoss<\/code>와 <code>AdamW(lr=0.005)<\/code>를 사용한다. Train의 전처리 기준과 분할은 모든 후보가 공유한다.<\/li>\n<li><strong>업데이트 예산:<\/strong> 각 후보가 최대 <strong>120회 Optimizer Update<\/strong>까지만 수행하도록 한다. Epoch 수는 데이터셋 크기에 따라 달라질 수 있으며 Update 횟수로 예산을 비교한다. 같은 후보를 비교할 때는 동일한 초기 Weight와 샘플 순서를 사용한다.<\/li>\n<li><strong>Effective Batch Size 64:<\/strong> 방법 A는 가능한 경우 한 번에 최대 64개 샘플을 처리한다. 방법 B는 최대 32개 샘플로 구성된 Micro-Batch를 순차적으로 처리하며, <strong>64개 샘플에 해당하는 Gradient를 누적한 뒤 Optimizer Update를 한 번 수행<\/strong>한다. 마지막 Batch에 남은 샘플이 64개보다 적어도 버리지 않는다. 이때는 실제 샘플 수를 기준으로 평균 Loss를 계산한다.<\/li>\n<li><strong>Gradient Clipping:<\/strong> 각 Optimizer Update 직전, 누적된 Gradient에 <code>clip_grad_norm_(..., max_norm=1.0)<\/code>을 한 번 적용한다. Micro-Batch마다 개별 Clipping을 수행하지 않는다.<\/li>\n<li><strong>비교 결과:<\/strong> 각 구성에서 Validation(검증) Accuracy와 Loss, Update 수, 파라미터 수, 실제 학습 시간을 기록한다. 단일 실행 시간만으로 판단하지 않도록 <strong>각 설정 3회 측정값의 중앙값<\/strong>을 기록한다. 시간은 전처리·검증·파일 저장을 제외한 학습 Update 구간에서 측정한다. 측정용 실행에서는 매번 초기 상태를 복원한다.<\/li>\n<li><strong>모델 선택:<\/strong> 세 번 실행한 검증 Accuracy의 평균이 가장 높은 설정을 선택하고, 동점이면 중앙 실행 시간이 더 짧은 구성을 선택한다. 중앙값까지 동일하면 구조 S, 그다음 방법 A를 우선한다. 확정 후 테스트 Accuracy·F1을 한 번 계산한다.<\/li>\n<li><strong>결과 해석:<\/strong> Micro-Batch 결과가 실제 Batch 방식과 얼마나 다른지 비교한다. CPU 부동소수점 연산 순서에 따른 작은 차이는 허용하며, 모델 크기와 수행 시간만으로 정확도를 보장하지 않는다.<\/li>\n<\/ol>\n<h4>출력 파일 규격<\/h4>\n<ul>\n<li><code>runs.csv<\/code>: <code>architecture,batch_strategy,run_id,optimizer_updates,validation_loss,validation_accuracy,elapsed_seconds<\/code><\/li>\n<li><code>comparison.csv<\/code>: <code>architecture,batch_strategy,parameter_count,median_seconds,mean_validation_accuracy<\/code><\/li>\n<li><code>selected_model.json<\/code>: <code>architecture,batch_strategy,best_validation_accuracy,test_accuracy,test_f1<\/code><\/li>\n<li><code>gradient_audit.json<\/code>: 동일한 초기 Weight·입력에서 실제 Batch와 Micro-Batch로 계산한 Gradient의 최대 절댓값 차이<\/li>\n<li><code>training_report.md<\/code>: 실험 조건, 학습 예산, 마지막 Batch 처리 방식, 실제 차이의 해석<\/li>\n<\/ul>\n<p>학습 시간은 CPU 환경에 따라 달라질 수 있습니다. 실행 시간이 <strong>특정 초 이하<\/strong>여야 한다는 조건은 없습니다. 다만 빠르게 실행되더라도 Gradient 계산이나 평가 결과가 잘못되었다면 완성으로 인정하지 않습니다.<\/p>\n<h4>검증 기준<\/h4>\n<ul>\n<li>Update 수와 Epoch 수를 혼동하지 않았는지 확인<\/li>\n<li>Micro-Batch별 Loss를 실제 샘플 수에 따라 가중하여, 하나의 Effective Batch에 대한 평균 Gradient를 계산했는지 확인<\/li>\n<li>Dataset 크기가 64의 배수가 아니어도 마지막 샘플까지 학습에 사용하는지 확인<\/li>\n<li>동일 후보의 반복 실험에서 초기 Weight와 난수 조건을 복원했는지 확인<\/li>\n<li>검증의 설정 선택과 최종 테스트 평가를 분리했는지 확인<\/li>\n<\/ul>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHoAAAJPCAYAAAADqLNRAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAXEgAAFxIBZ5/SUgAA+gdJREFUeJzs3XdcU1f/B/BP2Hujsl0otSqCEy2iaNXiwL2t1Po8WveoVltt1drH1rpXq3Vv616odU8cuFBqtSJDBZUlskdyf3/4SzQmQIBACHzerxev1nPPPeeb5N7k5Jt7zxEJgiCAiIiIiIiIiIi0no6mAyAiIiIiIiIiIvVgooeIiIiIiIiIqIJgooeIiIiIiIiIqIJgoo
